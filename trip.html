const LTeen={title:"Teen Patti",e:"🃏",d:"3-card poker. Everyone bets secretly on their own phone.",min:2,max:6,
  rules:"20 coins each, 1 coin boot per round. Look at your 3 cards and bet 1, 2, 3 or 5 blind, or pack. When everyone has bet, the cards are revealed and the best hand among those who didn't pack takes the pot. Hands from best to worst: Trail, Pure sequence, Sequence, Colour, Pair, High card. Most coins after 8 rounds wins.",
  init(n){const st={chips:Array(n).fill(20),round:0,max:8,carry:0};this.deal(st);return st},
  deal(st){st.round++;st.inr=st.chips.map((c,i)=>c>0?i:-1).filter(i=>i>=0);st.pot=st.carry;st.carry=0;st.inr.forEach(i=>{st.chips[i]--;st.pot++});const d=deck52();st.hands=st.chips.map(()=>null);st.inr.forEach(i=>st.hands[i]=[d.pop(),d.pop(),d.pop()]);st.bets={};st.phase="bet";st.fx={s:"whoosh"}},
  move(st,me,mv){
    if(mv.x==="bet"){if(st.phase!=="bet")throw new Error("Betting is closed.");if(!st.inr.includes(me))throw new Error("You're out of coins.");if(st.bets[me]!=null)throw new Error("You already bet.");const v=+mv.v;if(v>st.chips[me])throw new Error("Not enough coins.");
      st.bets[me]=v;if(v){st.chips[me]-=v;st.pot+=v}st.fx={s:v?"coin":"pop"};
      if(st.inr.every(i=>st.bets[i]!=null)){const live=st.inr.filter(i=>st.bets[i]);let W=[];if(live.length===1)W=live;else if(live.length>1){let best=null;live.forEach(i=>{const e=tpEval(st.hands[i]);if(!best||cmpHand(e,best)>0){best=e;W=[i]}else if(cmpHand(e,best)===0)W.push(i)})}
        const pot=st.pot;if(W.length){const sh=Math.floor(pot/W.length);W.forEach(i=>st.chips[i]+=sh);st.carry=pot-sh*W.length}else st.carry=pot;st.res={W,pot};st.phase="show";st.fx={s:"win",c:60}}return st}
    if(mv.x==="next"){if(st.phase!=="show")return st;st.scores=st.chips.slice();if(st.chips.filter(c=>c>0).length<=1||st.round>=st.max){st.over=true;st.winners=winnersOf(st.chips);return st}this.deal(st);return st}
    throw new Error("Unknown move")},
  view(st,me){let h=lgChips(st.chips.map((c,i)=>({i,txt:c+" 🪙",dim:!st.inr.includes(i),on:st.phase==="bet"&&st.inr.includes(i)&&st.bets[i]==null})));
    if(st.over)return h+lgOver(st,"🪙");
    h+=`<div class="muted small" style="text-align:center">Round ${st.round} of ${st.max} · Pot <b class="mono" style="color:var(--yellow)">${st.pot} 🪙</b></div>`;
    if(st.phase==="bet"){const waiting=st.inr.filter(i=>st.bets[i]==null);
      if(me>=0&&st.inr.includes(me)){const hand=st.hands[me],ev=tpEval(hand);h+=`<div class="hand">${hand.map(pcHtml).join("")}</div><div class="gbanner">${TPN[ev[0]]}</div>`;
        if(st.bets[me]==null)h+=`<p class="gnote">Bets are secret until everyone's in. Bluff if you dare.</p><div class="betgrid">${[1,2,3,5].map(v=>`<button class="btn ${v>=3?"":"alt"}" data-act="lg" data-x="bet" data-v="${v}" ${v>st.chips[me]?"disabled":""}>Chaal ${v} 🪙</button>`).join("")}</div><button class="btn ghost" data-act="lg" data-x="bet" data-v="0">🙅 Pack</button>`;
        else h+=`<div class="pill neutral" style="align-self:center">${st.bets[me]?"You bet "+st.bets[me]+" 🪙":"You packed"} · waiting for ${waiting.map(i=>esc(lgName(i))).join(", ")}</div>`}
      else h+=`<div class="gbanner">⏳ Waiting for bets…</div>`;return h}
    const r=st.res;return h+`<div class="gbanner">${r.W.length?`🏆 ${r.W.map(i=>i===me?"You":esc(lgName(i))).join(" & ")} win${r.W.length>1||r.W[0]===me?"":"s"} ${r.pot} 🪙`:"Everyone packed! Pot rolls over"}</div>
     <div class="list">${st.inr.map(i=>{const b=st.bets[i],ev=tpEval(st.hands[i]);return `<div class="glass tp-row${r.W.includes(i)?" winrow":""}"><div class="row" style="justify-content:space-between"><span class="row">${lgAv(i,28)}<b>${i===me?"You":esc(lgName(i))}</b></span><span class="pill ${b?"neutral":"bad"}">${b?"bet "+b+" 🪙":"packed"}</span></div><div class="hand sm">${st.hands[i].map(pcHtml).join("")}</div><div class="muted small">${TPN[ev[0]]}</div></div>`}).join("")}</div>${me>=0?`<button class="btn" data-act="lg" data-x="next">Next round →</button>`:""}`}};

const LUno={title:"Crazy Colours",e:"🌈",d:"UNO rules. Your hand stays on your phone.",min:2,max:6,
  rules:"Match the top card by colour or number/symbol. ⊘ skips the next player, ⇄ reverses, +2 makes the next player draw 2 and miss a turn. ★ Wild picks the colour; +4 picks the colour and the next player draws 4. Can't play? Draw one. First to empty his hand wins.",
  init(n){const st={deck:unoDeck()};st.hands=Array.from({length:n},()=>st.deck.splice(0,7));let t=st.deck.pop();while(t.c==="W"){st.deck.unshift(t);t=st.deck.pop()}st.disc=[t];st.color=t.c;st.turn=0;st.dir=1;st.drew=false;st.msg="First card: "+UNAME[t.c]+" "+uLabel(t.v);return st},
  nx(st,k){const n=st.hands.length;return ((st.turn+st.dir*k)%n+n)%n},
  ok(st,c){const t=st.disc[st.disc.length-1];return c.c==="W"||c.c===st.color||c.v===t.v},
  draw(st,n,p){for(let k=0;k<n;k++){if(!st.deck.length){const t=st.disc.pop();st.deck=shuffle(st.disc).map(c=>c);st.disc=[t]}if(!st.deck.length)break;st.hands[p].push(st.deck.pop())}},
  move(st,me,mv){if(st.over)return st;if(me!==st.turn)throw new Error("Wait for your turn.");const nm=lgName(me);
    if(mv.x==="draw"){if(st.drew)throw new Error("You already drew.");this.draw(st,1,me);st.drew=true;const c=st.hands[me][st.hands[me].length-1];if(!this.ok(st,c)){st.msg=nm+" drew and passed.";st.turn=this.nx(st,1);st.drew=false}else st.msg=nm+" drew a card…";st.fx={s:"pop"};return st}

    if(mv.x==="play"){const i=+mv.i,c=st.hands[me][i];if(!c||!this.ok(st,c))throw new Error("You can't play that card.");if(c.c==="W"&&!UCOL[mv.c])throw new Error("Pick a colour.");
      st.hands[me].splice(i,1);st.disc.push(c);st.color=c.c==="W"?mv.c:c.c;let msg=nm+" played "+(c.c==="W"?(c.v==="W4"?"Wild +4":"Wild")+" → "+UNAME[st.color]:UNAME[c.c]+" "+uLabel(c.v)),step=1;st.fx={s:"pop"};
      if(!st.hands[me].length){st.over=true;st.winners=[me];st.scores=st.hands.map((h,k)=>k===me?1:0);st.msg=msg;return st}
      if(st.hands[me].length===1){msg+=" · UNO! 🔥";st.fx={s:"tada",c:30}}
      if(c.v==="S"){step=2;msg+=" · "+lgName(this.nx(st,1))+" skipped"}
      if(c.v==="R"){if(st.hands.length===2)step=2;else st.dir*=-1;msg+=" · Reverse!"}
      if(c.v==="D2"||c.v==="W4"){const v=this.nx(st,1),n=c.v==="D2"?2:4;this.draw(st,n,v);step=2;msg+=" · "+lgName(v)+" draws "+n+" 😬";st.fx={s:"no"}}
      st.msg=msg;st.turn=this.nx(st,step);st.drew=false;return st}
    throw new Error("Unknown move")},
  view(st,me){let h=lgChips(st.hands.map((hd,i)=>({i,txt:hd.length+" 🂠",on:i===st.turn&&!st.over})));
    if(st.over)return h+`<div class="gnote">${esc(st.msg)}</div>`+lgOver(st,"🏆");
    const t=st.disc[st.disc.length-1];h+=`<div class="uno-table">${ucHtml(t,{big:true})}<div class="stack" style="gap:8px;align-items:flex-start"><span class="muted small">Play on</span><span class="pill" style="background:${UCOL[st.color]};color:#fff">${UNAME[st.color]}</span><span class="muted small">${st.dir===1?"↻":"↺"} ${st.turn===me?"<b style='color:var(--yellow)'>YOUR TURN</b>":esc(lgName(st.turn))+"'s turn"}</span></div></div><div class="gnote">${esc(st.msg)}</div>`;
    if(me<0)return h;

function ytId(url){url=(url||"").trim();if(/^[\w-]{11}$/.test(url))return url;const m=url.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/);return m?m[1]:""}

function ytQueue(firstId){const list=shuffledVids(firstId);if(!list.length)return false;ytList=list;ytQ=true;curSong=list[0];
  const np=$("#np");np.hidden=false;np.classList.remove("sp");$("#spBox").hidden=true;$("#ytHost").hidden=false;$("#npTitle").textContent=list[0].title;try{SPC&&SPC.pause()}catch(e){}

function loadYT(){if(ytLoading)return;ytLoading=true;window.onYouTubeIframeAPIReady=()=>{YT_P=new YT.Player("ytPlayer",{width:"220",height:"200",playerVars:{playsinline:1,origin:/^https?:/.test(location.protocol)?location.origin:undefined,controls:0,disablekb:1,rel:0,modestbranding:1},events:{
    onReady:()=>{ytReady=true;muErr=0;if(muQueued){const q=muQueued;muQueued=null;if(q.queue)ytQueue(q.first);else playSong(q)}},
    onStateChange:e=>{const b=$("#npPlay");if(e.data===1&&ytQ){try{const id=YT_P.getVideoData().video_id,x=S.songs.find(q=>q.vid===id);if(x){curSong=x;$("#npTitle").textContent=x.title;muErr=0}}catch(er){}}if(e.data===1){if(b)b.textContent="⏸";$("#np").classList.add("playing")}else if(e.data===2){if(b)b.textContent="▶";$("#np").classList.remove("playing")}else if(e.data===0){$("#np").classList.remove("playing");if(b)b.textContent="↺";if(!$("#np").hidden&&!ytQ)setTimeout(nextSong,600)}},
    onError:e=>{if(ytQ){muErr++;try{const id=YT_P.getVideoData().video_id,x=S.songs.find(q=>q.vid===id);if(x&&store&&(e.data===101||e.data===150))store.set(["songs",x.id,"blocked"],true).catch(()=>{})}catch(er){}
        if(muErr>=Math.min(5,ytList.length)){toast("YouTube won't play these right now. Try again later.");stopMusic();return}setTimeout(()=>{try{YT_P.nextVideo()}catch(er){}},800);return}
      const c=e&&e.data,sg=curSong;let why;
      if(c===101||c===150){why="“"+(sg?sg.title:"This song")+"” doesn't allow playing inside other apps. In 🎮 Play → playlist, tap ‘change link’ and paste a different upload (search the song + ‘audio’ or ‘lyrics’ on YouTube).";if(sg&&sg.id&&store)store.set(["songs",sg.id,"blocked"],true).catch(()=>{})}
      else if(c===100)why="That video is private or deleted. Paste another link for it.";
      else if(location.protocol==="file:")why="YouTube songs only play from the GitHub link, not a downloaded file.";
      else why="YouTube refused that song (error "+c+"). Try another link for it.";
      muErr++;const others=playableSongs().filter(x=>!x.blocked&&(!sg||x.id!==sg.id));toast(why);
      if(muErr>=3||!others.length){stopMusic();muErr=0;return}setTimeout(()=>playSong(others[Math.floor(Math.random()*others.length)]),2600)}}})};
  const t=document.createElement("script");t.src="https://www.youtube.com/iframe_api";t.onerror=()=>{ytLoading=false};document.head.appendChild(t)}

let SPC=null,spLoading=false,spQueued=null,spEnd=52,spLast=0,spWas=false,spToken=0,userPaused=false;
function autoNext(tok){if(tok!==spToken)return;spToken++;nextSong()}
function spId(u){u=(u||"").trim();const m=u.match(/track[\/:]([A-Za-z0-9]{22})/);return m?m[1]:/^[A-Za-z0-9]{22}$/.test(u)?u:""}
function spPlay(sng){spEnd=+sng.end||52;spToken++;$("#spBox").hidden=false;$("#np").classList.add("sp");
  if(!SPC){spQueued=sng;if(spLoading)return;spLoading=true;
    window.onSpotifyIframeApiReady=api=>{const q=spQueued;api.createController($("#spEmbed"),{uri:"spotify:track:"+q.sp,width:"100%",height:80},c=>{SPC=c;
      c.addListener("ready",()=>{try{c.play();if(+spQueued.start)setTimeout(()=>c.seek(+spQueued.start),900)}catch(e){}});
      c.addListener("playback_update",e=>{const d=e&&e.data;if(!d)return;const np=$("#np"),b=$("#npPlay");np.classList.toggle("playing",!d.isPaused);if(b)b.textContent=d.isPaused?"▶":"⏸";const tok=spToken;
        if(!d.isPaused&&d.duration>spEnd*1000+2000&&d.position>=spEnd*1000){autoNext(tok);return}
        if(d.isPaused&&spWas&&!userPaused&&d.duration>0&&spLast>=d.duration-2500){spWas=false;autoNext(tok);return}
        if(!d.isPaused){spWas=true;spLast=d.position}})})};
    const t=document.createElement("script");t.src="https://open.spotify.com/embed/iframe-api/v1";t.async=true;t.onerror=()=>{spLoading=false;toast("Couldn't reach Spotify. Check your connection.")};document.head.appendChild(t);return}
  spQueued=sng;spWas=false;spLast=0;userPaused=false;try{SPC.loadUri("spotify:track:"+sng.sp);setTimeout(()=>{try{SPC.play();if(+sng.start)setTimeout(()=>SPC.seek(+sng.start),900)}catch(e){}},700)}catch(e){}}

    case "suggest":suggestSheet(d.date?{date:d.date}:null);break;
    case "suggest-idea":{const it=IDEAS[ui.ideaCity][+d.i];suggestSheet({title:it[1],city:ui.ideaCity,note:it[2],time:it[4]});break}
    case "suggest-bored":{if(ui.bored==null)break;const b=BORED[ui.bored];suggestSheet({title:b[1],city:b[2]==="KL"?"KL":"SG"});break}
    case "bored":rollBored();break;
    case "idea-city":ui.ideaCity=d.c;snd("pop");schedule();break;
    case "p-city":el.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===el));snd("pop");break;
    case "toggle-plan":{const p=S.plan.find(x=>x.id===d.id);if(p)write(s=>s.set(["plan",d.id,"done"],!p.done)).then(ok=>{if(ok&&!p.done){snd("tada");confetti(null,null,40);floatText("✓")}});break}
    case "propose-remove-plan":{const p=S.plan.find(x=>x.id===d.id);if(p)armDelete(el,()=>propose("removePlan",{planId:p.id,title:p.title}));break}
    case "new-proposal":proposalPicker();break;
    case "vote":castVote(d.id,d.v);break;
    case "withdraw":armDelete(el,()=>write(s=>s.del(["proposals",d.id]),"Proposal withdrawn"));break;
    case "toggle-decided":ui.showDecided=!ui.showDecided;schedule();break;
    case "add-quest":newQuestSheet();break;
    case "open-quest":if(!d.id)break;if(!meOk()){const q=d.id;whoSheet("Log in to tick off quests",()=>questSheet(q));break}questSheet(d.id);break;
    case "quest-toggle":{const q=S.quests.find(x=>x.id===d.q);if(!q)break;const on=(q.doneBy||[]).includes(d.id),nb=on?(q.doneBy||[]).filter(x=>x!==d.id):(q.doneBy||[]).concat(d.id);
      el.setAttribute("aria-pressed",String(!on));el.lastElementChild.textContent=!on?"Done ✓":"Not yet";
      write(s=>s.set(["quests",d.q,"doneBy"],nb)).then(ok=>{if(ok&&!on){snd("tada");buzz([20,30,20]);confetti(null,null,90);floatText("+"+q.points)}});break}
    case "wheel-q":ui.wheelQ=+d.i;ui.wheelResult="";snd("pop");schedule();break;
    case "spin":spin();break;
    case "game":openGame(d.g);break;
    case "lg-create":createRoom(d.g);break;
    case "lg-join":joinRoom(d.c);break;
    case "lg-open":if(needLive())openRoom(d.c);break;
    case "lg-exit":closeLive();break;
    case "lg-leave":leaveRoom();break;
    case "lg-end":armDelete(el,()=>endRoom());break;
    case "lg-start":lgStart();break;
    case "lg-rematch":lgRematch();break;
    case "lg-help":if(LG){LG.ui.help=!LG.ui.help;lgRender()}break;
    case "lg":{const mv=Object.assign({},d);delete mv.act;if(LG)LG.ui.wild=null;lgMove(mv);break}
    case "lgu":if(LG){LG.ui[d.k]=d.v===""?null:+d.v;snd("tick");lgRender()}break;
    case "g":gameAct(d.x,d);break;
    case "g-close":closeGame();break;
    case "g-help":if(G){G.help=!G.help;gRender()}break;
    case "quest-pack":propose("questPack",{});break;
    case "dare":rollDare();break;
    case "del-pack":write(s=>s.del(["packing",d.id]));break;
    case "mu-toggle":{if(curSong&&curSong.sp&&SPC){userPaused=$("#np").classList.contains("playing");try{SPC.togglePlay()}catch(e){}break}if(!YT_P||!ytReady){musicOnOpen();break}const st=YT_P.getPlayerState();if(st===1)YT_P.pauseVideo();else if(st===0&&curSong)playSong(curSong);else YT_P.playVideo();break}
    case "mu-next":nextSong();break;
    case "pics-tab":picsTab=d.k;picsHtml.open=true;schedule();break;
    case "pic-del":{const k2=d.k;armDelete(el,()=>delPic(k2).then(()=>toast("Photo removed")).catch(e=>toast(permHelp(e))));break}
    case "mu-close":stopMusic();break;
    case "mu-play":{const x=S.songs.find(q=>q.id===d.id);if(x){if(x.vid&&!x.blocked)ytQueue(x.id);else playSong(x)}schedule();break}
    case "mu-pref":{const on=!musicWanted();lsSet("music",on?"on":"off");el.setAttribute("aria-pressed",on);if(!on)stopMusic();toast(on?"🎵 Intro music on":"🔇 Intro music off");break}
    case "mu-del":{const id=d.id;armDelete(el,()=>write(s=>s.del(["songs",id]),"Song removed"));break}
    case "mu-unlink":write(async s=>{await s.set(["songs",d.id,"vid"],"");await s.set(["songs",d.id,"sp"],"");await s.set(["songs",d.id,"spSet"],true)});break;
    case "sound":ui.sound=!ui.sound;lsSet("sound",ui.sound?"on":"off");el.setAttribute("aria-pressed",ui.sound);if(ui.sound)snd("tada");break;
    case "export":{const b=new Blob([store.exportAll()],{type:"application/json"}),a2=document.createElement("a");a2.href=URL.createObjectURL(b);a2.download="sgkl-trip-backup-"+todayStr()+".json";document.body.appendChild(a2);a2.click();a2.remove();toast("💾 Backup downloaded");break}
  }
});
document.addEventListener("change",ev=>{const el=ev.target;
  if(el.dataset.pack){const p=S.packing.find(x=>x.id===el.dataset.pack);if(p){const allDone=el.checked&&S.packing.every(x=>x.id===p.id||x.done);write(s=>s.set(["packing",p.id,"done"],el.checked)).then(ok=>{if(!ok)return;if(allDone){snd("win");rain(160);toast("🧳 Fully packed! Let's goooo")}else if(el.checked)snd("pop")})}}
  if(el.dataset.rename){const m=memberById(el.dataset.rename),nm=el.value.trim();if(m&&nm&&nm!==m.name)write(s=>s.set(["members",m.id,"name"],nm),"Renamed ✏️")}
  if(el.id==="convCur")updConv();
  if(el.dataset.pickey&&el.files&&el.files[0]){const key=el.dataset.pickey;picsHtml.open=true;squareJpeg(el.files[0]).then(img=>savePic(key,img)).then(()=>{toast("🖼️ Photo added");snd("pop")}).catch(e=>toast(e&&e.message&&!/permission/i.test(e.message)?e.message:permHelp(e)))}
  if(el.dataset.songstart||el.dataset.songend){const id=el.dataset.songstart||el.dataset.songend,k2=el.dataset.songstart?"start":"end",v=Math.max(0,Math.round(+el.value||0));write(s=>s.set(["songs",id,k2],v),"⏱️ Clip updated")}
  if(el.id==="pDate")updCap();
  if(el.id==="importFile"&&el.files[0]){const r=new FileReader();r.onload=async()=>{try{await store.importAll(r.result);seenResolved=null;closeSheet();toast("💾 Backup restored");snd("tada")}catch(e){toast("That file isn't a trip backup.")}};r.readAsText(el.files[0])}
});
document.addEventListener("input",ev=>{const el=ev.target;
  if(el.id==="eAmt"&&F){F.amount=el.value;updSplit()}
  if(el.dataset.part&&F){F.parts[el.dataset.part]=el.value===""?(F.mode==="shares"?0:""):+el.value;updSplit()}
  if(el.id==="convAmt")updConv();
  if(el.id==="pTitle"&&pendingPlan){pendingPlan=null;$("#pWarn").innerHTML="";$("#pGo").textContent="Send to vote 🗳️"}
});
document.addEventListener("submit",async ev=>{const f=ev.target.closest("form[data-form]");if(!f)return;ev.preventDefault();const k=f.dataset.form;
  if(k==="exp"){if(!$("#eSave").disabled)saveExpense()}
  if(k==="member"){const nm=$("#mName").value.trim();if(!nm)return;
    if(!active().length){const id=nid();if(await write(s=>s.set(["members",id],{name:nm,color:MCOLORS[0],createdAt:Date.now()}),"🎉 Welcome, "+nm)){snd("tada");confetti(null,null,80);pinSheet(id,nm)}return}
    if(active().some(m=>m.name.toLowerCase()===nm.toLowerCase())){toast(nm+" is already in the crew.");return}
    if(openProps().some(p=>p.type==="addMember"&&p.payload.name.toLowerCase()===nm.toLowerCase())){toast("There's already a vote open for "+nm+".");return}
    if(await propose("addMember",{name:nm}))closeSheet()}
  if(k==="settings"){const r={SGD:+$("#sSGD").value||S.meta.rates.SGD,MYR:+$("#sMYR").value||S.meta.rates.MYR,INR:1};
    const m={name:$("#sName").value.trim()||DEFAULT_META.name,start:$("#sStart").value,end:$("#sEnd").value,budget:+$("#sBudget").value||0,rates:r};
    if(m.start&&m.end&&m.end<m.start){toast("The last day is before the first day.");snd("no");return}
    if(m.start&&m.end&&daysBetween(m.start,m.end)>59){toast("That's a 60+ day trip. Check the dates.");return}
    if(await write(s=>s.set(["meta"],m),"✅ Trip saved")){closeSheet();ui.animate=true;snd("coin");schedule()}}
  if(k==="plan"){const title=$("#pTitle").value.trim();if(!title){toast("Say what you want to do.");return}
    const date=$("#pDate").value,ds=tripDates();if(!ds.includes(date)){toast("Pick a day between the trip dates.");return}
    const city=(f.querySelector('#pCity [aria-pressed="true"]')||{dataset:{}}).dataset.c||"SG";
    const payload={title,city,date,time:$("#pTime").value,note:$("#pNote").value.trim()};
    const c=dayCount(date),pc=dayPending(date);
    if(c+pc>=MAX_PER_DAY&&pendingPlan!==date){pendingPlan=date;snd("no");buzz(40);
      $("#pWarn").innerHTML=`<div class="warnbox"><b>⚠️ ${fmtDay(date)} is full.</b> It already has ${c} approved activit${c===1?"y":"ies"}${pc?` and ${pc} more in voting`:""}. The limit is ${MAX_PER_DAY} per day. If this passes, the day will have ${c+1}${pc?"+":""}. Pick another day, or confirm to send it to vote anyway.</div>`;
      $("#pGo").textContent="⚠️ Suggest anyway";$("#pGo").classList.add("danger");return}
    pendingPlan=null;if(await propose("plan",payload))closeSheet()}
  if(k==="quest"){const t=$("#qText").value.trim();if(!t)return;if(await propose("quest",{text:t,city:$("#qCity").value,points:+$("#qPts").value}))closeSheet()}
  if(k==="crewpl"){const u=$("#crewPl").value.trim();if(u&&!/^https:\/\/open\.spotify\.com\/(intl-[a-z]+\/)?playlist\//.test(u)){toast("Paste a Spotify playlist link (open.spotify.com/playlist/…).");return}if(await write(s=>s.set(["crewPlaylist"],u),u?"🎧 Playlist saved for the crew":"Playlist removed"))schedule();return}
  if(k==="joincode"){joinRoom($("#joinCode").value);return}
  if(k==="songlink"){const raw=f.querySelector("input").value,sp=spId(raw),v=sp?"":ytId(raw);if(!sp&&!v){toast("Paste a Spotify or YouTube song link.");snd("no");return}const id=f.dataset.id;
    if(await write(async s=>{await s.set(["songs",id,"sp"],sp);await s.set(["songs",id,"vid"],v);await s.set(["songs",id,"blocked"],false);await s.set(["songs",id,"spSet"],true)},"🎵 Linked!")){const x=S.songs.find(q=>q.id===id);if(x)playSong(Object.assign({},x,{sp,vid:v}))}}
  if(k==="songadd"){const t=$("#songTitle").value.trim(),raw=$("#songUrl").value,sp=spId(raw),v=sp?"":ytId(raw);if(!t){toast("Add the song name.");return}if(!sp&&!v){toast("Paste the song's Spotify or YouTube link.");return}if(await write(s=>s.set(["songs","u"+nid()],{title:t,vid:v,sp,spSet:true,start:0,end:52,createdAt:Date.now()}),"🎵 Added to the playlist")){$("#songTitle").value="";$("#songUrl").value=""}}
  if(k==="pack"){const t=$("#packText").value.trim();if(!t)return;if(await write(s=>s.set(["packing",nid()],{text:t,done:false,createdAt:Date.now()}))){snd("pop");const i=$("#packText");if(i){i.value="";i.focus()}}}
});
$("#fab").addEventListener("click",()=>{snd("pop");if(!meOk()){whoSheet("Log in to add a spend",()=>expenseSheet());return}expenseSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(G){closeGame();return}if(LG){closeLive();return}if($("#revealRoot").innerHTML)$("#revealRoot").innerHTML="";else if($("#sheetRoot").innerHTML)closeSheet()}});

/* ============ routing + boot ============ */
function route(){const h=location.hash.slice(1),nt=TABS.includes(h)?h:"home";if(nt!==ui.tab||!route.done){ui.tab=nt;ui.animate=true;window.scrollTo(0,0)}route.done=true;render()}
window.addEventListener("hashchange",()=>{snd("whoosh");route()});
(function stars(){const sky=$("#sky");for(let i=0;i<55;i++){const s=document.createElement("span");s.className="star";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*70+"%";s.style.animationDelay=(Math.random()*3).toFixed(2)+"s";if(Math.random()<.2)s.style.width=s.style.height="3px";sky.appendChild(s)}})();
let splashDone=false,booted=false,asked=false;
function askWho(){if(asked||!splashDone||!booted||meOk())return;asked=true;if(!active().length)memberSheet();else whoSheet("Who are you? 👀")}
(function splash(){const sp=$("#splash");let gone=false;
  const go=()=>{if(gone)return;gone=true;musicOnOpen();sp.classList.add("out");setTimeout(()=>sp.remove(),500);ui.animate=true;render();splashDone=true;askWho()};
  sp.addEventListener("click",go);if(!musicWanted())setTimeout(go,REDUCE?0:1500)})();
(async function boot(){
  if(FIREBASE_CONFIG){try{store=await cloudStore();syncMode="cloud"}catch(e){store=null;toast("Couldn't reach the shared trip, so this phone is saving on its own for now.")}}
  if(!store){store=localStore();syncMode="local";picsInit()}
  store.start();route();booted=true;askWho();
})();
})();
</script>
</body>

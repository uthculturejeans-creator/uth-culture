<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0820">
<title>SIN–KUL Crew Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Night-sky neon world: SG skyline left, KL skyline right, glass cards, bottom tab bar */
:root{color-scheme:dark;
  --bg:#0B0820;--bg2:#171040;--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.11);--stroke:rgba(255,255,255,.13);
  --ink:#F5F2FF;--muted:#A9A1D6;--dark:#140E33;
  --pink:#FF4D8D;--orange:#FF9F43;--teal:#2EE6C9;--yellow:#FFD93D;--violet:#B794FF;--blue:#4DA3FF;
  --sg:#FF5C7A;--kl:#FFC23D;--good:#2EE6C9;--bad:#FF4D8D;
  --grad:linear-gradient(135deg,#FF4D8D 0%,#FF9F43 100%);
  --grad2:linear-gradient(135deg,#2EE6C9 0%,#4DA3FF 100%);
  --grad3:linear-gradient(135deg,#B794FF 0%,#FF4D8D 100%);
  --f-logo:"Bungee",Impact,"Arial Black",sans-serif;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Space Mono",ui-monospace,Menlo,monospace;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px;overflow-x:hidden}
[hidden]{display:none!important}
img{max-width:100%}
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(120% 80% at 50% 0%,#1E1452 0%,var(--bg) 60%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:drift 22s ease-in-out infinite alternate}
.blob.b1{width:340px;height:340px;background:#FF4D8D;top:-120px;left:-120px}
.blob.b2{width:300px;height:300px;background:#4DA3FF;top:40%;right:-140px;animation-duration:26s}
.blob.b3{width:260px;height:260px;background:#B794FF;bottom:-120px;left:20%;animation-duration:30s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.15)}100%{transform:translate(-30px,80px) scale(.95)}}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:14px}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;text-wrap:balance}
h2{font-size:26px}
h2 .em{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h3{font-size:17px}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:rgba(0,0,0,.25);border:1.5px solid var(--stroke);border-radius:14px;padding:11px 13px;width:100%;min-width:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,77,141,.18);outline:none}
select option{background:var(--bg2)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:0}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.glass{background:var(--glass);border:1px solid var(--stroke);border-radius:22px;padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.stack{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:0;border-radius:999px;padding:12px 20px;font-family:var(--f-display);font-weight:600;font-size:15px;background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(255,77,141,.35);transition:transform .18s var(--spring),filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn:active{transform:scale(.94)}
.btn.alt{background:var(--grad2);color:var(--dark);box-shadow:0 8px 22px rgba(46,230,201,.3)}
.btn.ghost{background:var(--glass2);color:var(--ink);box-shadow:none;border:1px solid var(--stroke)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.link{background:none;border:0;padding:0;color:var(--yellow);font-weight:800}
.seg{display:flex;background:rgba(0,0,0,.25);border:1px solid var(--stroke);border-radius:999px;padding:4px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 12px;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;transition:background .3s,color .3s,transform .2s var(--spring)}
.seg button[aria-pressed="true"]{background:var(--grad);color:#fff;transform:scale(1.03)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1.5px solid var(--stroke);background:var(--glass);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;transition:transform .2s var(--spring),background .2s}
.chip:active{transform:scale(.92)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--dark);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.pill.good{background:rgba(46,230,201,.16);color:var(--good)}
.pill.bad{background:rgba(255,77,141,.16);color:var(--bad)}
.pill.warn{background:rgba(255,217,61,.16);color:var(--yellow)}
.pill.neutral{background:var(--glass2);color:var(--muted)}
.code{font-family:var(--f-mono);font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:6px;color:var(--dark)}
.code.sg{background:var(--sg)}.code.kl{background:var(--kl)}.code.any{background:var(--violet)}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:var(--dark);font-family:var(--f-display);font-weight:700;font-size:13px;flex:none;border:2px solid var(--bg);box-shadow:0 0 0 2px rgba(255,255,255,.08);position:relative}
.av.gone{filter:grayscale(1);opacity:.5}
.avs{display:flex}.avs .av{margin-left:-9px}.avs .av:first-child{margin-left:0}
.empty{text-align:center;padding:28px 18px;color:var(--muted);border:2px dashed var(--stroke);border-radius:22px}
.empty .big{font-size:44px;display:block;animation:bob 2.4s ease-in-out infinite}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;margin:6px 0 4px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.warnbox{border-radius:16px;padding:12px 14px;background:rgba(255,217,61,.12);border:1.5px solid rgba(255,217,61,.5);color:var(--ink);font-size:14px}
.warnbox b{color:var(--yellow)}
#view.enter>*{animation:rise .6s var(--spring) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}

/* hero */
.hero{position:relative;border-radius:28px;overflow:hidden;padding:18px 18px 0;background:linear-gradient(180deg,#2A1A6E 0%,#4A1E6B 55%,#7A2A5E 100%);border:1px solid var(--stroke);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:2}
.tag{font-size:12px;font-weight:800;background:rgba(255,255,255,.14);padding:5px 11px;border-radius:999px;letter-spacing:.04em}
.iconbtn{border:0;background:rgba(255,255,255,.14);width:38px;height:38px;border-radius:50%;font-size:17px;transition:transform .3s var(--spring)}
.iconbtn:hover{transform:rotate(60deg)}
.logo{font-family:var(--f-logo);font-weight:400;font-size:clamp(24px,7vw,34px);line-height:1.05;margin-top:12px;position:relative;z-index:2;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.count{position:relative;z-index:2;margin-top:10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count .num{font-family:var(--f-logo);font-size:clamp(46px,15vw,64px);line-height:1;background:linear-gradient(180deg,#FFF 0%,#FFD93D 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 12px rgba(255,217,61,.35))}
.count .lbl{font-family:var(--f-display);font-weight:600;font-size:16px}
.tick{font-family:var(--f-mono);font-size:13px;color:#FFE9A8;position:relative;z-index:2;margin-top:4px;min-height:18px}
.skyline{display:block;width:calc(100% + 36px);margin:4px -18px 0;height:auto;max-width:none}
.win{animation:twinkle 2.6s ease-in-out infinite}
.routebar{position:relative;margin:0 -18px;padding:12px 18px 16px;background:rgba(10,6,30,.55);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.routebar b{font-family:var(--f-logo);font-size:18px;font-weight:400}
.routebar small{display:block;font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.08em}
.track{position:relative;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 8px,transparent 8px 14px)}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--grad)}
.track .plane{position:absolute;top:50%;font-size:22px;transform:translate(-50%,-55%) rotate(45deg);filter:drop-shadow(0 2px 6px rgba(255,159,67,.8))}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{border-radius:20px;padding:14px;position:relative;overflow:hidden;min-width:0;border:1px solid var(--stroke);background:var(--glass);text-align:left}
.stat .ico{position:absolute;right:-6px;bottom:-10px;font-size:46px;opacity:.22;transform:rotate(-12deg)}
.stat span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat strong{display:block;font-family:var(--f-mono);font-size:20px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.hot{background:var(--grad);border:0}.stat.hot span{color:rgba(255,255,255,.85)}
.stat.cool{background:var(--grad2);border:0;color:var(--dark)}.stat.cool span{color:rgba(20,14,51,.7)}
.crew{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.mate{flex:none;width:78px;text-align:center;border:0;background:none;padding:0}
.mate .av{width:58px;height:58px;font-size:20px;margin:0 auto;transition:transform .3s var(--spring)}
.mate:hover .av{transform:translateY(-4px) rotate(-6deg)}
.mate .nm{display:block;font-weight:800;font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mate .pill{margin-top:4px;font-size:10px;padding:2px 7px}
.mate.me .av{box-shadow:0 0 0 3px var(--yellow),0 0 18px rgba(255,217,61,.6)}
.mate.add .av{background:var(--glass2);color:var(--ink);border:2px dashed var(--stroke);font-size:24px}
.sync{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.3)}

/* expenses */
.exp{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;background:var(--glass);border:1px solid var(--stroke);border-radius:18px;padding:12px;text-align:left;width:100%;transition:transform .25s var(--spring),background .2s}
.exp:hover{transform:translateX(4px);background:var(--glass2)}
.cat{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.exp .t{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp .s{font-size:12px;color:var(--muted)}
.exp .amt{text-align:right}
.exp .amt b{font-family:var(--f-mono);display:block;font-size:15px}
.exp .amt small{font-family:var(--f-mono);color:var(--muted);font-size:11px}
.day-label{font-size:12px;font-weight:800;color:var(--muted);margin:4px 4px 0;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.06em}
.list{display:flex;flex-direction:column;gap:9px}
.person{display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv div{background:rgba(0,0,0,.22);border-radius:12px;padding:9px}
.kv span{display:block;font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.kv b{font-family:var(--f-mono);font-size:14px}
.bar{height:10px;background:rgba(0,0,0,.3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad2);animation:grow 1.1s var(--spring) both;transform-origin:left}
.bar i.warn{background:linear-gradient(90deg,#FFD93D,#FF9F43)}.bar i.over{background:linear-gradient(90deg,#FF9F43,#FF4D8D)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hbar{display:grid;grid-template-columns:auto 1fr 84px;gap:10px;align-items:center;font-size:13px;font-weight:700}
.hbar .tr{height:14px;background:rgba(0,0,0,.3);border-radius:8px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:8px;animation:grow 1s var(--spring) both;transform-origin:left}
.hbar b{font-family:var(--f-mono);text-align:right;font-size:12px}
.awards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.award{border-radius:18px;padding:14px;background:rgba(0,0,0,.22);border:1px solid var(--stroke);text-align:center;transition:transform .3s var(--spring)}
.award:hover{transform:rotate(-2deg) scale(1.03)}
.award .e{font-size:30px;display:block}
.award span{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.award b{display:block;font-family:var(--f-display);font-size:16px}
.award small{font-family:var(--f-mono);color:var(--muted);font-size:11px}

/* itinerary */
.line{display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:50px 24px 1fr;gap:10px;min-height:62px}
.stop .tm{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:4px;text-align:right}
.stop .rail{position:relative;display:flex;justify-content:center}
.stop .rail::before{content:"";position:absolute;top:0;bottom:0;width:6px;background:var(--lc);border-radius:3px;box-shadow:0 0 12px var(--lc)}
.stop:first-child .rail::before{top:12px}.stop:last-child .rail::before{bottom:calc(100% - 24px)}
.stop .dot{position:relative;z-index:1;margin-top:3px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:5px solid var(--lc);transition:transform .3s var(--spring)}
.stop.done .dot{background:var(--lc);transform:scale(1.15)}
.stop .body{padding-bottom:12px;min-width:0}
.stop .ttl{font-weight:800;font-size:15px}
.stop.done .ttl{text-decoration:line-through;color:var(--muted)}
.stop .note{font-size:13px;color:var(--muted)}
.stop .acts{display:flex;gap:14px;margin-top:4px}
.stop .acts button{font-size:12px}
.cap{display:inline-flex;gap:4px;align-items:center}
.cap i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.15)}
.cap i.on{background:var(--teal)}.cap.full i.on{background:var(--yellow)}.cap.over i.on{background:var(--bad)}
.dayfree{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:10px}
.idea{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--stroke)}
.idea:first-child{border-top:0}
.idea .ie{font-size:26px;line-height:1}
.idea b{display:block}
.idea p{margin:2px 0 6px;font-size:13px;color:var(--muted)}

/* votes */
.vote{display:flex;flex-direction:column;gap:12px;border-radius:22px;padding:16px;background:var(--glass);border:1px solid var(--stroke);position:relative;overflow:hidden}
.vote::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--vc,var(--violet))}
.vote .vt{display:flex;gap:12px;align-items:flex-start}
.vote .vi{font-size:28px;line-height:1;flex:none}
.vote .vh{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.25}
.vote .vs{font-size:12px;color:var(--muted);margin-top:2px}
.voters{display:flex;gap:8px;flex-wrap:wrap}
.voter{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--muted);width:52px;text-align:center}
.voter .av{width:38px;height:38px}
.voter .av::after{content:attr(data-v);position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:50%;font-size:10px;display:grid;place-items:center;background:var(--bg2);border:1.5px solid var(--stroke)}
.voter.voted .av::after{background:var(--teal);color:var(--dark);border-color:var(--teal)}
.voter.y .av::after{background:var(--teal);color:var(--dark)}
.voter.n .av::after{background:var(--bad);color:#fff;border-color:var(--bad)}
.voter span{max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vbtn{border:2px solid var(--stroke);background:rgba(0,0,0,.2);border-radius:16px;padding:12px;font-family:var(--f-display);font-weight:700;font-size:16px;transition:transform .2s var(--spring),background .2s,border-color .2s}
.vbtn:active{transform:scale(.93)}
.vbtn.yes[aria-pressed="true"]{background:rgba(46,230,201,.2);border-color:var(--teal)}
.vbtn.no[aria-pressed="true"]{background:rgba(255,77,141,.2);border-color:var(--bad)}
.vprog{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:800;color:var(--muted)}
.tally{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.res{font-family:var(--f-logo);font-size:13px;padding:5px 10px;border-radius:10px;letter-spacing:.04em}
.res.pass{background:var(--teal);color:var(--dark)}.res.fail{background:var(--bad);color:#fff}
.decided{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--stroke)}
.decided:first-child{border-top:0}

/* quests */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;padding-top:20px}
.pod{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pod .av{width:48px;height:48px;font-size:17px}
.pod .crown{font-size:24px;height:26px;animation:bob 2s ease-in-out infinite}
.pod .nm{font-weight:800;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .blk{width:100%;border-radius:14px 14px 4px 4px;display:grid;place-items:center;font-family:var(--f-logo);font-size:22px;color:var(--dark);animation:up 1s var(--spring) both;transform-origin:bottom}
.pod .pts{font-family:var(--f-mono);font-size:12px;font-weight:700}
@keyframes up{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.rest{display:flex;flex-direction:column;gap:6px}
.rest .r{display:grid;grid-template-columns:22px 32px 1fr auto;gap:10px;align-items:center;font-weight:700}
.quest{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;background:var(--glass);border:1px solid var(--stroke);border-radius:18px;padding:12px;text-align:left;width:100%;transition:transform .25s var(--spring),background .2s}
.quest:hover{transform:scale(1.02);background:var(--glass2)}
.quest .p{width:54px;height:54px;border-radius:16px;background:var(--grad3);display:grid;place-items:center;font-family:var(--f-logo);font-size:18px;line-height:1;color:#fff}
.quest .p small{display:block;font-family:var(--f-body);font-size:9px;font-weight:800;letter-spacing:.1em}
.quest.done{border-color:rgba(46,230,201,.45);box-shadow:0 0 20px rgba(46,230,201,.12)}
.quest.done .p{background:var(--grad2);color:var(--dark)}
.quest .t{display:block;font-weight:800}
.quest .s{font-size:12px;color:var(--muted)}

/* fun */
.wheel-wrap{position:relative;width:min(300px,100%);aspect-ratio:1;margin:8px auto;max-width:100%}
.wheel-wrap canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 6px rgba(255,255,255,.08),0 0 40px rgba(255,77,141,.35)}
.pointer{position:absolute;left:50%;top:-10px;transform:translateX(-50%);font-size:30px;z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.hub{position:absolute;left:50%;top:50%;width:76px;height:76px;transform:translate(-50%,-50%);border-radius:50%;border:0;background:var(--grad);color:#fff;font-family:var(--f-logo);font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.result{text-align:center;font-family:var(--f-display);font-weight:700;font-size:21px;min-height:32px}
.result.pop{animation:popin .6s var(--spring)}
@keyframes popin{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.slot{border-radius:18px;background:rgba(0,0,0,.3);border:1px solid var(--stroke);padding:18px;text-align:center;font-family:var(--f-display);font-weight:600;font-size:18px;min-height:86px;display:grid;place-items:center;gap:4px}
.slot small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:600}
.slot.rolling{animation:shake .12s linear infinite}
@keyframes shake{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--stroke)}
.check:first-child{border-top:0}
.check input{width:24px;height:24px;accent-color:var(--teal);flex:none}
.check span{flex:1;min-width:0}
.check.on span{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font-size:20px;padding:0 6px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sw{width:54px;height:30px;border-radius:99px;border:0;background:rgba(255,255,255,.18);position:relative;transition:background .3s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .35s var(--spring)}
.sw[aria-pressed="true"]{background:var(--teal)}.sw[aria-pressed="true"]::after{transform:translateX(24px)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;position:relative;display:grid;grid-template-columns:repeat(6,1fr);background:rgba(23,16,64,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--stroke);border-radius:24px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
nav .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/6);border-radius:18px;background:var(--grad);transition:transform .45s var(--spring);z-index:0}
nav.tabs a{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:800;transition:color .3s}
nav.tabs a .e{font-size:20px;transition:transform .35s var(--spring)}
nav.tabs a[aria-current="page"]{color:#fff}
nav.tabs a[aria-current="page"] .e{transform:translateY(-2px) scale(1.15)}
nav .bdg{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--yellow);color:var(--dark);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;animation:pulseB 1.6s ease-in-out infinite}
@keyframes pulseB{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(94px + env(safe-area-inset-bottom,0px));z-index:21;width:62px;height:62px;border-radius:50%;border:0;background:var(--grad);color:#fff;font-size:30px;line-height:1;box-shadow:0 10px 26px rgba(255,77,141,.5);transition:transform .25s var(--spring);animation:pulse 2.6s ease-in-out infinite}
.fab:hover{transform:rotate(90deg) scale(1.06)}
@keyframes pulse{0%,100%{box-shadow:0 10px 26px rgba(255,77,141,.5),0 0 0 0 rgba(255,77,141,.5)}50%{box-shadow:0 10px 26px rgba(255,77,141,.5),0 0 0 12px rgba(255,77,141,0)}}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(5,3,18,.6);backdrop-filter:blur(4px);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{background:linear-gradient(180deg,#22175A,#160F3E);border:1px solid var(--stroke);border-bottom:0;width:100%;max-width:620px;border-radius:28px 28px 0 0;max-height:90vh;overflow:auto;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:sheetUp .45s var(--spring) both}
@keyframes sheetUp{from{transform:translateY(100%)}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--stroke);margin:-6px auto 0}
.part{display:grid;grid-template-columns:auto 32px 1fr 100px;gap:10px;align-items:center;font-weight:700}
.part input[type=checkbox]{width:22px;height:22px;accent-color:var(--pink)}
.part input[type=number]{padding:8px;text-align:right;font-family:var(--f-mono)}
.split-note{font-size:13px;font-weight:800}
.split-note.ok{color:var(--good)}.split-note.bad{color:var(--bad)}
.big-amt{font-family:var(--f-mono)!important;font-size:30px!important;font-weight:700;padding:10px 12px!important}
.catpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.catpick button{border:1.5px solid var(--stroke);background:var(--glass);border-radius:14px;padding:8px 0;font-size:22px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .2s var(--spring)}
.catpick button small{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase}
.catpick button[aria-pressed="true"]{border-color:var(--pink);background:rgba(255,77,141,.18);transform:scale(1.08)}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.who-grid button{border:1.5px solid var(--stroke);background:var(--glass);border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:13px}
.who-grid button .av{width:46px;height:46px;font-size:16px}
.pin-dots{display:flex;gap:16px;justify-content:center}
.pin-dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);transition:transform .2s var(--spring),background .2s}
.pin-dots i.on{background:var(--yellow);border-color:var(--yellow);transform:scale(1.2)}
.pin-dots.err{animation:pinShake .4s}
@keyframes pinShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:280px}
.key{height:60px;border-radius:20px;border:1px solid var(--stroke);background:var(--glass2);font-family:var(--f-display);font-weight:600;font-size:24px;transition:transform .15s var(--spring),background .2s}
.key:active{transform:scale(.9);background:rgba(255,77,141,.25)}
.key.ghosty{background:transparent;border-color:transparent;color:var(--muted)}
.who-grid button[aria-pressed="true"]{border-color:var(--yellow);background:rgba(255,217,61,.14)}


/* games */
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gtile{position:relative;overflow:hidden;min-height:132px;border:0;border-radius:22px;padding:14px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;box-shadow:0 10px 24px rgba(0,0,0,.35);transition:transform .25s var(--spring)}
.gtile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.45));pointer-events:none}
.gtile>*{position:relative;z-index:1}
.gtile:hover{transform:translateY(-4px) rotate(-1deg)}.gtile:active{transform:scale(.95)}
.gtile .ge{position:absolute;right:10px;top:8px;font-size:40px;animation:bob 3s ease-in-out infinite;z-index:1}
.gtile b{font-family:var(--f-display);font-size:17px;line-height:1.15}
.gtile small{font-size:12px;opacity:.9;line-height:1.3}
.gtile .gpl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.stage{position:fixed;inset:0;z-index:45;background:radial-gradient(120% 70% at 50% 0%,#2A1A6E,#0B0820 70%);display:flex;flex-direction:column;animation:fade .25s both}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--stroke);background:rgba(11,8,32,.6)}
.stage-title{font-family:var(--f-display);font-size:17px;text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-body{flex:1;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-width:620px;width:100%;margin:0 auto}
.pchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pchip{flex:none;display:flex;align-items:center;gap:6px;background:var(--glass);border:1.5px solid var(--stroke);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;font-weight:700;transition:transform .3s var(--spring),border-color .3s}
.pchip b{font-family:var(--f-mono);font-size:12px}
.pchip.on{border-color:var(--yellow);transform:scale(1.05);box-shadow:0 0 16px rgba(255,217,61,.3)}
.pchip.dim{opacity:.4}
.passs{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:18px 0}
.pass-av .av{animation:bob 2.4s ease-in-out infinite}
.bounce{animation:bob 1.8s ease-in-out infinite;display:inline-block}
.gnote{text-align:center;color:var(--muted);font-size:13px;margin:0}
.gbanner{text-align:center;font-family:var(--f-display);font-weight:700;font-size:20px;animation:popin .5s var(--spring) both}
.gbanner.tie{color:var(--yellow)}
.gsub{text-align:center;color:var(--muted);font-size:13px;font-weight:800;margin-top:-8px}
.wcard{width:min(320px,100%);margin:0 auto;border-radius:24px;padding:14px;background:linear-gradient(160deg,#3B2580,#1A1045);border:2px solid #6C5BD4;box-shadow:0 14px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:10px;animation:dealIn .5s var(--spring) both}
.wcard.rare{background:linear-gradient(160deg,#7A5A00,#2A1A00);border-color:#FFD93D;box-shadow:0 0 30px rgba(255,217,61,.35)}
.wcard.small{padding:10px;gap:6px;border-radius:18px}
.wcard.win{border-color:var(--teal);box-shadow:0 0 26px rgba(46,230,201,.45)}
@keyframes dealIn{from{transform:translateY(30px) rotate(-6deg) scale(.9);opacity:0}}
.wtop{display:flex;gap:10px;align-items:center}
.wem{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:30px;flex:none}
.wcard.small .wem{width:38px;height:38px;font-size:22px;border-radius:12px}
.wname{display:block;font-family:var(--f-display);font-size:18px;line-height:1.15}
.wcard.small .wname{font-size:14px}
.wtop small{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.05em}
.wcard.rare .wtop small{color:#FFE9A8}
.wab{font-weight:800;font-size:13px;background:rgba(0,0,0,.25);border-radius:10px;padding:6px 10px}
.wab small{color:var(--muted);font-weight:700}
.wfl{font-size:12px;color:var(--muted);font-style:italic}
.wstats{display:flex;flex-direction:column;gap:6px}
.wstat{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:12px;padding:9px 12px;background:rgba(0,0,0,.25);border:1.5px solid transparent;font-size:14px;font-weight:700;width:100%;text-align:left}
button.wstat{transition:transform .15s var(--spring),border-color .2s,background .2s}
button.wstat:hover{border-color:var(--pink);background:rgba(255,77,141,.15)}
button.wstat:active{transform:scale(.96)}
.wstat b{font-family:var(--f-mono);font-size:16px}
.wstat em{font-style:normal;font-size:11px;color:var(--teal);margin-left:4px}
.wstat.hi{border-color:var(--yellow)}
.reveal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rname{font-weight:800;font-size:13px;text-align:center;margin-bottom:4px}
.flipin{animation:flip .55s var(--spring) both}
@keyframes flip{from{transform:rotateY(90deg);opacity:0}}
.hand{display:flex;gap:10px;justify-content:center;padding:6px 0}
.pc{width:76px;height:108px;border-radius:12px;background:#FFFDF6;color:#1A1A2E;display:flex;flex-direction:column;justify-content:space-between;padding:8px;box-shadow:0 8px 18px rgba(0,0,0,.4);animation:dealIn .5s var(--spring) both}
.pc b{font-family:var(--f-display);font-size:22px;line-height:1}
.pc i{font-style:normal;font-size:30px;align-self:flex-end;line-height:1}
.pc.red{color:#D7263D}
.hand.sm .pc{width:48px;height:68px;padding:5px;border-radius:9px}.hand.sm .pc b{font-size:15px}.hand.sm .pc i{font-size:18px}
.hand.sm{justify-content:flex-start;padding:2px 0}
.betgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tp-row{display:flex;flex-direction:column;gap:6px;padding:12px}
.tp-row.winrow{border-color:var(--teal);box-shadow:0 0 20px rgba(46,230,201,.25)}
.uno-table{display:flex;gap:18px;justify-content:center;align-items:center;padding:8px 0}
.uc{width:52px;height:78px;border-radius:12px;border:3px solid #fff;background:var(--uc);display:grid;place-items:center;flex:none;box-shadow:0 6px 14px rgba(0,0,0,.35);padding:0;transition:transform .2s var(--spring),opacity .2s}
.uc span{width:76%;height:60%;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;font-family:var(--f-logo);font-size:17px;color:#1A1A2E;transform:rotate(-20deg)}
.uc.big{width:92px;height:136px;border-width:4px;animation:dealIn .4s var(--spring) both}.uc.big span{font-size:30px}
button.uc:disabled{opacity:.35;cursor:not-allowed}
button.uc.ok{animation:okGlow 1.4s ease-in-out infinite}
button.uc.ok:hover{transform:translateY(-10px)}
@keyframes okGlow{0%,100%{box-shadow:0 6px 14px rgba(0,0,0,.35)}50%{box-shadow:0 0 18px rgba(255,217,61,.85)}}
.uhand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px 0}
.bigletter{font-family:var(--f-logo);font-size:120px;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 20px rgba(255,77,141,.4))}
.bigletter.pulse{animation:bob 1.2s ease-in-out infinite}
.gtimer{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:8px}
.gtimer span{font-family:var(--f-logo);font-size:48px;color:var(--yellow)}
.gbar{width:100%;height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--grad);transition:width 1s linear}
.letters{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%;max-width:360px}
.letters .key{height:50px;font-size:20px}
.movie{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.2;text-wrap:balance;padding:6px 10px}

/* music */
#ytHost{width:220px;height:200px;border-radius:14px;overflow:hidden;background:#000}#ytHost[hidden]{display:none}#ytHost iframe{width:100%;height:100%;border:0;display:block}
.np{position:fixed;left:max(12px,calc(env(safe-area-inset-left,0px) + 12px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:22;display:flex;align-items:center;gap:8px;max-width:calc(100% - 110px);padding:6px 8px 6px 6px;border-radius:999px;background:rgba(23,16,64,.92);border:1px solid var(--stroke);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 24px rgba(0,0,0,.4);animation:toastIn .5s var(--spring) both}
.np .disc{font-size:22px;display:inline-block}
.np.playing .disc{animation:spinD 2s linear infinite}
@keyframes spinD{to{transform:rotate(360deg)}}
.np-t{font-size:12px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.npb{border:0;background:var(--glass2);width:30px;height:30px;border-radius:50%;font-size:13px;flex:none;display:grid;place-items:center;color:var(--ink)}
.song{border-radius:16px;padding:10px 12px;background:rgba(0,0,0,.22);border:1px solid var(--stroke);display:flex;flex-direction:column;gap:8px}
.song.ok{border-color:rgba(46,230,201,.35)}
.song.now{border-color:var(--yellow);box-shadow:0 0 16px rgba(255,217,61,.25)}
.mini{width:58px;padding:5px 6px;border-radius:8px;font-family:var(--f-mono);font-size:12px}

/* live games */
.roomcode{font-family:var(--f-logo);font-size:64px;letter-spacing:.12em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.lobby{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.ghostav{width:50px;height:50px;background:var(--glass2);color:var(--muted);border:2px dashed var(--stroke)}
.roomrow{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--stroke)}
.roomrow:first-of-type{border-top:0}
.scoreb{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.sb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;border-radius:16px;background:var(--glass);border:1.5px solid var(--stroke);font-size:13px;text-align:center}
.sb.on{border-color:var(--yellow);box-shadow:0 0 16px rgba(255,217,61,.3)}
.sb .mono{font-size:20px;font-weight:700}
.ball{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px;border-radius:18px;background:rgba(46,230,201,.12);border:1.5px solid var(--teal);text-align:center;font-weight:800;animation:popin .5s var(--spring) both}
.ball b{font-family:var(--f-logo);font-size:24px}
.ball.out{background:rgba(255,77,141,.14);border-color:var(--bad)}
.overlog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.overlog span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--glass2);font-family:var(--f-mono);font-size:13px;font-weight:700}
.overlog span.b{background:var(--teal);color:var(--dark)}.overlog span.w{background:var(--bad);color:#fff}
.hc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hcb{height:84px;border-radius:20px;border:1.5px solid var(--stroke);background:var(--glass2);font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s var(--spring)}
.hcb b{font-family:var(--f-logo);font-size:16px}
.hcb:active{transform:scale(.9);background:rgba(255,77,141,.25)}
.dice{display:flex;gap:4px;font-size:26px;line-height:1}
.dice i{font-style:normal}.dice i.hit{color:var(--yellow);text-shadow:0 0 10px rgba(255,217,61,.8)}
.dice.big{justify-content:center;font-size:48px;gap:8px;margin-top:6px}
.dicepick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.dicepick button{height:52px;border-radius:14px;border:1.5px solid var(--stroke);background:var(--glass);font-size:32px;line-height:1}
.dicepick button.on{border-color:var(--yellow);background:rgba(255,217,61,.16)}
.rolecard{border-radius:22px;padding:18px;text-align:center;background:linear-gradient(160deg,#3B2580,#1A1045);border:2px dashed var(--stroke);user-select:none;-webkit-user-select:none;cursor:pointer}
.rolecard .role{font-family:var(--f-display);font-weight:700;font-size:24px;margin-top:8px;filter:blur(14px);transition:filter .2s}
.rolecard .role small{font-size:13px;font-weight:600;color:var(--muted)}
.rolecard:active .role,.rolecard:focus .role{filter:none}
.qcard{border-radius:22px;padding:18px;background:linear-gradient(160deg,#3B2580,#1A1045);border:1px solid var(--stroke);font-family:var(--f-display);font-weight:600;font-size:20px;text-align:center;text-wrap:balance}
.qopt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:14px 16px;border-radius:16px;border:1.5px solid var(--stroke);background:var(--glass);font-weight:700;font-size:15px;transition:transform .15s var(--spring)}
button.qopt:active{transform:scale(.97)}
.qopt.picked{border-color:var(--yellow);background:rgba(255,217,61,.14)}
.qopt.right{border-color:var(--teal);background:rgba(46,230,201,.18)}

  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(4+Math.random()*9)*power;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-7*power,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,w:6+Math.random()*7,h:4+Math.random()*5,c:CCOL[i%CCOL.length],round:Math.random()<.3,life:0})}
  if(!cfRun){cfRun=true;requestAnimationFrame(cfLoop)}}
function rain(n){if(REDUCE)return;for(let i=0;i<(n||120);i++)parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:7+Math.random()*6,h:4+Math.random()*4,c:CCOL[i%CCOL.length],round:Math.random()<.3,life:0});if(!cfRun){cfRun=true;requestAnimationFrame(cfLoop)}}
function cfLoop(){const dpr=devicePixelRatio||1;if(cf.width!==innerWidth*dpr||cf.height!==innerHeight*dpr){cf.width=innerWidth*dpr;cf.height=innerHeight*dpr}
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.y<innerHeight+40&&p.life<320);
  parts.forEach(p=>{p.life++;p.vy+=.28;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    if(p.round){cx.beginPath();cx.arc(0,0,p.w/2.4,0,6.28);cx.fill()}else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.life/6)));cx.restore()});
  if(parts.length)requestAnimationFrame(cfLoop);else{cfRun=false;cx.clearRect(0,0,innerWidth,innerHeight)}}

function countUp(){if(REDUCE)return;document.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count,f=el.dataset.fmt,t0=performance.now();const step=t=>{const p=Math.min(1,(t-t0)/1100),v=to*(1-Math.pow(1-p,3));el.textContent=f==="inr"?inr(v):Math.round(v);if(p<1&&el.isConnected)requestAnimationFrame(step)};requestAnimationFrame(step)})}

/* ============ expense maths (tracking only) ============ */
function expInr(e){return (+e.amount||0)*(+e.rate||1)}
function shares(e){const total=expInr(e),ids=(e.split||[]).filter(id=>memberById(id)),out={};if(!ids.length)return out;
  if(e.mode==="exact")ids.forEach(id=>out[id]=(+((e.parts||{})[id])||0)*(+e.rate||1));
  else if(e.mode==="shares"){const w=ids.map(id=>Math.max(0,+((e.parts||{})[id])||0)),sum=w.reduce((a,b)=>a+b,0)||1;ids.forEach((id,i)=>out[id]=total*w[i]/sum)}
  else ids.forEach(id=>out[id]=total/ids.length);return out}
function ledger(){const L={};S.members.forEach(m=>L[m.id]={n:0,share:0,cats:{}});
  S.expenses.forEach(e=>{const sh=shares(e);for(const id in sh)if(L[id]){L[id].share+=sh[id];L[id].n++;L[id].cats[e.cat]=(L[id].cats[e.cat]||0)+sh[id]}});return L}
function totalSpent(){return S.expenses.reduce((a,e)=>a+expInr(e),0)}
function questPoints(){const P={};active().forEach(m=>P[m.id]=0);S.quests.forEach(q=>(q.doneBy||[]).forEach(id=>{if(id in P)P[id]+=+q.points||0}));return P}

function voters(p){return active().filter(m=>!((p.type==="removeMember"||p.type==="resetPin")&&m.id===p.payload.memberId)).map(m=>m.id)}
function votedCount(p){const v=p.votes||{};return voters(p).filter(id=>v[id]).length}
function isComplete(p){const vs=voters(p);return vs.length>0&&vs.every(id=>(p.votes||{})[id])}
function tallyOf(p){const v=p.votes||{},vs=voters(p);const y=vs.filter(id=>v[id]==="y").length;return{y,n:vs.length-y,total:vs.length}}
function openProps(){return S.proposals.filter(p=>p.status==="open").sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}
function needsMyVote(){if(!meOk())return 0;return openProps().filter(p=>voters(p).includes(ui.me)&&!(p.votes||{})[ui.me]).length}
function propTitle(p){const d=p.payload||{};
  if(p.type==="plan")return{icon:d.city==="KL"?"🇲🇾":"🇸🇬",title:d.title,sub:`${fmtDay(d.date)}${d.time?" · "+d.time:""}`,color:d.city==="KL"?"var(--kl)":"var(--sg)",verb:"Add to itinerary"};
  if(p.type==="removePlan"){const it=S.plan.find(x=>x.id===d.planId);return{icon:"🗑️",title:"Drop “"+(it?it.title:d.title||"activity")+"”",sub:it?fmtDay(it.date):"",color:"var(--orange)",verb:"Remove from itinerary"}}
  if(p.type==="addMember")return{icon:"🙋",title:"Add "+d.name+" to the crew",sub:"New player",color:"var(--teal)",verb:"Add player"};
  if(p.type==="resetPin")return{icon:"🔑",title:"Reset the PIN for "+mName(d.memberId),sub:"They forgot it. If this passes they set a new one at next login",color:"var(--yellow)",verb:"Reset PIN"};
  if(p.type==="removeMember")return{icon:"🚪",title:"Remove "+mName(d.memberId)+" from the crew",sub:"Their past spends stay in the tracker",color:"var(--bad)",verb:"Remove player"};
  if(p.type==="questPack")return{icon:"🧨",title:"Swap in the Boys' Challenges ("+BOYS_Q.length+" quests)",sub:"Replaces the current quest list with general, tougher challenges",color:"var(--orange)",verb:"Add dare pack"};
  if(p.type==="quest")return{icon:"😈",title:d.text,sub:`New dare · ${d.points} pts`,color:"var(--violet)",verb:"Add dare"};
  return{icon:"❓",title:"Proposal",sub:"",color:"var(--violet)",verb:""}}
async function propose(type,payload){
  if(!meOk()){whoSheet("Who's suggesting this?",()=>propose(type,payload));return false}
  const id=nid();const p={type,payload,by:ui.me,createdAt:Date.now(),status:"open",votes:{}};
  if(voters(p).includes(ui.me))p.votes[ui.me]="y";
  const ok=await write(s=>s.set(["proposals",id],p));
  if(ok){snd("vote");buzz(15);confetti(null,null,40);const vs=voters(p).length;toast(vs<=1?"🗳️ Proposed!":"🗳️ Sent to the crew for a vote ("+(p.votes[ui.me]?1:0)+"/"+vs+")");setTimeout(resolvePending,200)}
  return ok}
async function castVote(pid,v){
  const p=S.proposals.find(x=>x.id===pid);if(!p||p.status!=="open")return;
  if(!meOk()){whoSheet("Who's voting?",()=>castVote(pid,v));return}
  if(!voters(p).includes(ui.me)){toast("You can't vote on your own removal.");snd("no");return}
  if(await write(s=>s.set(["proposals",pid,"votes",ui.me],v))){snd(v==="y"?"vote":"pop");buzz(12);floatText(v==="y"?"👍":"👎");setTimeout(resolvePending,150)}}
let resolving=false;
async function resolvePending(){
  if(resolving||!store)return;resolving=true;
  try{for(const p of openProps()){if(!isComplete(p))continue;const t=tallyOf(p),pass=t.y>t.total/2,d=p.payload||{};
    if(pass){
      if(p.type==="plan")await store.set(["plan","pr"+p.id],{title:d.title,city:d.city,date:d.date,time:d.time||"",note:d.note||"",done:false,createdAt:Date.now(),by:p.by});
      if(p.type==="removePlan"&&d.planId)await store.del(["plan",d.planId]);
      if(p.type==="addMember"){const used=new Set(S.members.map(m=>m.color));await store.set(["members","m"+p.id],{name:d.name,color:MCOLORS.find(c=>!used.has(c))||MCOLORS[S.members.length%MCOLORS.length],createdAt:Date.now()})}
      if(p.type==="removeMember"&&d.memberId)await store.set(["members",d.memberId,"removed"],true);
      if(p.type==="resetPin"&&d.memberId)await store.del(["members",d.memberId,"pinHash"]);
      if(p.type==="questPack"){for(const oq of oldQuests())await store.del(["quests",oq.id]);const miss=missingBoys();for(let k=0;k<miss.length;k++){const q=miss[k];await store.set(["quests","b"+p.id+k],{text:q[0],city:q[1],points:q[2],doneBy:[],createdAt:Date.now()+k})}}
      if(p.type==="quest")await store.set(["quests","q"+p.id],{text:d.text,city:d.city,points:d.points,doneBy:[],createdAt:Date.now()});
    }
    await store.set(["proposals",p.id,"status"],pass?"passed":"failed");
    await store.set(["proposals",p.id,"tally"],{y:t.y,n:t.n});
    await store.set(["proposals",p.id,"resolvedAt"],Date.now());}
  }catch(e){}finally{resolving=false}}
function checkReveals(){
  const done=S.proposals.filter(p=>p.status!=="open");
  if(seenResolved===null){seenResolved=new Set(done.map(p=>p.id));return}
  const fresh=done.filter(p=>!seenResolved.has(p.id));fresh.forEach(p=>seenResolved.add(p.id));
  if(fresh.length)showReveal(fresh[fresh.length-1],fresh.length);}
function showReveal(p,n){

function seedData(){const d={meta:null};COLLS.forEach(c=>d[c]={});BOYS_Q.forEach((q,i)=>d.quests["q"+i]={text:q[0],city:q[1],points:q[2],doneBy:[],createdAt:i});DEFAULT_SONGS.forEach((x,i)=>d.songs["s"+i]={title:x[0],vid:x[1],sp:x[2],start:0,end:52,createdAt:i});d.songsMeta={v:SONGS_V};SEED_P.forEach((t,i)=>d.packing["p"+i]={text:t,done:false,createdAt:i});return d}
function applyData(data){S.meta=normMeta(data.meta);S.songsV=(data.songsMeta&&data.songsMeta.v)||1;S.crewPlaylist=data.crewPlaylist||"";COLLS.forEach(c=>S[c]=Object.entries(data[c]||{}).map(([id,v])=>Object.assign({id},v)));checkReveals();schedule();clearTimeout(applyData.t);applyData.t=setTimeout(()=>{resolvePending();ensureSongs()},400)}
function setDeep(o,path,v){let x=o;for(let i=0;i<path.length-1;i++){if(typeof x[path[i]]!=="object"||x[path[i]]===null)x[path[i]]={};x=x[path[i]]}x[path[path.length-1]]=v}
function delDeep(o,path){let x=o;for(let i=0;i<path.length-1;i++){x=x[path[i]];if(!x)return}delete x[path[path.length-1]]}
function localStore(){
  let data=null;try{data=JSON.parse(localStorage.getItem("sgkl-data2")||"null")}catch(e){}
  data=data||seedData();COLLS.forEach(c=>data[c]=data[c]||{});
  const save=()=>{try{localStorage.setItem("sgkl-data2",JSON.stringify(data))}catch(e){toast("Storage is blocked, so changes won't survive a reload.")}};
  return{start(){applyData(data)},exportAll:()=>JSON.stringify(data,null,1),
    importAll(txt){const d=JSON.parse(txt);if(!d||typeof d!=="object"||!d.members)throw new Error("bad");COLLS.forEach(c=>d[c]=d[c]||{});data=d;save();applyData(data)},
    async set(path,v){setDeep(data,path,JSON.parse(JSON.stringify(v)));save();applyData(data)},
    async del(path){delDeep(data,path);save();applyData(data)}};
}

    h+=`<p class="muted" style="margin:0;font-size:12px">${meOk()?"⭐ is you. <button class='link' data-act='logout'>Log out</button>":"<button class='link' data-act='who'>Tap here to pick who you are</button> so you can vote."}</p>`}

function tick(){const el=$("#tick");if(!el)return;const m=S.meta;if(!m.start){el.textContent="";return}const ms=parseD(m.start)-Date.now();if(ms<=0){el.textContent="";return}
  const s=Math.floor(ms/1000),d=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;el.textContent=`${d}d ${String(hh).padStart(2,"0")}h ${String(mm).padStart(2,"0")}m ${String(ss).padStart(2,"0")}s until wheels up`}
setInterval(tick,1000);
function expSort(a,b){return (b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0)}
function expHtml(e){const c=catOf(e.cat),n=(e.split||[]).length;
  return `<button class="exp" data-act="edit-exp" data-id="${e.id}"><span class="cat" style="background:${c[3]}">${c[2]}</span><span style="min-width:0"><span class="t">${esc(e.title||c[1])}</span><span class="s">${fmtShort(e.date)} · ${e.mode==="exact"?"exact amounts":e.mode==="shares"?"by shares":"for "+n+(n===1?" person":" people")}</span></span><span class="amt"><b>${inr(expInr(e))}</b>${e.cur!=="INR"?`<small>${cur(e.amount,e.cur)}</small>`:""}</span></button>`}

/* --- spends --- */

       <div class="award"><span class="e">🍜</span><span>Hawker king</span><b>${esc(foodie.name)}</b><small>${inr(L[foodie.id].cats.food||0)} on food</small></div>
       <div class="award"><span class="e">🛍️</span><span>Shopaholic</span><b>${esc(shop.name)}</b><small>${inr(L[shop.id].cats.shopping||0)} shopping</small></div>
       <div class="award"><span class="e">🪙</span><span>Kanjoos award</span><b>${esc(thrift.name)}</b><small>only ${inr(L[thrift.id].share)}</small></div></div></div>`}

/* --- plan --- */
function planSort(a,b){return (a.date||"9").localeCompare(b.date||"9")||(a.time||"99").localeCompare(b.time||"99")}
function stopHtml(p,compact){const c=p.city==="KL"?"var(--kl)":"var(--sg)";const pendingRemoval=openProps().some(x=>x.type==="removePlan"&&x.payload.planId===p.id);
  return `<div class="stop${p.done?" done":""}" style="--lc:${c}"><div class="tm">${esc(p.time||"—")}</div><div class="rail"><span class="dot"></span></div>
  <div class="body"><span class="code ${p.city==="KL"?"kl":"sg"}">${p.city==="KL"?"KUL":"SIN"}</span><span class="ttl">${esc(p.title)}</span>${p.note?`<div class="note">${esc(p.note)}</div>`:""}
  ${compact?"":`<div class="acts"><button class="link" data-act="toggle-plan" data-id="${p.id}">${p.done?"↺ Undo":"✓ Done"}</button>${pendingRemoval?`<span class="pill warn">removal vote open</span>`:`<button class="link" style="color:var(--muted)" data-act="propose-remove-plan" data-id="${p.id}">Vote to drop</button>`}</div>`}</div></div>`}
function tripDates(){const m=S.meta;if(!(m.start&&m.end)||daysBetween(m.start,m.end)<0)return[];const out=[],d=parseD(m.start),e=parseD(m.end);let guard=0;while(d<=e&&guard++<60){out.push(ymd(d));d.setDate(d.getDate()+1)}return out}
function dayCount(date){return S.plan.filter(p=>p.date===date).length}
function dayPending(date){return openProps().filter(p=>p.type==="plan"&&p.payload.date===date).length}
function capDots(n){const cls=n>MAX_PER_DAY?"over":n===MAX_PER_DAY?"full":"";let h=`<span class="cap ${cls}" title="${n} of ${MAX_PER_DAY} activities">`;for(let i=0;i<Math.max(MAX_PER_DAY,n);i++)h+=`<i class="${i<n?"on":""}"></i>`;return h+`</span>`}
function vPlan(){
  const dates=tripDates(),m=S.meta;
  let h=`<div class="sec-head"><h2>Trip <span class="em">Route</span></h2><button class="btn sm" data-act="suggest">+ Suggest</button></div>
  <p class="muted" style="margin:0;font-size:13px">Every activity needs a crew vote. Majority wins once everyone has voted. Max ${MAX_PER_DAY} per day.</p>`;
  if(!dates.length)return h+`<div class="empty"><span class="big">📅</span><b>Set your trip dates first</b>Suggestions must fall between the first and last day of the trip.</div><button class="btn" data-act="settings">Set trip dates</button>`+ideasHtml();
  const pend=openProps().filter(p=>p.type==="plan");
  if(pend.length)h+=`<a class="glass" href="#vote" style="text-decoration:none;color:inherit;display:flex;justify-content:space-between;align-items:center;gap:10px;border-color:var(--yellow)"><span><b>🗳️ ${pend.length} suggestion${pend.length>1?"s":""} waiting for votes</b><br><span class="muted small">${pend.slice(0,3).map(p=>esc(p.payload.title)).join(" · ")}</span></span><span class="link">Vote →</span></a>`;
  h+=dates.map((d,i)=>{const items=S.plan.filter(p=>p.date===d).sort(planSort);const pc=dayPending(d);const dn=items.filter(p=>p.done).length;
    return `<section class="glass stack"><div class="sec-head"><div><h3>Day ${i+1} · ${fmtDay(d)}</h3>${pc?`<span class="muted small">+${pc} in voting</span>`:""}</div><div class="row" style="gap:8px">${capDots(items.length)}${items.length&&dn===items.length?`<span class="pill good">done</span>`:""}</div></div>
    ${items.length?`<div class="line">${items.map(p=>stopHtml(p)).join("")}</div>`:""}
    ${items.length<MAX_PER_DAY?`<div class="dayfree"><span>${items.length?MAX_PER_DAY-items.length+" slot"+(MAX_PER_DAY-items.length>1?"s":"")+" free":"Free day. Nothing planned."}</span><button class="btn ghost sm" data-act="suggest" data-date="${d}">Suggest</button></div>`:items.length>MAX_PER_DAY?`<div class="warnbox"><b>⚠️ Packed day:</b> ${items.length} activities, over the ${MAX_PER_DAY}-per-day limit.</div>`:""}</section>`}).join("");
  const off=S.plan.filter(p=>!dates.includes(p.date));
  if(off.length)h+=`<section class="glass stack"><h3>Outside trip dates</h3><p class="muted small" style="margin:0">These were approved before the trip dates changed.</p><div class="line">${off.sort(planSort).map(p=>stopHtml(p)).join("")}</div></section>`;
  return h+ideasHtml();
}
function ideasHtml(){
  return `<section class="glass stack"><div class="sec-head"><h3>I'm bored 🎲</h3><button class="btn alt sm" data-act="bored">Give me an idea</button></div>
   <div class="slot" id="boredSlot">${ui.bored!=null?`<span>${BORED[ui.bored][0]} ${esc(BORED[ui.bored][1])}</span><button class="link" data-act="suggest-bored">Suggest this to the crew →</button>`:`<small>Random fun ideas when you can't decide</small>`}</div></section>

/* --- vote --- */
function voteCard(p){
  const t=propTitle(p),vs=voters(p),v=p.votes||{},mine=meOk()?v[ui.me]:null,canVote=meOk()&&vs.includes(ui.me),done=votedCount(p);

    const ds=tripDates();if(ds.length&&!ds.includes(p.payload.date))warn+=`<div class="warnbox"><b>⚠️</b> This date is outside the trip dates now.</div>`}
  return `<div class="vote" style="--vc:${t.color}"><div class="vt"><span class="vi">${t.icon}</span><div style="min-width:0;flex:1"><div class="vh">${esc(t.title)}</div><div class="vs">${esc(t.sub)}${p.type==="plan"&&p.payload.note?" · "+esc(p.payload.note):""}</div><div class="vs">Suggested by ${esc(mName(p.by))}</div></div></div>
   ${warn}
   <div class="voters">${vs.map(id=>{const has=!!v[id],isMe=id===ui.me;const cls=isMe&&has?(v[id]==="y"?"y":"n"):has?"voted":"";const mark=isMe&&has?(v[id]==="y"?"👍":"👎"):has?"✓":"…";return `<div class="voter ${cls}">${av(id,38,` data-v="${mark}"`)}<span>${isMe?"You":esc(mName(id))}</span></div>`}).join("")}</div>

   ${canVote?`<div class="vbtns"><button class="vbtn yes" aria-pressed="${mine==="y"}" data-act="vote" data-id="${p.id}" data-v="y">👍 Yes</button><button class="vbtn no" aria-pressed="${mine==="n"}" data-act="vote" data-id="${p.id}" data-v="n">👎 No</button></div>${mine?`<div class="muted small" style="text-align:center">You can change your vote until the last person votes.</div>`:""}`

  const P=questPoints(),ms=active().sort((a,b)=>P[b.id]-P[a.id]);

async function hashPin(id,pin){const txt="sgkl|"+TRIP_CODE+"|"+id+"|"+pin;
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=5381;for(let i=0;i<txt.length;i++)h=((h<<5)+h+txt.charCodeAt(i))|0;return "f"+(h>>>0).toString(16)}}
function pinSheet(id,nameHint){const m=memberById(id);PIN={id,name:m?m.name:(nameHint||""),stage:m&&m.pinHash?"enter":"create",buf:"",first:"",tries:PIN.id===id?PIN.tries:0,lockUntil:PIN.id===id?PIN.lockUntil:0};
  openSheet(PIN.stage==="enter"?"Hi "+PIN.name+" 👋":"Create your PIN 🔐",`<div class="stack" style="align-items:center;gap:16px">${av(id,64)}
   <div id="pinMsg" class="muted" style="text-align:center;min-height:40px">${pinMsg()}</div>
   <div class="pin-dots" id="pinDots">${[0,1,2,3].map(()=>"<i></i>").join("")}</div>
   <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button class="key" data-act="pin-key" data-k="${k}">${k}</button>`).join("")}<button class="key ghosty" data-act="pin-back" aria-label="Back to names">↩</button><button class="key" data-act="pin-key" data-k="0">0</button><button class="key ghosty" data-act="pin-key" data-k="del" aria-label="Delete digit">⌫</button></div></div>`)}
function pinMsg(){if(PIN.stage==="enter")return "Enter your 4-digit PIN";if(PIN.stage==="create")return "Pick a 4-digit PIN only you know.<br><small>You'll need it every time you open the app.</small>";return "Type the same PIN again to confirm"}
function pinDraw(err){const d=$("#pinDots");if(!d)return;[...d.children].forEach((x,i)=>x.classList.toggle("on",i<PIN.buf.length));if(err){d.classList.remove("err");void d.offsetWidth;d.classList.add("err")}const m=$("#pinMsg");if(m&&!err)m.innerHTML=pinMsg()}
async function pinKey(k){
  if(Date.now()<PIN.lockUntil){const s=Math.ceil((PIN.lockUntil-Date.now())/1000);$("#pinMsg").innerHTML=`Too many tries. Wait ${s}s.`;snd("no");return}
  if(k==="del"){PIN.buf=PIN.buf.slice(0,-1);pinDraw();return}
  if(PIN.buf.length>=4)return;PIN.buf+=k;snd("tick");buzz(6);pinDraw();
  if(PIN.buf.length<4)return;
  const entered=PIN.buf;
  if(PIN.stage==="create"){PIN.first=entered;PIN.buf="";PIN.stage="confirm";setTimeout(()=>{pinDraw();const m=$("#pinMsg");if(m)m.innerHTML=pinMsg()},180);return}
  if(PIN.stage==="confirm"){if(entered!==PIN.first){PIN.buf="";PIN.stage="create";PIN.first="";pinDraw(true);$("#pinMsg").innerHTML="Those didn't match. Pick your PIN again.";snd("no");buzz([40,40,40]);return}
    const m=memberById(PIN.id);if(m&&m.pinHash){PIN.buf="";PIN.stage="enter";pinDraw(true);$("#pinMsg").innerHTML="Someone just set a PIN for this name. Enter that PIN.";return}
    const h=await hashPin(PIN.id,entered);if(await write(s=>s.set(["members",PIN.id,"pinHash"],h)))loginOk();return}
  const m=memberById(PIN.id);const h=await hashPin(PIN.id,entered);
  if(m&&m.pinHash===h){loginOk();return}
  PIN.tries++;PIN.buf="";pinDraw(true);snd("no");buzz([40,40,40]);
  if(PIN.tries>=5){PIN.lockUntil=Date.now()+30000;PIN.tries=0;$("#pinMsg").innerHTML="Wrong PIN 5 times. Locked for 30 seconds."}else $("#pinMsg").innerHTML=`Wrong PIN. ${5-PIN.tries} tr${5-PIN.tries===1?"y":"ies"} left.`}

const SUITS=["♠","♥","♦","♣"],RN={11:"J",12:"Q",13:"K",14:"A"},TPN=["","High card","Pair","Colour","Sequence","Pure sequence","Trail 🔥"];
function deck52(){const d=[];for(const s of SUITS)for(let r=2;r<=14;r++)d.push({r,s});return shuffle(d)}
function pcHtml(c,i){return `<span class="pc ${c.s==="♥"||c.s==="♦"?"red":""}" style="animation-delay:${(i||0)*120}ms"><b>${RN[c.r]||c.r}</b><i>${c.s}</i></span>`}
function tpEval(h){const r=h.map(c=>c.r).sort((a,b)=>b-a),flush=h.every(c=>c.s===h[0].s);let seq=0;if(r[0]-r[1]===1&&r[1]-r[2]===1)seq=r[0];if(r[0]===14&&r[1]===3&&r[2]===2)seq=13.5;
  if(r[0]===r[2])return[6,r[0]];if(seq&&flush)return[5,seq];if(seq)return[4,seq];if(flush)return[3,...r];if(r[0]===r[1])return[2,r[0],r[2]];if(r[1]===r[2])return[2,r[1],r[0]];return[1,...r]}
function cmpHand(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}
const Teen={
  start(){G.chips=G.players.map(()=>20);G.round=0;G.maxRounds=8;G.carry=0;this.deal()},
  deal(){G.round++;G.inRound=G.players.map((_,i)=>i).filter(i=>G.chips[i]>0);G.pot=G.carry;G.carry=0;G.inRound.forEach(i=>{G.chips[i]--;G.pot++});const d=deck52();G.hands=G.players.map(()=>null);G.inRound.forEach(i=>G.hands[i]=[d.pop(),d.pop(),d.pop()]);G.bets={};G.q=0;G.phase="pass"},
  render(){const ps=G.players,cur=G.inRound[G.q];let h=chipsRow(ps.map((p,i)=>({p,txt:G.chips[i]+" 🪙",dim:!G.chips[i]&&!G.inRound.includes(i),on:G.phase!=="show"&&G.phase!=="over"&&i===cur})));
    if(G.phase==="over")return h+overScreen();
    h+=`<div class="muted small" style="text-align:center">Round ${G.round} of ${G.maxRounds} · Pot <b class="mono" style="color:var(--yellow)">${G.pot} 🪙</b></div>`;
    if(G.phase==="pass")return h+passScreen(ps[cur],"Look at your 3 cards and place your bet secretly.");
    if(G.phase==="view"){const hand=G.hands[cur],ev=tpEval(hand),mx=G.chips[cur];
      return h+`<div class="hand">${hand.map(pcHtml).join("")}</div><div class="gbanner">${TPN[ev[0]]}</div>
      <p class="gnote">Bet blind: nobody sees your bet until the show. Bluff if you dare.</p>
      <div class="betgrid">${[1,2,3,5].map(v=>`<button class="btn ${v>=3?"":"alt"}" data-act="g" data-x="bet" data-v="${v}" ${v>mx?"disabled":""}>Chaal ${v} 🪙</button>`).join("")}</div>
      <button class="btn ghost" data-act="g" data-x="bet" data-v="0">🙅 Pack (fold)</button>`}
    const r=G.res;return h+`<div class="gbanner">${r.winners.length?`🏆 ${r.winners.map(i=>esc(ps[i].name)).join(" & ")} win${r.winners.length>1?"":"s"} ${r.pot} 🪙`:"Everyone packed! Pot rolls over 🪙"}</div>
     <div class="list">${G.inRound.map(i=>{const b=G.bets[i],ev=tpEval(G.hands[i]);return `<div class="glass tp-row${r.winners.includes(i)?" winrow":""}"><div class="row" style="justify-content:space-between"><span class="row">${av(ps[i].id,28)}<b>${esc(ps[i].name)}</b></span><span class="pill ${b?"neutral":"bad"}">${b?"bet "+b+" 🪙":"packed"}</span></div><div class="hand sm">${G.hands[i].map(pcHtml).join("")}</div><div class="muted small">${TPN[ev[0]]}</div></div>`}).join("")}</div>
     <button class="btn" data-act="g" data-x="next">Next round →</button>`},
  act(x,d){const cur=G.inRound[G.q];
    if(x==="show"){G.phase="view";snd("whoosh");return}
    if(x==="bet"){const v=+d.v;G.bets[cur]=v;if(v){G.chips[cur]-=v;G.pot+=v;snd("coin")}else snd("pop");G.q++;
      if(G.q<G.inRound.length){G.phase="pass";return}
      const live=G.inRound.filter(i=>G.bets[i]);let winners=[];
      if(live.length===1)winners=live;else if(live.length>1){let best=null;live.forEach(i=>{const e=tpEval(G.hands[i]);if(!best||cmpHand(e,best)>0){best=e;winners=[i]}else if(cmpHand(e,best)===0)winners.push(i)})}
      const pot=G.pot;if(winners.length){const share=Math.floor(pot/winners.length);winners.forEach(i=>G.chips[i]+=share);G.carry=pot-share*winners.length}else G.carry=pot;
      G.res={winners,pot};G.phase="show";if(winners.length){snd("win");setTimeout(()=>confetti(innerWidth/2,innerHeight/3,70),200)}return}
    if(x==="next"){if(G.chips.filter(c=>c>0).length<=1||G.round>=G.maxRounds){gFinish(G.chips,"🪙");return}this.deal()}},
  rules:"Everyone starts with 20 coins and puts 1 in the pot each round. You get 3 cards. Look at them privately, then bet 1, 2, 3 or 5 coins, or pack (fold). Bets are blind until the show. The best hand among players who didn't pack wins the whole pot. Hands from best to worst: Trail (three of a kind), Pure sequence, Sequence, Colour, Pair, High card. A-K-Q is the top sequence, then A-2-3. Most coins after 8 rounds wins."};

/* --- UNO-rules card game --- */
const UCOL={R:"#E53935",G:"#2E9E44",B:"#1E7BE0",Y:"#F2B800"},UNAME={R:"Red",G:"Green",B:"Blue",Y:"Yellow"};
function unoDeck(){const d=[];for(const c of "RGBY"){d.push({c,v:"0"});for(let n=1;n<=9;n++)d.push({c,v:""+n},{c,v:""+n});for(const v of ["S","R","D2"])d.push({c,v},{c,v})}for(let i=0;i<4;i++)d.push({c:"W",v:"W"},{c:"W",v:"W4"});return shuffle(d)}
function uLabel(v){return v==="S"?"⊘":v==="R"?"⇄":v==="D2"?"+2":v==="W"?"★":v==="W4"?"+4":v}
function ucHtml(card,o){o=o||{};const bg=card.c==="W"?"conic-gradient(#E53935 0 25%,#F2B800 0 50%,#2E9E44 0 75%,#1E7BE0 0)":UCOL[card.c];const tag=o.btn?"button":"span";
  return `<${tag} class="uc${o.ok?" ok":""}${o.big?" big":""}" style="--uc:${bg}" ${o.btn?`data-act="g" data-x="play" data-i="${o.i}" ${o.ok?"":"disabled"} aria-label="${card.c==="W"?"Wild":UNAME[card.c]} ${uLabel(card.v)}"`:""}><span>${uLabel(card.v)}</span></${tag}>`}
const Uno={
  start(){G.deck=unoDeck();G.hands=G.players.map(()=>G.deck.splice(0,7));let top=G.deck.pop();while(top.c==="W"){G.deck.unshift(top);top=G.deck.pop()}G.disc=[top];G.color=top.c;G.turn=0;G.dir=1;G.drew=false;G.msg="First card: "+UNAME[top.c]+" "+uLabel(top.v);G.phase="pass"},
  top(){return G.disc[G.disc.length-1]},
  ok(c){return c.c==="W"||c.c===G.color||c.v===this.top().v},
  nxt(step){const n=G.players.length;return ((G.turn+G.dir*step)%n+n)%n},
  draw(n,p){for(let k=0;k<n;k++){if(!G.deck.length){const t=G.disc.pop();G.deck=shuffle(G.disc);G.disc=[t]}if(!G.deck.length)break;G.hands[p].push(G.deck.pop())}},
  render(){const ps=G.players;let h=chipsRow(ps.map((p,i)=>({p,txt:G.hands[i].length+" 🂠",on:i===G.turn&&G.phase!=="over"})));
    if(G.phase==="over")return h+overScreen();
    const top=this.top(),colorPill=`<span class="pill" style="background:${UCOL[G.color]};color:#fff">${UNAME[G.color]}</span>`;
    if(G.phase==="pass")return h+`<div class="gnote">${esc(G.msg)}</div>`+passScreen(ps[G.turn],"Your turn. Others, eyes off the screen.");
    let t=`<div class="uno-table">${ucHtml(top,{big:true})}<div class="stack" style="gap:8px;align-items:flex-start"><span class="muted small">Play on</span>${colorPill}<span class="muted small">${G.dir===1?"↻ clockwise":"↺ reversed"}</span></div></div><div class="gnote">${esc(G.msg)}</div>`;
    if(G.phase==="color")return h+t+`<h3 style="text-align:center">Pick a colour</h3><div class="grid2">${"RGBY".split("").map(c=>`<button class="btn" style="background:${UCOL[c]};box-shadow:none" data-act="g" data-x="color" data-c="${c}">${UNAME[c]}</button>`).join("")}</div>`;
    const hand=G.hands[G.turn];
    return h+t+`<div class="uhand">${hand.map((c,i)=>ucHtml(c,{btn:true,i,ok:this.ok(c)})).join("")}</div>
      <div class="grid2">${G.drew?`<button class="btn ghost" data-act="g" data-x="end">End turn</button>`:`<button class="btn alt" data-act="g" data-x="draw">Draw a card</button>`}<span class="muted small" style="align-self:center">${hand.filter(c=>this.ok(c)).length} playable</span></div>`},
  act(x,d){const ps=G.players;
    if(x==="show"){G.phase="play";snd("whoosh");return}
    if(x==="play"){const i=+d.i,c=G.hands[G.turn][i];if(!c||!this.ok(c))return;if(c.c==="W"){G.pending=i;G.phase="color";return}this.doPlay(i,c.c);return}
    if(x==="color"){this.doPlay(G.pending,d.c);return}
    if(x==="draw"){this.draw(1,G.turn);G.drew=true;snd("pop");const c=G.hands[G.turn][G.hands[G.turn].length-1];if(!this.ok(c)){G.msg=ps[G.turn].name+" drew a card and passed.";toast("No luck. Turn passes.");this.endTurn(1)}else G.msg="You drew a playable card. Play it or end your turn.";return}
    if(x==="end"){G.msg=ps[G.turn].name+" passed.";this.endTurn(1)}},
  doPlay(i,col){const ps=G.players,me=G.turn,c=G.hands[me].splice(i,1)[0];G.disc.push(c);G.color=col;snd("pop");buzz(8);
    let msg=ps[me].name+" played "+(c.c==="W"?(c.v==="W4"?"Wild +4":"Wild")+" → "+UNAME[col]:UNAME[c.c]+" "+uLabel(c.v)),step=1;
    if(!G.hands[me].length){gFinish(G.players.map((_,k)=>k===me?1:0),"win");return}
    if(G.hands[me].length===1){floatText("UNO!",innerWidth/2,innerHeight/2);snd("tada")}
    if(c.v==="S"){step=2;msg+=". "+ps[this.nxt(1)].name+" is skipped!"}
    if(c.v==="R"){if(ps.length===2){step=2;msg+=". Play again!"}else{G.dir*=-1;msg+=". Reverse!"}}
    if(c.v==="D2"||c.v==="W4"){const v=this.nxt(1),n=c.v==="D2"?2:4;this.draw(n,v);step=2;msg+=". "+ps[v].name+" draws "+n+" 😬";snd("no")}
    G.msg=msg;this.endTurn(step)},
  endTurn(step){G.turn=this.nxt(step);G.drew=false;G.phase="pass"},
  rules:"Match the top card by colour or number/symbol. ⊘ skips the next player, ⇄ reverses direction, +2 makes the next player draw 2 and lose their turn. ★ Wild lets you pick the colour. +4 Wild picks the colour and the next player draws 4. Can't play? Draw one card. First to empty their hand wins. Pass the phone each turn."};

const AKL="A B C D E G H J K L M N P R S T Y".split(" ");
const Anta={
  start(){G.lives=G.players.map(()=>3);G.score=G.players.map(()=>0);G.turn=0;G.letter=AKL[Math.floor(Math.random()*AKL.length)];G.phase="ready"},
  alive(){return G.players.map((_,i)=>i).filter(i=>G.lives[i]>0)},
  nextTurn(){const al=this.alive();if(al.length<=1){gFinish(G.players.map((_,i)=>G.score[i]*10+G.lives[i]),"pts");return}let t=G.turn;do{t=(t+1)%G.players.length}while(G.lives[t]<=0);G.turn=t;G.phase="ready"},
  render(){const ps=G.players;let h=chipsRow(ps.map((p,i)=>({p,txt:"❤️".repeat(G.lives[i])+(G.lives[i]?"":"💀")+" "+G.score[i],dim:!G.lives[i],on:i===G.turn&&G.phase!=="over"})));

    if(G.phase==="go")return h+`<div class="passs"><div class="bigletter pulse">${G.letter}</div>${timerHtml()}<div class="grid2" style="width:100%;max-width:340px"><button class="btn alt" data-act="g" data-x="sang">✅ Sang it</button><button class="btn danger" data-act="g" data-x="fail">❌ Couldn't</button></div></div>`;
    return h+`<div class="passs"><h2>Nice one, ${esc(p.name)}! 🎶</h2><p class="muted" style="margin:0">Which letter did your song END on? The next singer starts with that.</p><div class="letters">${AKL.map(l=>`<button class="key" data-act="g" data-x="letter" data-l="${l}">${l}</button>`).join("")}</div></div>`},
  act(x,d){
    if(x==="go"){G.phase="go";snd("whoosh");startTimer(30,()=>{toast("⏰ Time's up!");this.act("fail");gRender()});return}
    if(x==="sang"){stopTimer();G.score[G.turn]++;snd("tada");confetti(innerWidth/2,innerHeight/2,40);G.phase="letter";return}
    if(x==="fail"){stopTimer();G.lives[G.turn]--;snd("no");buzz([60,40,60]);if(!G.lives[G.turn])toast("💀 "+G.players[G.turn].name+" is out!");this.nextTurn();return}
    if(x==="letter"){G.letter=d.l;this.nextTurn()}},
  rules:"Classic antakshari. Sing a Bollywood song starting with the letter shown before the 30-second clock runs out. If you make it, choose the last letter of your song and the next singer starts with it. Miss and you lose a heart, and the next singer gets the same letter. 3 hearts each, and the last singer standing wins."};

const TorD={
  start(){G.score=G.players.map(()=>0);G.turn=null;G.phase="spin";G.tp=shuffle(TRUTHS);G.dp=shuffle(DARES)},
  render(){const ps=G.players;let h=chipsRow(ps.map((p,i)=>({p,txt:G.score[i]+" pts",on:i===G.turn&&G.phase!=="over"})));

    if(G.phase==="choose")return h+`<div class="passs"><h2>${esc(p.name)}, truth or dare?</h2><div class="grid2" style="width:100%;max-width:340px"><button class="btn alt" data-act="g" data-x="truth">🤔 Truth (+1)</button><button class="btn" data-act="g" data-x="dare">🔥 Dare (+2)</button></div></div>`;
    return h+`<div class="passs"><div class="pill ${G.kind==="dare"?"bad":"good"}" style="font-size:14px">${G.kind==="dare"?"🔥 DARE":"🤔 TRUTH"}</div><div class="movie" style="font-size:22px">${esc(G.prompt)}</div><div class="grid2" style="width:100%;max-width:340px"><button class="btn alt" data-act="g" data-x="done">Done ✅</button><button class="btn ghost" data-act="g" data-x="chicken">Chickened out 🐔</button></div></div>`},

function tcardHtml(set,i,o){const c=tcard(set,i),S2=TSETS[set];o=o||{};const rare=c.ab==="LEG"||c.ab==="GOAT";const rows=o.small?S2.keys.filter(s=>s[0]===o.stat):S2.keys;
  return `<div class="wcard ${set}${rare?" rare":""}${o.win?" win":""}${o.small?" small":""}">${o.small?"":`<div class="artwrap${PICS[picKey(set,i)]?" haspic":""}">${PICS[picKey(set,i)]?`<img class="cpic" src="${PICS[picKey(set,i)]}" alt="">`:""}${cardArt(set,i,c.ab)}<span class="artab">${S2.ab[c.ab][0].split(" ")[0]}</span></div>`}<div class="wtop">${o.small?(PICS[picKey(set,i)]?`<span class="wem artmini"><img src="${PICS[picKey(set,i)]}" alt="" style="width:100%;height:100%;object-fit:cover"></span>`:`<span class="wem artmini">${cardArt(set,i,c.ab)}</span>`):`<span class="wem">${c.e}</span>`}<div style="min-width:0"><b class="wname">${esc(c.name)}</b><small>${set==="wwe"?"Finisher: ":""}${esc(c.sub)}${rare?" · ⭐ RARE":""}</small></div></div>

function trumpDef(set,title,e,d){return{title,e,d,min:2,max:5,opts:{set},
  rules:"Everyone gets an equal pile. The picker sees his top card and chooses a stat. Everyone's top card is revealed, and the highest number takes all the cards plus anything in the pot. Ability boosts are added automatically. A tie sends the cards to the pot, unless one card has the tie-break ability. The winner picks next. Most cards at the end wins. Ratings are fan-made for fun.",
  init(n,o){const deck=shuffle(TSETS[o.set].cards.map((_,i)=>i)),per=Math.floor(deck.length/n);return{set:o.set,decks:Array.from({length:n},(_,p)=>deck.slice(p*per,(p+1)*per)),pot:deck.slice(per*n),turn:0,round:1,max:n>2?18:14,phase:"pick"}},
  move(st,me,mv){const S2=TSETS[st.set];
    if(mv.x==="stat"){if(st.phase!=="pick")throw new Error("Not picking right now.");if(me!==st.turn)throw new Error(lgName(st.turn)+" picks this round.");
      const al=st.decks.map((d,i)=>d.length?i:-1).filter(i=>i>=0),k=mv.s,cards=al.map(p=>({p,c:st.decks[p][0],v:teff(st.set,tcard(st.set,st.decks[p][0]),k)})),best=Math.max(...cards.map(o=>o.v)),top=cards.filter(o=>o.v===best);
      let w=null,tb=false;if(top.length===1)w=top[0].p;else{const t=top.filter(o=>{const ab=tcard(st.set,o.c).ab;return ab==="TIE"||ab==="CLUTCH"});if(t.length===1){w=t[0].p;tb=true}}
      al.forEach(p=>st.decks[p].shift());const won=cards.map(o=>o.c),count=won.length+(w==null?0:st.pot.length);
      if(w==null)st.pot.push(...won);else{st.decks[w].push(...shuffle(won.concat(st.pot)));st.pot=[]}
      st.res={k,cards,w,tb,count};st.phase="reveal";st.fx=w==null?{s:"no"}:{s:"coin",c:50};return st}
    if(mv.x==="next"){if(st.phase!=="reveal")return st;st.round++;if(st.res.w!=null)st.turn=st.res.w;const al=st.decks.map((d,i)=>d.length?i:-1).filter(i=>i>=0);
      st.scores=st.decks.map(d=>d.length);if(al.length<=1||st.round>st.max){st.over=true;st.winners=winnersOf(st.scores);st.phase="over";return st}
      if(!st.decks[st.turn].length)st.turn=al.find(i=>i>st.turn)??al[0];st.phase="pick";st.fx={s:"whoosh"};return st}
    throw new Error("Unknown move")},
  view(st,me){const S2=TSETS[st.set];let h=lgChips(st.decks.map((d,i)=>({i,txt:d.length+" 🃏",dim:!d.length,on:i===st.turn&&!st.over})));
    if(st.over)return h+lgOver(st,"cards");
    h+=`<div class="muted small" style="text-align:center">Round ${st.round} of ${st.max}${st.pot.length?` · ${st.pot.length} in the pot`:""}</div>`;
    if(st.phase==="pick"){if(me===st.turn)return h+`<div class="gbanner">Your pick! Choose a stat 👇</div>`+tcardHtml(st.set,st.decks[me][0],{pick:true});
      return h+`<div class="gbanner">⏳ ${esc(lgName(st.turn))} is choosing a stat…</div>`+(me>=0&&st.decks[me].length?`<p class="gnote">Your top card</p>`+tcardHtml(st.set,st.decks[me][0]):"")}

    return h+`<div class="gbanner ${r.w==null?"tie":""}">${r.w==null?"🤝 TIE! Cards go to the pot":`💥 ${r.w===me?"You take":esc(lgName(r.w))+" takes"} ${r.count} card${r.count>1?"s":""}!`}</div><div class="gsub">${lab}</div>
     <div class="reveal-grid">${r.cards.map((x,k)=>`<div class="flipin" style="animation-delay:${k*150}ms"><div class="rname">${x.p===me?"You":esc(lgName(x.p))}</div>${tcardHtml(st.set,x.c,{small:true,stat:r.k,win:x.p===r.w})}</div>`).join("")}</div>
     ${r.tb?`<div class="pill good" style="align-self:center">Tie-break ability won it</div>`:""}${me>=0?`<button class="btn" data-act="lg" data-x="next">Next round →</button>`:""}`}}}

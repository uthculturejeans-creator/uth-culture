<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collections & Commission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<style>
:root{
  --ink:#12203a; --ink-2:#1b2d4d; --paper:#f6f7f9; --card:#ffffff; --line:#e5e8ee;
  --text:#1a2233; --muted:#63708a; --muted-2:#8a95a8;
  --gold:#b7791f; --gold-soft:#fdf3dd;
  --green:#1f8f56; --green-soft:#e7f4ec;
  --red:#cf3a3a; --red-soft:#fbe9e9;
  --amber:#c47f17; --amber-soft:#fbeeda;
  --blue:#2563c9; --blue-soft:#e8f0fc;
  --shadow:0 1px 2px rgba(18,32,58,.06),0 2px 8px rgba(18,32,58,.05);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#0b1220; --ink-2:#111c30; --paper:#0e1420; --card:#151d2c; --line:#26314a;
    --text:#e7ecf4; --muted:#9aa6bd; --muted-2:#71809c;
    --gold:#e0a94a; --gold-soft:#2a2413;
    --green:#4cc586; --green-soft:#12251b;
    --red:#e97070; --red-soft:#2a1518;
    --amber:#e0a94a; --amber-soft:#2a2213;
    --blue:#6ea3f2; --blue-soft:#13233d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
  }
}
[data-theme="dark"]{
  --ink:#0b1220; --ink-2:#111c30; --paper:#0e1420; --card:#151d2c; --line:#26314a;
  --text:#e7ecf4; --muted:#9aa6bd; --muted-2:#71809c;
  --gold:#e0a94a; --gold-soft:#2a2413;
  --green:#4cc586; --green-soft:#12251b;
  --red:#e97070; --red-soft:#2a1518;
  --amber:#e0a94a; --amber-soft:#2a2213;
  --blue:#6ea3f2; --blue-soft:#13233d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,Arial,system-ui,sans-serif;background:var(--paper);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
a{color:var(--blue)}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:236px;background:var(--ink);color:#dfe6f2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand h1{font-size:15px;font-weight:800;margin:0;letter-spacing:.2px;line-height:1.25}
.brand p{font-size:11px;color:#8ea0c2;margin:3px 0 0}
.sm-picker{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sm-picker label{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#8ea0c2;font-weight:600}
.sm-picker select{width:100%;margin-top:6px;background:var(--ink-2);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 9px;font-size:13px;font-weight:600}
nav{padding:10px 10px;flex:1;overflow:auto}
nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:#c3cfe4;padding:9px 11px;border-radius:8px;font-size:13.5px;font-weight:500;text-align:left;margin-bottom:2px}
nav button:hover{background:rgba(255,255,255,.06);color:#fff}
nav button.active{background:var(--gold);color:#1a1204;font-weight:700}
nav button .ic{width:17px;text-align:center;font-size:14px}
.sidebar-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7e8fb0}
.theme-btn{background:rgba(255,255,255,.08);color:#cdd8ec;border:none;border-radius:7px;padding:7px 10px;font-size:12px;width:100%;font-weight:600}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 26px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20}
.topbar h2{margin:0;font-size:18px;font-weight:700}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.content{padding:22px 26px 60px;flex:1}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.2px}
.kpi .val{font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.4px}
.kpi .foot{font-size:11px;color:var(--muted-2);margin-top:3px}
.kpi.accent{border-left:3px solid var(--gold)}
.kpi.good .val{color:var(--green)} .kpi.bad .val{color:var(--red)}

/* Panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-h h3{margin:0;font-size:14.5px;font-weight:700}
.panel-h .hint{font-size:11.5px;color:var(--muted)}
.panel-b{padding:4px 0}
.panel-pad{padding:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:1024px){.grid-2{grid-template-columns:1fr}}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.3px;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card);position:sticky;top:0}
td{padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--paper)}
td.r,th.r{text-align:right}
.tbl-tot td{font-weight:700;background:var(--paper);border-top:2px solid var(--line)}

/* Chips */
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.6}
.chip.paid{background:var(--green-soft);color:var(--green)}
.chip.part{background:var(--amber-soft);color:var(--amber)}
.chip.pend{background:var(--red-soft);color:var(--red)}
.chip.low{background:var(--green-soft);color:var(--green)}
.chip.med{background:var(--amber-soft);color:var(--amber)}
.chip.high{background:var(--red-soft);color:var(--red)}
.chip.neutral{background:var(--paper);color:var(--muted);border:1px solid var(--line)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 13px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--muted-2)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-2)}
.btn.gold{background:var(--gold);color:#1a1204;border-color:var(--gold)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{background:none}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{background:none;border:none;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:13px}
.icon-btn:hover{background:var(--paper);color:var(--text)}

/* Forms */
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;color:var(--text);font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hintnote{font-size:11.5px;color:var(--muted-2);margin-top:4px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,16,28,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow:auto}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:540px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.modal.wide{max-width:820px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:16px;font-weight:700}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--paper)}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13px;color:var(--text);font-family:inherit}
.search{flex:1;min-width:180px}
.spacer{flex:1}

/* empty */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:8px}
.empty h3{margin:0 0 6px;color:var(--text);font-size:16px}

/* bars */
.bar{height:7px;background:var(--paper);border-radius:6px;overflow:hidden;min-width:70px}
.bar > i{display:block;height:100%;background:var(--green)}
.mono-lab{font-size:11px;color:var(--muted)}

/* toast */
#toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:tin .2s ease}
.toast.ok{background:var(--green)} .toast.err{background:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:6px 16px 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%}

/* Lock */
.lock-screen{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
.lock-card{background:var(--card);border-radius:16px;padding:34px 28px;width:100%;max-width:360px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.lock-card .lock-logo{font-size:42px;margin-bottom:6px}
.lock-card h2{margin:0 0 4px;font-size:18px;font-weight:800}
.lock-card p{margin:0 0 18px;color:var(--muted);font-size:13px}
.lock-card input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-bottom:10px;background:var(--card);color:var(--text);text-align:center;letter-spacing:2px}
.lock-card input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.lock-err{color:var(--red);font-size:12.5px;min-height:18px;margin-bottom:8px;font-weight:600}
/* Print */
.print-area{display:none}
@media print{
  html,body{background:#fff!important}
  .app,#modalRoot,#toasts{display:none!important}
  .print-area{display:block!important}
  .print-head{margin-bottom:14px;border-bottom:2px solid #111;padding-bottom:8px}
  .pt-biz{font-size:18px;font-weight:800;color:#111}
  .pt-title{font-size:15px;font-weight:700;margin-top:2px;color:#111}
  .pt-meta{font-size:11px;color:#555;margin-top:3px}
  .print-area .panel{box-shadow:none!important;border:1px solid #bbb;margin-bottom:14px}
  .print-area .panel-h{border-bottom:1px solid #bbb}
  .print-area table{font-size:11px;width:100%}
  .print-area th{background:#eee!important;color:#111!important;position:static;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-area td,.print-area th{border-bottom:1px solid #ccc}
  .print-area tr{break-inside:avoid}
  .print-area .kpi-grid{display:grid!important;gap:8px}
  .print-area .kpi{border:1px solid #ccc;box-shadow:none;break-inside:avoid}
  .print-area .chip{border:1px solid #999;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-area .bar{border:1px solid #ccc}
  .print-area svg{max-width:100%}
  @page{margin:14mm}
}
.menu-toggle{display:none}
@media(max-width:820px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:sticky;top:0;z-index:60;flex-direction:column;max-height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;justify-content:space-between;padding:11px 14px}
  .brand h1{font-size:14px} .brand p{display:none}
  .menu-toggle{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:9px;background:rgba(255,255,255,.12);color:#fff;border:none;font-size:20px;flex-shrink:0}
  .sm-picker,nav,.sidebar-foot{display:none}
  .sidebar.nav-open .sm-picker,.sidebar.nav-open nav,.sidebar.nav-open .sidebar-foot{display:block}
  nav{display:none} .sidebar.nav-open nav{display:block}
  nav button{width:100%;font-size:15px;padding:12px 13px;margin-bottom:3px}
  .content{padding:14px 12px 70px}
  .topbar{position:static;padding:12px 14px;flex-wrap:wrap;gap:8px}
  .topbar h2{font-size:16px}
  #topActions{flex-wrap:wrap;gap:6px}
  .btn{padding:9px 12px}
  .form-row,.form-row-3{grid-template-columns:1fr}
  table{font-size:12.5px}
  th,td{padding:8px 10px}
  .kpi{padding:12px 13px}
  .kpi .val{font-size:19px}
  .kpi-grid{gap:10px}
  .toolbar{gap:8px}
  .search{min-width:120px;flex:1 1 100%}
  .overlay{padding:14px 10px;align-items:flex-start}
  .modal-b{padding:16px}
  .modal.wide .kpi-grid{grid-template-columns:1fr 1fr}
  .panel-h{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div><h1>Collections &amp; Commission</h1>
      <p>Salesman • Party • Bill ledger</p></div>
      <button class="menu-toggle" onclick="App.toggleMenu()">☰</button>
    </div>
    <div class="sm-picker" id="smPicker">
      <label>Active salesman</label>
      <select id="smSelect" onchange="App.setSalesman(this.value)"></select>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button class="theme-btn" onclick="App.lockApp()" style="margin-bottom:6px">🔒 Lock app</button>
      <button class="theme-btn" onclick="App.toggleTheme()">Toggle light / dark</button>
      <div id="cloudStatus" style="margin-top:8px"></div>
      <div id="saveInfo" style="margin-top:6px"></div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="btn-row" id="topActions"></div>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="printArea" class="print-area"></div>
<div id="toasts"></div>

<script>
"use strict";
const App = (function(){
/* ---------------- State ---------------- */
const LS_KEY = "salesCommTracker_v1";
let state = { salesmen:[], parties:[], bills:[], payments:[], payouts:[], activeSalesmanId:null, settings:{defaultCommission:5} };
let route = "dashboard";
let ui = { billSearch:"", partySearch:"", finderQuery:"", monthPick:"", billStatusFilter:"all", commFrom:"", commTo:"", checkFilter:"unchecked", checkSearch:"", checkScopeAll:false, collFilter:"partial", collSearch:"", ledgerSearch:"", ledgerPartyId:"", riskSearch:"", discSearch:"" };

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function load(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const d=JSON.parse(raw); state=Object.assign(state,d); if(!state.settings) state.settings={defaultCommission:5}; } }catch(e){}
  if(!state.payouts) state.payouts=[];
  if(!state.activeSalesmanId && state.salesmen[0]) state.activeSalesmanId=state.salesmen[0].id;
}
let saveTimer=null;
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); setSaveInfo(cloud.connected?"Saved locally":"Saved locally"); }
  catch(e){ setSaveInfo("Local save unavailable — use Export"); }
  if(cloud.connected && !applyingRemote) pushCloud();
}
function setSaveInfo(msg){ const el=document.getElementById("saveInfo"); if(el) el.textContent=msg + " • " + new Date().toLocaleTimeString(); }

/* ---------------- Helpers ---------------- */
const N = v => { v=Number(v); return isFinite(v)?v:0; };
function money(v){ v=Math.round(N(v)); return "₹"+v.toLocaleString("en-IN"); }
function money0(v){ return N(v)? money(v) : "—"; }
function pct(v){ return (N(v)).toFixed(1)+"%"; }
function fdate(d){ if(!d) return "—"; const x=new Date(d); if(isNaN(x)) return "—"; return x.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"2-digit"}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ const x=new Date(a),y=new Date(b); if(isNaN(x)||isNaN(y))return 0; return Math.round((y-x)/86400000); }
function monthKey(d){ const x=new Date(d); if(isNaN(x))return "?"; return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"); }
function monthLabel(k){ if(k==="?")return "Unknown"; const [y,m]=k.split("-"); return new Date(y,m-1,1).toLocaleDateString("en-IN",{month:"short",year:"numeric"}); }
function norm(s){ return String(s==null?"":s).trim().toUpperCase().replace(/\s+/g," "); }
function fyEndYY(iso){ const d=new Date(iso); if(isNaN(d)) return ""; const y=d.getFullYear(), m=d.getMonth(); const end=(m>=3)?y+1:y; return String(end%100).padStart(2,"0"); }
function billCode(b){ return String(b.billNo).trim()+"/"+fyEndYY(b.date); }
function codeKey(billNo,date){ return norm(billNo)+"/"+fyEndYY(date); }

/* ---------------- Derived data ---------------- */
function activeSalesman(){ return state.salesmen.find(s=>s.id===state.activeSalesmanId)||null; }
function partiesOf(sid){ return state.parties.filter(p=>p.salesmanId===sid); }
function billsOf(sid){ return state.bills.filter(b=>b.salesmanId===sid); }
function paymentsOfBill(bid){ return state.payments.filter(p=>p.billId===bid); }
function partyById(id){ return state.parties.find(p=>p.id===id); }

function computeBill(bill){
  const pays = paymentsOfBill(bill.id);
  let received=0,gr=0,disc=0,wDays=0,wAmt=0,lastDate=null;
  pays.forEach(p=>{
    received+=N(p.received); gr+=N(p.gr); disc+=N(p.discount);
    if(N(p.received)>0){ const d=daysBetween(bill.date,p.date); wDays+=d*N(p.received); wAmt+=N(p.received); }
    if(!lastDate || new Date(p.date)>new Date(lastDate)) lastDate=p.date;
  });
  const rate = (bill.commissionOverride!=null && bill.commissionOverride!=="") ? N(bill.commissionOverride)
             : N((partyById(bill.partyId)||{}).commissionRate ?? state.settings.defaultCommission);
  const netBillable = N(bill.amount) - gr - disc;
  const balance = Math.max(0, round2(netBillable - received));
  const commEarned = round2(rate/100 * received);
  const commAccrued = round2(rate/100 * netBillable);
  const commPending = round2(Math.max(0, commAccrued - commEarned));
  const avgDays = wAmt>0 ? Math.round(wDays/wAmt) : null;
  const settled = balance<=0.5;
  let status = "pending";
  if(settled) status="paid";
  else if(received>0) status="partial";
  const oldestUnpaidDays = settled? 0 : daysBetween(bill.date, todayISO());
  return {received:round2(received),gr:round2(gr),disc:round2(disc),netBillable:round2(netBillable),
    balance,rate,commEarned,commAccrued,commPending,avgDays,lastDate,status,settled,oldestUnpaidDays,paysCount:pays.length};
}
function round2(v){ return Math.round(N(v)*100)/100; }

function aggregateParty(party){
  const bs = state.bills.filter(b=>b.partyId===party.id);
  let billed=0,received=0,gr=0,disc=0,balance=0,commEarned=0,commPending=0,wDays=0,wAmt=0,oldest=0,openBills=0;
  bs.forEach(b=>{ const c=computeBill(b);
    billed+=N(b.amount); received+=c.received; gr+=c.gr; disc+=c.disc; balance+=c.balance;
    commEarned+=c.commEarned; commPending+=c.commPending;
    if(c.avgDays!=null){ wDays+=c.avgDays*c.received; wAmt+=c.received; }
    if(!c.settled){ openBills++; oldest=Math.max(oldest,c.oldestUnpaidDays); }
  });
  const netBillable = billed-gr-disc;
  const collPct = netBillable>0 ? received/netBillable*100 : (billed>0?0:100);
  const avgDays = wAmt>0? Math.round(wDays/wAmt):null;
  const discPct = billed>0? disc/billed*100 : 0;
  return {billed,received,gr,disc,balance,commEarned,commPending,collPct,avgDays,discPct,oldest,openBills,billCount:bs.length};
}
function riskLevel(agg){
  let pts=0;
  if(agg.balance>100000)pts+=3; else if(agg.balance>50000)pts+=2; else if(agg.balance>20000)pts+=1;
  if(agg.oldest>150)pts+=3; else if(agg.oldest>90)pts+=2; else if(agg.oldest>60)pts+=1;
  if(agg.collPct<40)pts+=3; else if(agg.collPct<60)pts+=2; else if(agg.collPct<75)pts+=1;
  if(agg.avgDays!=null){ if(agg.avgDays>120)pts+=2; else if(agg.avgDays>90)pts+=1; }
  if(agg.balance<=0) return {level:"none",pts:0};
  if(pts>=6) return {level:"high",pts};
  if(pts>=3) return {level:"med",pts};
  return {level:"low",pts};
}
function aggregateSalesman(sid){
  const ps=partiesOf(sid);
  let a={billed:0,received:0,gr:0,disc:0,balance:0,commEarned:0,commPending:0,wDays:0,wAmt:0,openBills:0,parties:ps.length,risky:0};
  ps.forEach(p=>{ const g=aggregateParty(p);
    a.billed+=g.billed;a.received+=g.received;a.gr+=g.gr;a.disc+=g.disc;a.balance+=g.balance;
    a.commEarned+=g.commEarned;a.commPending+=g.commPending;a.openBills+=g.openBills;
    if(g.avgDays!=null){a.wDays+=g.avgDays*g.received;a.wAmt+=g.received;}
    const r=riskLevel(g); if(r.level==="high")a.risky++;
  });
  a.bills=billsOf(sid).length;
  a.netBillable=a.billed-a.gr-a.disc;
  a.collPct=a.netBillable>0?a.received/a.netBillable*100:0;
  a.avgDays=a.wAmt>0?Math.round(a.wDays/a.wAmt):null;
  a.discPct=a.billed>0?a.disc/a.billed*100:0;
  return a;
}
function monthwise(sid){
  const map={};
  billsOf(sid).forEach(b=>{ const k=monthKey(b.date); (map[k]=map[k]||{k,billed:0,received:0,gr:0,disc:0,comm:0,bills:0}); const c=computeBill(b);
    map[k].billed+=N(b.amount); map[k].bills++; });
  billsOf(sid).forEach(b=>{ const c=computeBill(b); paymentsOfBill(b.id).forEach(p=>{ const k=monthKey(p.date);
    map[k]=map[k]||{k,billed:0,received:0,gr:0,disc:0,comm:0,bills:0};
    map[k].received+=N(p.received); map[k].gr+=N(p.gr); map[k].disc+=N(p.discount);
    map[k].comm+=round2(c.rate/100*N(p.received)); }); });
  return Object.values(map).filter(m=>m.k!=="?").sort((a,b)=>a.k<b.k?-1:1);
}

function monthChart(mw){
  if(!mw.length) return "";
  const max=Math.max(1,...mw.map(m=>Math.max(m.billed,m.received)));
  const W=Math.max(560, mw.length*74), H=200, pad=28, bw=Math.min(26,(W-pad*2)/mw.length/2.4);
  let bars="";
  mw.forEach((m,i)=>{
    const x=pad+i*((W-pad*2)/mw.length)+((W-pad*2)/mw.length)/2;
    const hb=(m.billed/max)*(H-40), hr=(m.received/max)*(H-40);
    bars+=`<rect x="${x-bw-2}" y="${H-24-hb}" width="${bw}" height="${hb}" rx="2" fill="var(--gold)"></rect>`;
    bars+=`<rect x="${x+2}" y="${H-24-hr}" width="${bw}" height="${hr}" rx="2" fill="var(--green)"></rect>`;
    bars+=`<text x="${x}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${monthLabel(m.k).split(" ")[0]}</text>`;
  });
  return `<div class="panel"><div class="panel-h"><h3>Billed vs Collected by month</h3>
    <span class="hint"><span class="dot" style="background:var(--gold)"></span> Billed &nbsp; <span class="dot" style="background:var(--green)"></span> Collected</span></div>
    <div class="panel-pad" style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%;min-width:${Math.min(W,560)}px">${bars}</svg></div></div>`;
}

/* -------- Commission payout statement -------- */
function salesmanPayouts(sid){ return (state.payouts||[]).filter(p=>p.salesmanId===sid); }
function commRows(sid,from,to){
  const rows=[];
  billsOf(sid).forEach(b=>{ const rate=computeBill(b).rate; const party=(partyById(b.partyId)||{}).name;
    paymentsOfBill(b.id).forEach(p=>{ if(N(p.received)<=0) return;
      if(from && p.date<from) return; if(to && p.date>to) return;
      rows.push({date:p.date,party,billNo:b.billNo,received:N(p.received),rate,comm:round2(rate/100*N(p.received))}); }); });
  rows.sort((a,b)=>a.date<b.date?-1:1); return rows;
}
function earnedUpto(sid,upto){ let t=0; billsOf(sid).forEach(b=>{const rate=computeBill(b).rate;
  paymentsOfBill(b.id).forEach(p=>{ if(upto&&p.date>upto)return; t+=rate/100*N(p.received); }); }); return round2(t); }
function paidUpto(sid,upto){ return round2(salesmanPayouts(sid).filter(p=>!upto||p.date<=upto).reduce((s,p)=>s+N(p.amount),0)); }
function paidInRange(sid,from,to){ return salesmanPayouts(sid).filter(p=>(!from||p.date>=from)&&(!to||p.date<=to)); }

  const s=activeSalesman();
  const to=ui.commTo||todayISO(), from=ui.commFrom||"";
  const rows=commRows(s.id,from,to);
  const payR=paidInRange(s.id,from,to).sort((a,b)=>a.date<b.date?-1:1);
  const earnedPeriod=round2(rows.reduce((x,r)=>x+r.comm,0));
  const collectedPeriod=round2(rows.reduce((x,r)=>x+r.received,0));
  const paidPeriod=round2(payR.reduce((x,p)=>x+N(p.amount),0));
  const earnedAll=earnedUpto(s.id,to), paidAll=paidUpto(s.id,to), balance=round2(earnedAll-paidAll);
  setTop("Commission payout", `Earned on collections vs paid out — <b>${esc(s.name)}</b>`,
    `<button class="btn gold" onclick="App.recordPayout()">+ Record payout</button>
     <button class="btn" onclick="App.exportTable('commission')">Export</button>`);

  // group earned by month
  const bm={}; rows.forEach(r=>{ const k=monthKey(r.date); (bm[k]=bm[k]||{k,collected:0,comm:0}); bm[k].collected+=r.received; bm[k].comm+=r.comm; });
  const months=Object.values(bm).sort((a,b)=>a.k<b.k?-1:1);

  v.innerHTML=`
  <div class="kpi-grid">
    <div class="kpi accent"><div class="lab">Commission earned (to date)</div><div class="val num">${money(earnedAll)}</div><div class="foot">on all collections</div></div>
    <div class="kpi good"><div class="lab">Paid out (to date)</div><div class="val num">${money(paidAll)}</div><div class="foot">${salesmanPayouts(s.id).length} payouts</div></div>
    <div class="kpi ${balance>0?'bad':''}"><div class="lab">Balance payable</div><div class="val num">${money(balance)}</div><div class="foot">earned − paid</div></div>
  </div>
  <div class="toolbar">
    <label style="font-size:12px;color:var(--muted);font-weight:600">Period</label>
    <button class="btn sm" onclick="App.commPreset('this')">This month</button>
    <button class="btn sm" onclick="App.commPreset('last')">Last month</button>
    <button class="btn sm" onclick="App.commPreset('fy')">This FY</button>
    <button class="btn sm" onclick="App.commPreset('all')">All time</button>
    <span style="width:8px"></span>
    <input type="date" value="${from}" onchange="App.setUI('commFrom',this.value)"> <span style="color:var(--muted)">to</span>
    <input type="date" value="${ui.commTo||''}" onchange="App.setUI('commTo',this.value)">
  </div>
  <div class="panel"><div class="panel-h"><h3>Statement for period</h3>
    <span class="hint">${from?fdate(from):'start'} → ${fdate(to)}</span></div>
    <div class="panel-pad">
      <table style="max-width:520px"><tbody>
        <tr><td>Commission earned in period</td><td class="r num" style="font-weight:600">${money(earnedPeriod)}</td></tr>
        <tr><td style="color:var(--muted)">on collections of</td><td class="r num" style="color:var(--muted)">${money(collectedPeriod)}</td></tr>
        <tr><td>Paid out in period</td><td class="r num" style="font-weight:600;color:var(--green)">− ${money(paidPeriod)}</td></tr>
        <tr class="tbl-tot"><td>Net for period</td><td class="r num">${money(round2(earnedPeriod-paidPeriod))}</td></tr>
        <tr><td>Overall balance payable (to date)</td><td class="r num" style="font-weight:700;color:${balance>0?'var(--red)':'var(--green)'}">${money(balance)}</td></tr>
      </tbody></table>
    </div></div>

function commPreset(kind){
  const d=new Date();
  if(kind==="all"){ ui.commFrom=""; ui.commTo=todayISO(); }
  else if(kind==="this"){ const f=new Date(d.getFullYear(),d.getMonth(),1),t=new Date(d.getFullYear(),d.getMonth()+1,0); ui.commFrom=iso(f); ui.commTo=iso(t); }
  else if(kind==="last"){ const f=new Date(d.getFullYear(),d.getMonth()-1,1),t=new Date(d.getFullYear(),d.getMonth(),0); ui.commFrom=iso(f); ui.commTo=iso(t); }
  else if(kind==="fy"){ const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1; ui.commFrom=iso(new Date(y,3,1)); ui.commTo=iso(new Date(y+1,2,31)); }
  render();
}
function iso(x){ return x.toISOString().slice(0,10); }

function editSalesman(id){ if(isStaff())return;
  const s=id?state.salesmen.find(x=>x.id===id):null;
  openModal(`<div class="modal"><div class="modal-h"><h3>${s?'Edit':'Add'} salesman</h3><button class="icon-btn" onclick="App.closeModal()">✕</button></div>

  </div><div class="modal-f"><button class="btn ghost" onclick="App.closeModal()">Cancel</button>
  <button class="btn primary" onclick="App.saveSalesman('${id||''}')">Save</button></div></div>`);

function saveSalesman(id){ if(isStaff())return;
  const name=document.getElementById("f_name").value.trim();
  if(!name) return toast("Enter a name","err");
  const phone=document.getElementById("f_phone").value.trim();
  const staffPassword=document.getElementById("f_staffpw").value.trim();
  if(staffPassword){
    if(pwEq(staffPassword,state.settings.appPassword||"TUHI1274")) return toast("Staff password can't equal the owner password","err");
    if(state.salesmen.some(x=>x.id!==id && x.staffPassword && pwEq(x.staffPassword,staffPassword))) return toast("Another salesman already uses that staff password","err");
  }
  if(id){ const s=state.salesmen.find(x=>x.id===id); s.name=name; s.phone=phone; s.staffPassword=staffPassword; }
  else { const ns={id:uid(),name,phone,staffPassword}; state.salesmen.push(ns); state.activeSalesmanId=ns.id; }
  save(); closeModal(); render(); toast("Salesman saved","ok");
}
function deleteSalesman(id){ if(isStaff())return;
  const s=state.salesmen.find(x=>x.id===id);
  const nB=billsOf(id).length, nP=partiesOf(id).length;
  confirmModal(`Delete “${esc(s.name)}”?`,`This removes ${nP} parties and ${nB} bills for this salesman. This cannot be undone.`,()=>{
    state.parties=state.parties.filter(p=>p.salesmanId!==id);
    const billIds=billsOf(id).map(b=>b.id);
    state.bills=state.bills.filter(b=>b.salesmanId!==id);
    state.payments=state.payments.filter(p=>!billIds.includes(p.billId));
    state.payouts=(state.payouts||[]).filter(p=>p.salesmanId!==id);
    state.salesmen=state.salesmen.filter(x=>x.id!==id);
    if(state.activeSalesmanId===id) state.activeSalesmanId=state.salesmen[0]?state.salesmen[0].id:null;
    save(); closeModal(); render(); toast("Salesman deleted","ok");
  });
}

  const ps=partiesOf(s.id); if(ps.length) return ps[ps.length-1].commissionRate;

function saveBill(id){ if(isStaff())return;
  const partyId=document.getElementById("f_party").value;
  if(!partyId) return toast("Add a party first","err");
  const billNo=document.getElementById("f_billno").value.trim();
  const date=document.getElementById("f_bdate").value;
  const amount=N(document.getElementById("f_amt").value);
  const ovrRaw=document.getElementById("f_ovr").value.trim();
  const commissionOverride= ovrRaw===""?null:N(ovrRaw);
  const gstNote=(document.getElementById("f_gst")||{}).value?document.getElementById("f_gst").value.trim():"";
  const discountNote=(document.getElementById("f_dnote")||{}).value?document.getElementById("f_dnote").value.trim():"";
  if(!billNo) return toast("Enter bill no","err");
  if(!date) return toast("Enter bill date","err");
  const orig=id?state.bills.find(x=>x.id===id):null;
  const newCode=codeKey(billNo,date);
  const codeChanged=!orig || codeKey(orig.billNo,orig.date)!==newCode;
  if(codeChanged){ const dup=state.bills.some(x=>x.id!==id && codeKey(x.billNo,x.date)===newCode);
    if(dup) return toast("Bill code “"+billNo+"/"+fyEndYY(date)+"” already exists in your records","err"); }
  if(id){ Object.assign(orig,{partyId,billNo,date,amount,commissionOverride,gstNote,discountNote}); }
  else {
    const recv=N((document.getElementById("f_recv")||{}).value), gr=N((document.getElementById("f_gr")||{}).value), disc=N((document.getElementById("f_disc")||{}).value);
    if(recv+gr+disc > amount+0.5) return toast("Received + GR + discount ("+money(recv+gr+disc)+") can't exceed the bill amount ("+money(amount)+")","err");
    const bid=uid();
    state.bills.push({id:bid,salesmanId:state.activeSalesmanId,partyId,billNo,date,amount,commissionOverride,gstNote,discountNote});
    if(recv||gr||disc) state.payments.push({id:uid(),billId:bid,date,received:recv,gr,discount:disc});
  }
  save(); closeModal(); render(); toast("Bill saved","ok");
}

/* ---------------- Import Excel ---------------- */
function pickCol(headers,cands){
  const H=headers.map(h=>norm(h));
  for(const c of cands){ const i=H.indexOf(norm(c)); if(i>=0) return i; }
  for(let i=0;i<H.length;i++){ for(const c of cands){ if(H[i].includes(norm(c))) return i; } }
  return -1;
}
function sheetRows(wb,names){
  for(const n of names){ const key=wb.SheetNames.find(s=>norm(s)===norm(n)||norm(s).includes(norm(n)));
    if(key) return XLSX.utils.sheet_to_json(wb.Sheets[key],{header:1,raw:false,dateNF:'yyyy-mm-dd'}); }
  return null;
}
function toISO(v){
  if(v==null||v==="") return null;
  if(v instanceof Date) return v.toISOString().slice(0,10);
  const s=String(v).trim();
  let d=new Date(s); if(!isNaN(d)) return d.toISOString().slice(0,10);
  const m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if(m){ let[_,a,b,c]=m; if(c.length===2)c='20'+c; d=new Date(+c,+b-1,+a); if(!isNaN(d))return d.toISOString().slice(0,10);}
  return null;
}
function onImpTarget(v){
  document.getElementById("impNameWrap").style.display = v?"none":"block";
  document.getElementById("impModeWrap").style.display = v?"block":"none";
}
function doImport(){ if(isStaff())return;
  const fileEl=document.getElementById("xlsFile");
  const targetId=document.getElementById("impTarget").value;
  const mode=document.getElementById("impMode").value;
  const name=document.getElementById("impName").value.trim();
  const defComm=N(document.getElementById("impComm").value)||state.settings.defaultCommission;
  const log=document.getElementById("importLog");
  if(!fileEl.files[0]) return toast("Choose an Excel file","err");
  if(!targetId && !name) return toast("Enter salesman name","err");
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
      const billRows=sheetRows(wb,["Billing_Master","Billing","Bills","Billing Master"]);
      const recRows=sheetRows(wb,["Receipts_Master","Receipts","Receipt","Receipts Master"]);
      if(!billRows){ log.innerHTML='<span style="color:var(--red)">No Billing_Master sheet found.</span>'; return; }

      // Resolve target salesman + preserve customisations
      let sm, existingRates={}, existingOverrides={}, existingBillNos={}, existingPartyByName={};
      if(targetId){
        sm=state.salesmen.find(s=>s.id===targetId);
        partiesOf(sm.id).forEach(p=>{ existingRates[norm(p.name)]=p.commissionRate; existingPartyByName[norm(p.name)]=p; });
        billsOf(sm.id).forEach(b=>{ if(b.commissionOverride!=null&&b.commissionOverride!=="") existingOverrides[norm(b.billNo)]=b.commissionOverride; existingBillNos[norm(b.billNo)]=b; });
        if(mode==="overwrite"){
          const oldBillIds=billsOf(sm.id).map(b=>b.id);
          state.payments=state.payments.filter(p=>!oldBillIds.includes(p.billId));
          state.bills=state.bills.filter(b=>b.salesmanId!==sm.id);
          state.parties=state.parties.filter(p=>p.salesmanId!==sm.id);
          existingBillNos={};
        }
      } else {
        sm={id:uid(),name}; state.salesmen.push(sm);
      }

      const bHead=billRows[0];
      const bc={date:pickCol(bHead,["BILL DATE","DATE"]),party:pickCol(bHead,["PARTY NAME","PARTY"]),no:pickCol(bHead,["BILL NO","BILL NUMBER","BILLNO"]),amt:pickCol(bHead,["BILL AMOUNT","AMOUNT"])};
      const partyMap={}; // norm name -> party obj (reuse existing on merge)
      partiesOf(sm.id).forEach(p=>partyMap[norm(p.name)]=p);
      const billMap={}; // norm billNo -> billId (for this run's receipt matching)
      billsOf(sm.id).forEach(b=>billMap[norm(b.billNo)]=b.id);
      let nBills=0,nParties=0,skipped=0;

      for(let i=1;i<billRows.length;i++){ const row=billRows[i]; if(!row||row.length===0)continue;
        const pname=String(row[bc.party]||"").trim(); const amt=N(row[bc.amt]); const bno=String(row[bc.no]||"").trim();
        if(!pname||!bno) continue;
        const pk=norm(pname);
        if(!partyMap[pk]){ const rate=(existingRates[pk]!=null?existingRates[pk]:defComm);
          const np={id:uid(),salesmanId:sm.id,name:pname,commissionRate:rate,city:""}; state.parties.push(np); partyMap[pk]=np; nParties++; }
        if(mode==="merge" && billMap[norm(bno)]!=null){ skipped++; continue; } // don't duplicate existing bill
        const bid=uid();
        state.bills.push({id:bid,salesmanId:sm.id,partyId:partyMap[pk].id,billNo:bno,date:toISO(row[bc.date])||todayISO(),amount:amt,
          commissionOverride:(existingOverrides[norm(bno)]!=null?existingOverrides[norm(bno)]:null)});
        billMap[norm(bno)]=bid; nBills++;
      }

      let matched=0,unmatched=0; const unm=[];
      if(recRows){ const rHead=recRows[0];
        const rc={date:pickCol(rHead,["RECIEVING DATE","RECEIVING DATE","DATE"]),party:pickCol(rHead,["PARTY NAME","PARTY"]),no:pickCol(rHead,["BILL NO","BILLNO"]),
          recv:pickCol(rHead,["AMOUNT RECIEVED","AMOUNT RECEIVED","RECEIVED"]),gr:pickCol(rHead,["GR AMOUNT","GR"]),disc:pickCol(rHead,["DISCOUNT AMOUNT","DISCOUNT"])};
        for(let i=1;i<recRows.length;i++){ const row=recRows[i]; if(!row||row.length===0)continue;
          const bno=String(row[rc.no]||"").trim(); if(!bno) continue;
          const recv=N(row[rc.recv]),gr=N(row[rc.gr]),disc=N(row[rc.disc]);
          if(!recv&&!gr&&!disc) continue;
          const bid=billMap[norm(bno)];
          // On merge, only attach receipts to bills we added this run to avoid duplicating payments on existing bills.
          const isNewThisRun = !(mode==="merge" && existingBillNos[norm(bno)]!=null);
          if(bid && isNewThisRun){ state.payments.push({id:uid(),billId:bid,date:toISO(row[rc.date])||todayISO(),received:recv,gr,discount:disc}); matched++; }
          else if(!bid){ unmatched++; if(unm.length<6)unm.push(bno); }
        }
      }

      state.activeSalesmanId=sm.id; state.settings.defaultCommission=defComm;
      save(); render();
      const verb = targetId?(mode==="overwrite"?"Overwrote":"Merged into"):"Imported";
      log.innerHTML=`<span style="color:var(--green)">✓ ${verb} <b>${esc(sm.name)}</b>:</span> ${nParties} new part${nParties===1?'y':'ies'}, ${nBills} bills added, ${matched} payments.`
        + (skipped?`<br><span style="color:var(--muted)">${skipped} bills skipped (bill no already present).</span>`:"")
        + (unmatched?`<br><span style="color:var(--amber)">${unmatched} receipts had no matching bill${unm.length?' (e.g. '+unm.map(esc).join(", ")+')':''}.</span>`:"");
      toast(verb+" complete","ok");
    }catch(err){ console.error(err); log.innerHTML='<span style="color:var(--red)">Could not read file: '+esc(err.message)+'</span>'; }
  };
  reader.readAsArrayBuffer(fileEl.files[0]);
}

/* ---------------- Export in original 9-sheet source format ---------------- */
function makeSheet(aoa){
  const plain=aoa.map(row=>row.map(c=>(c&&typeof c==="object"&&!(c instanceof Date)&&"f"in c)?(("v"in c)?c.v:""):c));
  const ws=XLSX.utils.aoa_to_sheet(plain,{cellDates:true});
  aoa.forEach((row,r)=>row.forEach((c,ci)=>{ if(c&&typeof c==="object"&&!(c instanceof Date)&&"f"in c){
    const ref=XLSX.utils.encode_cell({r:r,c:ci}); const cell=ws[ref]||(ws[ref]={});
    cell.f=c.f; if(c.t)cell.t=c.t; if("v"in c)cell.v=c.v; else if(cell.v===undefined){cell.v=0;cell.t=cell.t||"n";}
  }}));
  return ws;
}
function billNoVal(b){ const t=String(b.billNo).trim(); const n=Number(t); return (t!==""&&!isNaN(n))?n:t; }
function dval(iso){ const d=new Date(iso); return isNaN(d)?iso:d; }
function monShort(d){ return new Date(d).toLocaleString("en-US",{month:"short"}); }
function monUp(y,m){ return new Date(y,m,1).toLocaleString("en-US",{month:"short"}).toUpperCase(); }
function exportSourceExcel(){
  const s=activeSalesman(); if(!s) return;
  const bills=billsOf(s.id), parties=partiesOf(s.id), A=aggregateSalesman(s.id), mw=monthwise(s.id);
  const pname=b=>((partyById(b.partyId)||{}).name||"");

  // 1. Billing_Master
  const bm=[["BILL DATE","PARTY NAME","BILL NO","BILL AMOUNT","MONTH","YEAR"]];
  bills.forEach((b,i)=>{ const r=i+2; const d=new Date(b.date);
    bm.push([ dval(b.date), pname(b), billNoVal(b), N(b.amount),
      {f:`TEXT(A${r},"MMM")`,t:"s",v:monShort(b.date)}, {f:`YEAR(A${r})`,t:"n",v:d.getFullYear()} ]); });

  // 3. Receipts_Master
  const rm=[["RECIEVING DATE","PARTY NAME","BILL NO ","AMOUNT RECIEVED","GR AMOUNT","DISCOUNT AMOUNT","MONTH ","YEAR","PAYMENT DAYS"]];
  let rr=1;
  bills.forEach(b=>{ paymentsOfBill(b.id).forEach(p=>{ if(!N(p.received)&&!N(p.gr)&&!N(p.discount))return; rr++; const r=rr; const d=new Date(p.date);
    rm.push([ dval(p.date), pname(b), billNoVal(b), N(p.received)||"", N(p.gr)||"", N(p.discount)||"",
      {f:`TEXT(A${r},"MMM")`,t:"s",v:monShort(p.date)}, {f:`YEAR(A${r})`,t:"n",v:d.getFullYear()}, daysBetween(b.date,p.date) ]); }); });

  // 2. Monthwise_Reports
  const mws=[["MONTH","YEAR ","BILLED","RECIEVED","GR","DISCOUNT"]];
  mw.forEach((m,i)=>{ const r=i+2; const [yy,mm]=m.k.split("-"); const mon=monUp(+yy,+mm-1); const yr=+yy;
    mws.push([ mon, yr,
      {f:`SUMIFS(Billing_Master!D:D,Billing_Master!E:E,A${r},Billing_Master!F:F,B${r})`,v:round2(m.billed)},
      {f:`SUMIFS(Receipts_Master!D:D,Receipts_Master!G:G,A${r},Receipts_Master!H:H,B${r})`,v:round2(m.received)},
      {f:`SUMIFS(Receipts_Master!E:E,Receipts_Master!G:G,A${r},Receipts_Master!H:H,B${r})`,v:round2(m.gr)},
      {f:`SUMIFS(Receipts_Master!F:F,Receipts_Master!G:G,A${r},Receipts_Master!H:H,B${r})`,v:round2(m.disc)} ]); });

  // 4. Party_Balances
  const pb=[["PARTY NAME","TOTAL BILLED","TOTAL RECIEVED","TOTAL GR","TOTAL DISCOUNT","BALANCE PENDING","DAYS SINCE OLD BILL","DIS"]];
  parties.forEach((p,i)=>{ const r=i+2; const g=aggregateParty(p); const net=round2(g.billed-g.gr-g.disc-g.received);
    pb.push([ p.name,
      {f:`SUMIF(Billing_Master!B:B,A${r},Billing_Master!D:D)`,v:round2(g.billed)},
      {f:`SUMIF(Receipts_Master!B:B,A${r},Receipts_Master!D:D)`,v:round2(g.received)},
      {f:`SUMIF(Receipts_Master!B:B,A${r},Receipts_Master!E:E)`,v:round2(g.gr)},
      {f:`SUMIF(Receipts_Master!B:B,A${r},Receipts_Master!F:F)`,v:round2(g.disc)},
      {f:`B${r}-C${r}-D${r}-E${r}`,v:net}, (net>0?g.oldest:""), (p.discountNote||"") ]); });

  // 5. Monthly_Pending_Report
  const mpr=[["MONTHLY PENDING REPORT","","","","",""],["","","","","",""],["MONTH","YEAR","PENDING","","",""]];
  mw.forEach(m=>{ const [yy,mm]=m.k.split("-"); mpr.push([ monUp(+yy,+mm-1), +yy, round2(pendingForBillMonth(s.id,m.k)), "","","" ]); });

  // 6. Dashboard
  const pend=round2(A.billed-A.received-A.gr-A.disc);
  const db=[["DASHBOARD",""],
    ["TOTAL BILLED",{f:"SUM(Billing_Master!D:D)",v:round2(A.billed)}],
    ["TOTAL RECIEVED",{f:"SUM(Receipts_Master!D:D)",v:round2(A.received)}],
    ["TOTAL GR",{f:"SUM(Receipts_Master!E:E)",v:round2(A.gr)}],
    ["TOTAL DISCOUNT",{f:"SUM(Receipts_Master!F:F)",v:round2(A.disc)}],
    ["TOTAL PENDING",{f:"B2-B3-B4-B5",v:pend}] ];

  // 7. BILL FINDER
  const bf=[["BILL ENQUIRY DASHBOARD","","","","",""],["","","","","",""],["ENTER BILL NO","","","","",""],["","","","","",""],
    ["PARTY",{f:'IFERROR(INDEX(Billing_Master!B:B,MATCH(B3,Billing_Master!C:C,0)),"")',t:"s",v:""}],
    ["BILL AMOUNT",{f:'IFERROR(INDEX(Billing_Master!D:D,MATCH(B3,Billing_Master!C:C,0)),"")',v:0}],
    ["RECEIVED",{f:"SUMIF(Receipts_Master!C:C,B3,Receipts_Master!D:D)",v:0}],
    ["GR",{f:"SUMIF(Receipts_Master!C:C,B3,Receipts_Master!E:E)",v:0}],
    ["DISCOUNT",{f:"SUMIF(Receipts_Master!C:C,B3,Receipts_Master!F:F)",v:0}],
    ["BALANCE",{f:'IFERROR(B6-B7-B8-B9,"")',v:0}] ];

  // 8. TOP PARTY ANALYSIS
  const last=parties.length+1;
  const billedArr=parties.map(p=>round2(aggregateParty(p).billed)).sort((a,b)=>b-a);
  const tp=[["PARTY NAME","TOTAL BILLING","TOTAL RECEIVED","TOTAL DISCOUNT","BALANCE","AVG PAYMENT DAYS","ROLLING RANK"]];
  parties.forEach((p,i)=>{ const r=i+2; const g=aggregateParty(p); const bill=round2(g.billed); const bal=round2(g.billed-g.received-g.disc);
    tp.push([ p.name,
      {f:`SUMIF(Billing_Master!B:B,A${r},Billing_Master!D:D)`,v:bill},
      {f:`SUMIF(Receipts_Master!B:B,A${r},Receipts_Master!D:D)`,v:round2(g.received)},
      {f:`SUMIF(Receipts_Master!B:B,A${r},Receipts_Master!F:F)`,v:round2(g.disc)},
      {f:`B${r}-C${r}-D${r}`,v:bal},
      {f:`IFERROR(AVERAGEIF(Receipts_Master!B:B,A${r},Receipts_Master!I:I),0)`,v:(g.avgDays!=null?g.avgDays:0)},
      {f:`RANK(B${r},$B$2:$B$${last},0)`,v:(billedArr.indexOf(bill)+1)} ]); });

  // 9. Party_Status
  const ps=[["PARTY NAME","BILL NO","BILL DATE","BILL AMOUNT","RECIEVED","GR","DISCOUNT","BALANCE","DAYS OUTSTANDING","STATUS"]];
  bills.forEach((b,i)=>{ const r=i+2; const c=computeBill(b); const net=round2(N(b.amount)-c.gr-c.disc-c.received);
    const daysOut=net>0?daysBetween(b.date,todayISO()):0;
    ps.push([ pname(b), billNoVal(b), dval(b.date), N(b.amount), c.received, c.gr, c.disc,
      {f:`D${r}-E${r}-F${r}-G${r}`,v:net},
      {f:`IF(H${r}<=0,0,TODAY()-C${r})`,v:daysOut},
      {f:`IF(H${r}<=0,0,TODAY()-C${r})`,v:daysOut} ]); });

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,makeSheet(bm),"Billing_Master");
  XLSX.utils.book_append_sheet(wb,makeSheet(mws),"Monthwise_Reports");
  XLSX.utils.book_append_sheet(wb,makeSheet(rm),"Receipts_Master");
  XLSX.utils.book_append_sheet(wb,makeSheet(pb),"Party_Balances");
  XLSX.utils.book_append_sheet(wb,makeSheet(mpr),"Monthly_Pending_Report");
  XLSX.utils.book_append_sheet(wb,makeSheet(db),"Dashboard");
  XLSX.utils.book_append_sheet(wb,makeSheet(bf),"BILL FINDER");
  XLSX.utils.book_append_sheet(wb,makeSheet(tp),"TOP PARTY ANALYSIS");
  XLSX.utils.book_append_sheet(wb,makeSheet(ps),"Party_Status");
  XLSX.writeFile(wb,(s.name||"salesman").replace(/[^\w\- ]/g,"").toUpperCase()+"_MP_LIST.xlsx");
  toast("Source Excel exported","ok");
}

    if(snap.metadata.hasPendingWrites) return;      // ignore our own write echo
    if(!snap.exists){ pushCloud(); return; }
    const d=snap.data(); if(d&&d.json) applyRemote(d);
  }, err=>{ console.error(err); cloud.lastError=err.message; updateCloudUI(); toast("Cloud error: "+err.message,"err"); }); }
function pushCloud(){ if(!cloud.connected||!fbDb) return; clearTimeout(cloudPushTimer);
  cloudPushTimer=setTimeout(()=>{ const json=JSON.stringify(state);
    if(json.length>950000){ toast("Data too large for a single cloud record","err"); return; }
    docRef().set({json,updatedAt:Date.now()}).then(()=>setSaveInfo("Saved to cloud")).catch(e=>{ setSaveInfo("Cloud save failed"); toast("Cloud save failed: "+e.message,"err"); });
  },700); }
async function connectCloud(showToast){
  if(!cloud.config){ if(showToast)toast("Paste your Firebase config first","err"); return; }
  if(typeof firebase==="undefined"){ if(showToast)toast("Firebase SDK not loaded — check your internet","err"); return; }
  try{
    if(!fbApp){ fbApp=firebase.initializeApp(cloud.config); }
    fbDb=firebase.firestore();
    if(cloud.email && cloud.password){ await firebase.auth().signInWithEmailAndPassword(cloud.email,cloud.password); }
    else { try{ await firebase.auth().signInAnonymously(); }catch(e){ /* auth may be off; continue */ } }
    cloud.connected=true; cloud.enabled=true; cloud.lastError=null; saveCloudCfg(); updateCloudUI();
    const snap=await docRef().get();
    if(snap.exists && snap.data() && snap.data().json){
      if(state.salesmen.length){
        chooseSyncModal(
          ()=>{ applyRemote(snap.data()); subscribeCloud(); toast("Using cloud data","ok"); },
          ()=>{ subscribeCloud(); pushCloud(); toast("Uploaded local data to cloud","ok"); });
      } else { applyRemote(snap.data()); subscribeCloud(); }
    } else { subscribeCloud(); pushCloud(); }
    if(showToast) toast("Connected to Firebase","ok");
  }catch(err){ console.error(err); cloud.connected=false; cloud.lastError=err.message; updateCloudUI(); toast("Connect failed: "+err.message,"err"); }
}
function disconnectCloud(){ if(isStaff())return; if(fbUnsub){fbUnsub();fbUnsub=null;} cloud.connected=false; cloud.enabled=false; saveCloudCfg(); updateCloudUI(); toast("Cloud sync turned off","ok"); }
function saveCloudAndConnect(){ if(isStaff())return;
  const cfg=parseCfg(document.getElementById("fbCfg").value);
  if(!cfg||!cfg.projectId){ return toast("That doesn't look like a valid Firebase config","err"); }
  cloud.config=cfg;
  cloud.workspace=(document.getElementById("fbWs").value.trim()||"default").replace(/[\/\s]/g,"_");
  cloud.email=(document.getElementById("fbEmail")||{}).value?document.getElementById("fbEmail").value.trim():"";
  const pw=(document.getElementById("fbPass")||{}).value||"";
  if(pw) cloud.password=pw;
  saveCloudCfg(); connectCloud(true);
}
function chooseSyncModal(useCloud,useLocal){
  window.__useCloud=useCloud; window.__useLocal=useLocal;
  openModal(`<div class="modal"><div class="modal-h"><h3>This workspace already has cloud data</h3></div>
  <div class="modal-b"><p style="margin-top:0;color:var(--muted)">Both your device and the cloud have data for workspace “${esc(cloud.workspace)}”. Which should be kept? The other is replaced.</p></div>
  <div class="modal-f"><button class="btn" onclick="App.closeModal();(window.__useLocal)()">Upload my device's data</button>
  <button class="btn primary" onclick="App.closeModal();(window.__useCloud)()">Use cloud data</button></div></div>`);
}
function updateCloudUI(){
  const f=document.getElementById("cloudStatus");
  if(f) f.innerHTML = cloud.connected? '<span style="color:#7be0a3">● Cloud sync on</span>' : (cloud.lastError? '<span style="color:#e07b7b">● Sync error</span>' : (cloud.config? '<span style="color:#e0a94a">○ Cloud off</span>' : '<span style="color:#7e8fb0">○ Local only</span>'));
  const p=document.getElementById("cloudPanelStatus");
  if(p) p.innerHTML = cloud.connected? `<span style="color:var(--green)">✓ Connected — syncing workspace “${esc(cloud.workspace||'default')}” in real time.</span>` : (cloud.lastError? `<span style="color:var(--red)">✕ ${esc(cloud.lastError)}</span>` : "Not connected.");
  const bc=document.getElementById("btnConnect"),bd=document.getElementById("btnDisconnect");
  if(bc) bc.style.display=cloud.connected?"none":"inline-flex";
  if(bd) bd.style.display=cloud.connected?"inline-flex":"none";
}

/* ---------------- Lock ---------------- */
let _mem={};
function ssGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return _mem[k]||null; } }
function ssSet(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){ _mem[k]=v; } }
function ssDel(k){ try{ sessionStorage.removeItem(k); }catch(e){ delete _mem[k]; } }
function pwEq(a,b){ return String(a||"").trim().toUpperCase()===String(b||"").trim().toUpperCase(); }
function isStaff(){ return ssGet("sct_role")==="staff"; }
function staffSid(){ return ssGet("sct_staffSalesman"); }
const STAFF_TABS=["parties","ledger","bills","collections","finder","pending","monthwise","risky","discount","reconcile"];
function pwOK(v){ return pwEq(v,state.settings.appPassword||"TUHI1274"); }
function showAppLock(){
  if(document.getElementById("appLock")) return;
  const el=document.createElement("div"); el.id="appLock"; el.className="lock-screen";
  el.innerHTML=`<div class="lock-card"><div class="lock-logo">🔒</div>
    <h2>${esc(state.settings.businessName||"Collections & Commission")}</h2>
    <p>Enter password to unlock</p>
    <input id="appPw" type="password" placeholder="Password">
    <div id="appPwErr" class="lock-err"></div>
    <button class="btn primary" style="width:100%" onclick="App.tryAppUnlock()">Unlock</button></div>`;
  document.body.appendChild(el);
  setTimeout(()=>{ const i=document.getElementById("appPw"); if(i){ i.focus(); i.addEventListener("keydown",e=>{ if(e.key==="Enter") App.tryAppUnlock(); }); } },50);
}
function tryAppUnlock(){
  const i=document.getElementById("appPw"); const v=i?i.value:"";
  if(pwOK(v)){ ssSet("sct_unlocked","1"); ssSet("sct_role","owner"); ssDel("sct_staffSalesman"); const el=document.getElementById("appLock"); if(el)el.remove(); boot(); return; }
  const sm=state.salesmen.find(s=>s.staffPassword && pwEq(s.staffPassword,v));
  if(sm){ ssSet("sct_unlocked","1"); ssSet("sct_role","staff"); ssSet("sct_staffSalesman",sm.id); ssSet("sct_dash","0"); state.activeSalesmanId=sm.id; const el=document.getElementById("appLock"); if(el)el.remove(); boot(); return; }
  const e=document.getElementById("appPwErr"); if(e)e.textContent="Wrong password"; if(i){ i.value=""; i.focus(); }
}
function lockApp(){ ssDel("sct_unlocked"); ssDel("sct_dash"); ssDel("sct_role"); ssDel("sct_staffSalesman"); showAppLock(); }
function renderDashLock(v){
  setTop("Dashboard","Protected — enter password to view commission and totals","");
  v.innerHTML=`<div class="panel"><div class="panel-pad empty" style="max-width:420px;margin:24px auto">
    <div class="big">🔒</div><h3>Dashboard is locked</h3>
    <p>This section shows salesman commission and business totals.</p>
    <input id="dashPw" type="password" placeholder="Password" style="width:100%;max-width:240px;margin:6px auto;display:block;text-align:center;letter-spacing:2px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)">
    <div id="dashPwErr" class="lock-err"></div>
    <button class="btn primary" onclick="App.tryDashUnlock()">Unlock dashboard</button>
  </div></div>`;
  setTimeout(()=>{ const i=document.getElementById("dashPw"); if(i){ i.focus(); i.addEventListener("keydown",e=>{ if(e.key==="Enter") App.tryDashUnlock(); }); } },50);
}
function tryDashUnlock(){
  const i=document.getElementById("dashPw"); const v=i?i.value:"";
  if(pwOK(v)){ ssSet("sct_dash","1"); render(); }
  else { const e=document.getElementById("dashPwErr"); if(e)e.textContent="Wrong password"; if(i){ i.value=""; i.focus(); } }
}
function lockDash(){ ssDel("sct_dash"); render(); toast("Dashboard locked","ok"); }
function setAppPassword(v){ if(isStaff())return; state.settings.appPassword=(v||"").trim()||"TUHI1274"; save(); toast("App password updated","ok"); }

/* ---------------- Init ---------------- */
function boot(){
  if(isStaff()){ const sid=staffSid(); if(sid && state.salesmen.some(s=>s.id===sid)) state.activeSalesmanId=sid; if(!STAFF_TABS.includes(route)) route="parties"; }
  render(); updateCloudUI(); if(cloud.enabled && cloud.config) connectCloud(false);
}
function init(){
  try{ const th=localStorage.getItem("sct_theme"); if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
  loadCloudCfg(); load();
  if(ssGet("sct_unlocked")==="1") boot(); else showAppLock();
}
return {init,go,setSalesman,setUI,searchInput,toggleTheme,toggleMenu,closeModal,
  tryAppUnlock,lockApp,tryDashUnlock,lockDash,setAppPassword,
  editSalesman,saveSalesman,deleteSalesman,editParty,saveParty,deleteParty,
  editBill,saveBill,deleteBill,addPayment,savePayment,editPayment,savePaymentEdit,delPayment,viewBill,viewParty,
  doImport,onImpTarget,exportJSON,importJSON,exportTable,exportSourceExcel,setDefaultComm,setBusinessName,wipe,
  printCurrent,printModal,saveCloudAndConnect,disconnectCloud,
  recordPayout,savePayout,delPayout,commPreset,
  toggleCheck,resetChecks,setCheckFilter,setCheckScope,openLedger,goPendingMonth};
})();
window.addEventListener("DOMContentLoaded",App.init);

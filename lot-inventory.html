<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>UTH Lot Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky vivid-denim header (dates + tabs), work area below; entry screens are forms with a live list of saved entries. Bright denim blue + marigold thread; every salesman owns a colour. */
:root{
  --bg:#edf2fd; --surface:#ffffff; --surface-2:#e2eafc; --line:#c9d6f3;
  --fg:#0c1533; --muted:#4c5878;
  --head:#1546d6; --head-2:#0f34a6; --head-ink:#ffffff;
  --th-bg:#1f50e0; --th-fg:#ffffff;
  --accent:#ffb000; --accent-ink:#2a1b00; --accent-soft:#fff1c9;
  --bar:#2563eb; --link:#1546d6;
  --ok:#0f8f47; --ok-bg:#d6f5e3; --warn:#b86e00; --warn-bg:#ffedc2;
  --bad:#d92637; --bad-bg:#ffdde1; --dead:#8a2bc7; --dead-bg:#f0dffc; --none-bg:#e7ebf5;
  --t-blue:#dce7ff; --t-gold:#fff0c7; --t-green:#d8f6e4; --t-pink:#ffe0ec; --t-violet:#ece2ff;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
:root,:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);box-shadow:0 2px 0 var(--accent)}
.hwrap{max-width:1320px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.04em;margin:0;text-transform:uppercase;line-height:1}
.brand h1 b{color:var(--accent)}
.brand small{opacity:.85;font-size:12px}
.switch{display:inline-flex;background:rgba(0,0,0,.22);border-radius:10px;padding:3px;gap:3px}
.switch button{font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:.06em;padding:5px 14px;border:0;border-radius:7px;background:transparent;color:#fff;opacity:.75;cursor:pointer}
.switch button:hover{opacity:1}
.switch button.on{background:var(--accent);color:var(--accent-ink);opacity:1}
.brandtag{display:inline-block;font-family:var(--f-display);font-size:.6em;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);padding:2px 9px;border-radius:6px;vertical-align:middle;margin-left:8px}
.gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(circle at 20% 10%,#2a5cf0 0,var(--head) 40%,var(--head-2) 100%)}
.gate-card{background:var(--surface);color:var(--fg);border-radius:18px;padding:28px 26px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(5,20,80,.45);border-top:6px solid var(--accent);display:flex;flex-direction:column;gap:10px}
.gate-brand{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--muted);text-transform:uppercase}
.gate-brand b{color:var(--accent)}
.gate-title{font-size:34px;margin:0;color:var(--link)}
.gate-sub{margin:0;color:var(--muted);font-size:14px}
.gate-lbl{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:6px}
#gatePw{font-size:18px;letter-spacing:.2em;padding:11px 12px}
#gateName{font-size:16px;padding:11px 12px}
.gate-err{min-height:18px;font-size:13px;font-weight:600;color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.welcome-card{max-width:440px}
.wstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 8px}
.wstat{border-radius:10px;padding:10px 12px;background:var(--t-blue)}
.wstat.g{background:var(--t-gold)}
.wstat .k{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.wstat .v{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.wstat .d{font-size:11.5px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.welcome-card{animation:pop .45s ease-out}}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,18,60,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:var(--surface);border-radius:16px;border-top:6px solid var(--accent);padding:20px;width:100%;max-width:560px;max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(5,20,80,.4)}
.modal-card .form{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:12px}
.live{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.14);display:inline-flex;gap:6px;align-items:center}
.live i{width:8px;height:8px;border-radius:50%;background:#9aa6c8;display:inline-block}
.live.on i{background:#3ee07f} .live.local i{background:var(--accent)} .live.ro i{background:#ff7884}
.range{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.range input[type=date]{font:inherit;font-size:13px;padding:5px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:inherit;color-scheme:dark}
.chip{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;cursor:pointer}
.chip:hover{background:rgba(255,255,255,.14)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.range .lbl{font-size:11.5px;opacity:.85;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;background:var(--head-2)}
nav button{font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:9px 12px;border:0;background:transparent;color:inherit;opacity:.78;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button:hover{opacity:1}
nav button.on{opacity:1;border-bottom-color:var(--accent);color:var(--accent)}
nav button.add{opacity:1;color:var(--accent)}
nav button.add.on{background:var(--accent);color:var(--accent-ink);border-bottom-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:18px 56px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance;color:var(--link)}
h3{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
/* frozen heading row: each table scrolls inside its own box, the heading stays pinned */
.tablewrap{overflow:auto;max-height:min(70vh,680px);border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tablewrap.short{max-height:none}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--th-fg);background:var(--th-bg);position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}
th:hover{filter:brightness(1.1)}
th.n,td.n{text-align:right}
th .arr{font-size:10px;color:var(--accent)}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
tbody tr:hover td{background:var(--accent-soft)}
tr:last-child td{border-bottom:0}
td.hl{font-weight:600}
td .q{color:var(--muted);font-family:var(--f-mono);font-size:12px;margin-left:6px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],input[type=text],input[type=number],input[type=date].f,select{font:inherit;font-size:14px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0;width:100%}
.tools input[type=search],.tools select{width:auto;font-size:13px;padding:6px 10px}
input:focus,select:focus{border-color:var(--bar);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--bar) 25%,transparent)}
.seg{display:inline-flex;border:1.5px solid var(--bar);border-radius:8px;overflow:hidden;flex-wrap:wrap;background:var(--surface)}
.seg button{font:inherit;font-size:12.5px;font-weight:500;padding:6px 11px;border:0;background:transparent;color:var(--link);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--bar);color:#fff;font-weight:600}
.btn{font:inherit;font-size:13px;font-weight:500;padding:7px 13px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--bar)}
.btn.primary{background:var(--bar);border-color:var(--bar);color:#fff;font-weight:600;padding:10px 18px;font-size:14px}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary:disabled{opacity:.5;cursor:not-allowed}
.btn.gold{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent;padding:4px 8px;font-size:12px}
.btn.danger.armed{background:var(--bad);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{border-radius:12px;padding:12px 14px;background:var(--t-blue)}
.kpi.gold{background:var(--t-gold)} .kpi.green{background:var(--t-green)} .kpi.pink{background:var(--t-pink)} .kpi.violet{background:var(--t-violet)}
.kpi.s-ok{background:var(--ok-bg)} .kpi.s-warn{background:var(--warn-bg)} .kpi.s-bad{background:var(--bad-bg)} .kpi.s-dead{background:var(--dead-bg)}
.kpi .k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.s-ok .v{color:var(--ok)} .kpi.s-warn .v{color:var(--warn)} .kpi.s-bad .v{color:var(--bad)} .kpi.s-dead .v{color:var(--dead)}
.kpi .d{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.card .band{background:var(--c);color:#fff;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .nm{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.card .rank{font-family:var(--f-mono);font-size:12px;background:rgba(255,255,255,.2);padding:1px 7px;border-radius:999px}
.card .tot{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.card .tot small{font-family:var(--f-body);font-size:12px;opacity:.9;font-weight:400}
.card .body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.meta{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.best{background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:8px;padding:8px 10px}
.best .k{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--warn)}
.best .v{font-weight:700;font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.best .v span:last-child{font-family:var(--f-mono);font-size:13px;font-weight:600}
.bars{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.bars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:12.5px}
.bars li .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars li .qq{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.bars li .b{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bars li .b i{display:block;height:100%;background:var(--c,var(--bar));border-radius:3px}
details summary{cursor:pointer;font-size:12.5px;color:var(--link);font-weight:500}
details[open] summary{margin-bottom:6px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.03em}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)} .p-dead{background:var(--dead-bg);color:var(--dead)} .p-none{background:var(--none-bg);color:var(--muted)}
.p-new{background:var(--accent);color:var(--accent-ink);font-size:10px;padding:1px 6px;margin-left:6px}
.smdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:middle}
.share{display:inline-block;width:64px;height:7px;background:var(--surface-2);border-radius:4px;vertical-align:middle;margin-right:6px;overflow:hidden}
.share i{display:block;height:100%;background:var(--c,var(--bar))}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:8px;min-width:0}
.empty{padding:28px;text-align:center;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13.5px;font-weight:500;z-index:50;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}
.note{font-size:13px;color:var(--muted);max-width:75ch;margin:6px 0 0;padding-left:18px}
.note li{margin-bottom:4px}
.filterchips{display:flex;gap:6px;flex-wrap:wrap}
.filterchips .chip{border:1.5px solid var(--line);color:var(--fg);background:var(--surface)}
.filterchips .chip.on{background:var(--bar);border-color:var(--bar);color:#fff}
/* entry forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.field label em{color:var(--bad);font-style:normal}
.field.big input{font-family:var(--f-mono);font-size:18px;font-weight:600;text-transform:uppercase}
.hint{font-size:12.5px;min-height:18px}
.hint.ok{color:var(--ok);font-weight:600} .hint.bad{color:var(--bad);font-weight:600} .hint.warn{color:var(--warn);font-weight:600}
.hint button{font:inherit;font-size:12px;font-weight:600;border:0;background:var(--accent-soft);color:var(--warn);border-radius:6px;padding:2px 8px;cursor:pointer;margin-left:4px}
.dupsku{background:var(--bad);color:#fff;padding:2px 7px;border-radius:5px;font-weight:700}
.heat{font-family:var(--f-mono);text-align:right}
.heat.max{outline:2px solid var(--accent);outline-offset:-2px;font-weight:700}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
.mx th:first-child{z-index:3;background:var(--th-bg)}
.mx tbody tr:hover td:first-child{background:var(--accent-soft)}
.mxtot td{font-weight:700;background:var(--surface-2)!important}
.hilite{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.hl-card{border-radius:12px;padding:12px 14px;background:var(--surface);border:2px solid var(--c,var(--bar))}
.hl-card .k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hl-card .v{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--c,var(--bar));line-height:1.1}
.hl-card .d{font-size:12.5px;color:var(--muted)}
.bad-input{border-color:var(--bad)!important;background:var(--bad-bg)!important}
.ok-input{border-color:var(--ok)!important}
.formfoot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:28px minmax(110px,1.1fr) minmax(70px,.5fr) minmax(0,2fr) auto;gap:8px;align-items:center}
.line .ln{font-family:var(--f-mono);color:var(--muted);font-size:12px;text-align:right}
.line .info{font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .info b{color:var(--fg)}
.line .info.bad{color:var(--bad);font-weight:600}
.line .info .low{color:var(--warn);font-weight:600}
.linehead{display:grid;grid-template-columns:28px minmax(110px,1.1fr) minmax(70px,.5fr) minmax(0,2fr) auto;gap:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.banner{border-radius:10px;padding:10px 14px;font-size:13px;background:var(--t-gold);border:1px solid var(--accent)}
.banner.ro{background:var(--bad-bg);border-color:var(--bad)}
.total-big{font-family:var(--f-display);font-size:24px;font-weight:700}
@media (max-width:640px){
  .line,.linehead{grid-template-columns:22px minmax(0,1fr) 72px auto}
  .line .info{grid-column:2/-1;white-space:normal}
  .linehead span:nth-child(4){display:none}
}
@media (max-width:640px){#srcInfo{display:none} .range{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px} .range>*{flex:none} #presets{flex-wrap:nowrap!important} .range .lbl{display:none}}
@media (max-width:520px){.wstat .v{font-size:19px} .brand h1{font-size:23px} .kpi .v{font-size:26px}}
@media (prefers-reduced-motion: no-preference){.bars li .b i{transition:width .3s ease}}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>


<div id="gate" class="gate">
  <form class="gate-card" id="gateForm" autocomplete="off">
    <div class="gate-brand">UTH <b>·</b> RECKLESS</div>
    <h2 class="gate-title">Lot Inventory</h2>
    <p class="gate-sub">Enter the password to open the app.</p>
    <label for="gatePw" class="gate-lbl">Password</label>
    <input type="password" id="gatePw" autocomplete="current-password">
    <div class="gate-err" id="gateErr"></div>
    <button class="btn primary" type="submit" id="gateBtn" style="width:100%">Unlock</button>
  </form>
</div>
<div id="welcome" class="gate" hidden>
  <div class="gate-card welcome-card">
    <div class="gate-brand" id="wDate"></div>
    <h2 class="gate-title" id="wHello"></h2>
    <p class="gate-sub" id="wSub"></p>
    <div class="wstats" id="wStats"></div>
    <button class="btn primary" id="wGo" style="width:100%">Open inventory</button>
  </div>
</div>
<header>
  <div class="hwrap">
    <div class="brand"><div class="switch" id="brandSwitch" role="group" aria-label="Inventory"><button data-brand="uth">UTH</button><button data-brand="reckless">RECKLESS</button></div><h1 id="appTitle">UTH <b>Lot</b> Inventory</h1><span class="live" id="liveChip"><i></i><span>Connecting…</span></span><small id="srcInfo"></small><button class="chip" id="lockBtn" style="margin-left:auto">🔒 Lock</button></div>
    <div class="range">
      <span class="lbl">Sales dates</span>
      <input type="date" id="dFrom" aria-label="From date">

/* ---------- generic sortable table (heading row frozen) ---------- */
function table(id,cols,rows,defSort,opts={}){
  const st=S.sorts[id]||(S.sorts[id]=defSort||{k:cols[0].k,d:-1});
  const c=cols.find(c=>c.k===st.k);
  const sorted=opts.nosort?rows:[...rows].sort((a,b)=>{let x=a[st.k],y=b[st.k];if(x==null||x==='')return 1;if(y==null||y==='')return -1;
    if(c&&c.num)return (x-y)*st.d;return String(x).localeCompare(String(y),undefined,{numeric:true})*st.d});
  const head=cols.map(c=>`<th class="${c.num?'n':''}" ${c.nosort||opts.nosort?'':`data-sort="${id}|${c.k}"`}>${esc(c.label)} <span class="arr">${!opts.nosort&&st.k===c.k?(st.d>0?'▲':'▼'):''}</span></th>`).join('');
  const body=sorted.map(r=>'<tr>'+cols.map(c=>`<td class="${c.num?'n num':''} ${c.cls||''}">${c.f?c.f(r[c.k],r):esc(r[c.k])}</td>`).join('')+'</tr>').join('');
  return `<div class="tablewrap ${opts.short?'short':''}"><table><thead><tr>${head}</tr></thead><tbody>${body||`<tr><td colspan="${cols.length}" class="empty">Nothing matches these filters.</td></tr>`}</tbody></table></div>`;
}
document.addEventListener('click',e=>{
  const th=e.target.closest('[data-sort]');if(!th)return;
  const[id,k]=th.dataset.sort.split('|');const st=S.sorts[id];
  if(st.k===k)st.d*=-1;else{st.k=k;st.d=-1}
  if(FORM_TABS.has(S.tab))renderRecent();else render();
});

async function copyTSV(rows){

const DIMS=[['sort','Sort No'],['sku','SKU'],['mrp','MRP'],['fit','Fit'],['series','Series'],['lot','Lot'],['party','Party']];
const rangeLabel=()=>`${fd(S.from)} to ${fd(S.to)}`;

function matrix(rows,rowKey,colKey,rowLabel,opts={}){
  const rt={},ct={},cell={};let max=0;
  rows.forEach(r=>{const a=r[rowKey],b=r[colKey];rt[a]=(rt[a]||0)+r.qty;ct[b]=(ct[b]||0)+r.qty;const k=a+'\u0001'+b;cell[k]=(cell[k]||0)+r.qty});
  Object.values(cell).forEach(v=>{if(v>max)max=v});
  const R_=Object.keys(rt).sort((a,b)=>rt[b]-rt[a]), C=opts.cols||Object.keys(ct).sort((a,b)=>ct[b]-ct[a]);
  const total=Object.values(rt).reduce((a,b)=>a+b,0);
  if(!R_.length)return '<div class="panel empty">No sales between these dates.</div>';
  const head=`<th>${esc(rowLabel)}</th>`+C.map(c=>`<th class="n">${esc(c)}</th>`).join('')+'<th class="n">Total</th>';
  const body=R_.map(a=>{const vals=C.map(c=>cell[a+'\u0001'+c]||0);const rm=Math.max(...vals);
    return `<tr><td class="hl">${opts.rowTag?opts.rowTag(a):esc(a)}</td>`+vals.map(v=>`<td class="heat ${v&&v===rm?'max':''}" style="${v?`background:color-mix(in srgb,var(--bar) ${Math.round(8+v/max*55)}%,var(--surface));${v/max>.45?'color:#fff;':''}`:''}">${v?fmt(v):'·'}</td>`).join('')+`<td class="n num hl">${fmt(rt[a])}</td></tr>`}).join('');
  const foot=`<tr class="mxtot"><td>Total</td>`+C.map(c=>`<td class="n num">${fmt(ct[c]||0)}</td>`).join('')+`<td class="n num">${fmt(total)}</td></tr>`;
  return `<div class="tablewrap"><table class="mx"><thead><tr>${head}</tr></thead><tbody>${body}${foot}</tbody></table></div>`;
}

function nextFree(prefix){
  let max=0; const re=new RegExp('^'+prefix.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'-(\\d+)$');
  Object.keys(SKU).forEach(k=>{const m=k.match(re);if(m)max=Math.max(max,+m[1])});
  let n=max+1; while(SKU[`${prefix}-${n}`])n++; return `${prefix}-${n}`;
}

function checkSku(){
  const el=document.getElementById('i_sku'), h=document.getElementById('h_sku'); if(!el)return false;
  const v=normSku(el.value); el.classList.remove('bad-input','ok-input');
  if(!v){h.className='hint';h.textContent='Type a code. Series letter alone (like P) suggests the next free number.';return false}
  if(SKU[v]){const i=SKU[v];el.classList.add('bad-input');h.className='hint bad';
    h.innerHTML=`${esc(v)} already exists (lot ${esc(i.lot)}, ${esc(i.sort)}, ${fmt(i.qty)} pcs). It cannot be entered again.`;return false}
  if(!/^[A-Z0-9][A-Z0-9 \-\/._]*$/.test(v)){el.classList.add('bad-input');h.className='hint bad';h.textContent='Use letters, numbers and dashes only.';return false}
  if(/^[A-Z]+-?$/.test(v)){const sug=nextFree(v.replace('-',''));h.className='hint warn';
    h.innerHTML=`Series ${esc(v.replace('-',''))}: add a number. Next free code is ${esc(sug)} <button type="button" data-sug="${esc(sug)}">Use ${esc(sug)}</button>`;return false}
  el.classList.add('ok-input');h.className='hint ok';h.textContent=`✓ ${v} is free.`;
  return true;
}
function checkLot(){
  const el=document.getElementById('i_lot'),h=document.getElementById('h_lot');if(!el)return {ok:true};
  const v=normTxt(el.value); const ex=Object.values(SKU).filter(i=>i.lot===v);
  const q=parseInt((document.getElementById('i_qty')||{}).value,10)||0;
  const lpEl=document.getElementById('i_lotpcs'),lh=document.getElementById('h_lotpcs');
  const rec=LOTPCS[v]; const used=LOTINW[v]||0;
  // pieces in lot: locked once recorded
  if(v&&rec){lpEl.value=rec;lpEl.readOnly=true}else if(lpEl.readOnly){lpEl.readOnly=false;lpEl.value=''}
  const lp=parseInt(lpEl.value,10)||0;
  let ok=true;
  lpEl.classList.remove('bad-input');
  if(!v){lh.className='hint';lh.textContent='Total pieces in this lot. Inward across all its SKUs can\'t go over this.'}
  else if(!lp){lh.className='hint warn';lh.textContent=used?`${fmt(used)} pcs already inwarded for lot ${v}. Enter the lot's total pieces.`:`New lot. Enter its total pieces.`;ok=false}
  else{
    const left=lp-used;
    if(lp<used){lpEl.classList.add('bad-input');lh.className='hint bad';lh.textContent=`Lot ${v} already has ${fmt(used)} pcs inwarded, more than ${fmt(lp)}.`;ok=false}
    else if(q>left){lh.className='hint bad';lh.textContent=`Only ${fmt(left)} pcs left in lot ${v} (${fmt(used)} of ${fmt(lp)} already inwarded). Reduce qty.`;ok=false}
    else{lh.className='hint ok';lh.textContent=`Lot ${v}: ${fmt(lp)} pcs · ${fmt(used)} inwarded · ${fmt(left-q)} left after this${rec?'':' (lot pieces will be saved)'}`}
  }
  const qEl=document.getElementById('i_qty');qEl&&qEl.classList.toggle('bad-input',!!(lp&&q>lp-used));
  const same=v&&q>0?ex.filter(i=>i.qty===q):[];
  const cd=document.getElementById('h_code');
  if(cd){cd.innerHTML=v&&q>0?`Lot+Pcs code: <b class="mono ${same.length?'dupsku':''}">${esc(v)}-${q}</b>`:'';}
  if(same.length){h.className='hint bad';h.textContent=`Lot ${v} with ${q} pcs is already entered as ${same.map(i=>i.sku).join(', ')}. This looks like the same pieces entered twice. You can still save, but the SKU will be marked red.`}
  else{h.className=ex.length?'hint warn':'hint'; h.textContent=ex.length?`Lot ${v} already has ${ex.map(i=>i.sku).join(', ')}.`:''}
  return {ok,lp,used,rec};
}
function fillFromSort(){
  const v=normTxt(document.getElementById('i_sort').value); const h=document.getElementById('h_sort');
  const m=Object.values(SKU).find(i=>i.sort===v);
  if(!m){h.className='hint';h.textContent=v?'New sort no.':'';return}
  const fit=document.getElementById('i_fit'),mrp=document.getElementById('i_mrp');
  if(!fit.value)fit.value=m.fit; if(!mrp.value)mrp.value=m.mrp;
  h.className='hint';h.textContent=`Known sort: ${m.fit} · ${m.mrp}`;
}
async function saveInward(){
  const g=id=>document.getElementById(id).value;
  const e={sku:normSku(g('i_sku')),lot:normTxt(g('i_lot')),date:g('i_date'),qty:parseInt(g('i_qty'),10),sort:normTxt(g('i_sort')),fit:normTxt(g('i_fit')),mrp:normTxt(g('i_mrp'))};
  if(!checkSku())return toast(e.sku?`${e.sku} cannot be saved. See the message under SKU code.`:'Enter a SKU code.',1);
  const miss=[['lot','Lot no'],['sort','Sort no'],['fit','Fit'],['mrp','MRP']].filter(([k])=>!e[k]).map(x=>x[1]);
  if(miss.length)return toast('Fill in: '+miss.join(', '),1);
  if(!(e.qty>0))return toast('Inward qty must be a whole number above 0.',1);
  const L=checkLot();
  if(!L.lp)return toast(`Enter the total pieces in lot ${e.lot}.`,1);
  if(L.lp<L.used)return toast(`Lot ${e.lot} already has ${fmt(L.used)} pcs inwarded, more than ${fmt(L.lp)}. Check the lot pieces.`,1);
  if(e.qty>L.lp-L.used)return toast(`Only ${fmt(L.lp-L.used)} pcs left in lot ${e.lot}. Inward can't be more than the pieces in the lot.`,1);
  e.lotpcs=L.rec?null:L.lp;
  const btn=document.getElementById('inwSave');btn.disabled=true;btn.textContent='Saving…';
  try{
    await addInward(e);
    toast(`Saved ${e.sku} · ${fmt(e.qty)} pcs`);
    document.getElementById('i_sku').value='';document.getElementById('i_qty').value='';setTimeout(()=>{checkSku();checkLot()},50);
    document.getElementById('i_sku').focus();
  }catch(err){toast(err.message||'Could not save. Try again.',1)}
  finally{btn.disabled=!Store.canWrite;btn.textContent='Save inward'}
}
function docIdFor(sku){return sku.replace(/[^A-Za-z0-9\-.~:@+]/g,c=>'_'+c.charCodeAt(0).toString(16)+'_')}
async function addInward(e){
  if(SKU[e.sku])throw new Error(`${e.sku} already exists. It cannot be entered again.`);
  const lotpcs=e.lotpcs;delete e.lotpcs;
  const rec={...e,by:Store.uid||'',at:Date.now()};
  if(Store.mode==='live'){
    const ref=Store.db.collection(COL('inward')).doc(docIdFor(e.sku));
    const lr=Store.db.collection(COL('lots')).doc(docIdFor(e.lot));
    const wasDeleted=!!(EDITS['I:'+e.sku]&&EDITS['I:'+e.sku].deleted);
    try{
      await Store.db.runTransaction(async tx=>{
        const snap=await tx.get(ref);
        const lsn=lotpcs?await tx.get(lr):null;
        if(snap.exists&&!wasDeleted)throw new Error(`${e.sku} was just saved by someone else. It cannot be entered again.`);
        if(lotpcs&&!lsn.exists)tx.set(lr,{lot:e.lot,pcs:lotpcs,by:Store.uid||'',at:Date.now()});
        tx.set(ref,rec);
      });
    }catch(err){if(err&&err.message&&!err.code)throw err;throw dbErr(err)}
    if(wasDeleted)await removeEdit('I:'+e.sku);
  }else if(Store.mode==='local'){
    if(EDITS['I:'+e.sku])ENTRIES.edits=ENTRIES.edits.filter(x=>x.key!=='I:'+e.sku),EBY[BRAND].edits=ENTRIES.edits;
    ENTRIES.inward=ENTRIES.inward.filter(x=>normSku(x.sku)!==e.sku);EBY[BRAND].inward=ENTRIES.inward;
    if(lotpcs&&!LOTPCS[e.lot])ENTRIES.lots.push({id:docIdFor(e.lot),lot:e.lot,pcs:lotpcs,at:Date.now()});
    ENTRIES.inward.push({id:docIdFor(e.sku),...rec});saveLocal();onEntries();
  }else throw new Error('Still connecting. Try again in a moment.');
}

function drawLines(focusIdx){
  const box=document.getElementById('lines');if(!box)return;
  const ro=!Store.canWrite?'disabled':'';
  box.innerHTML=LINES.map((l,i)=>`<div class="line" data-i="${i}">
    <span class="ln">${i+1}</span>
    <input type="text" class="l-sku" list="dl-sku" value="${esc(l.sku)}" placeholder="SKU" aria-label="SKU line ${i+1}" style="font-family:var(--f-mono);text-transform:uppercase" ${ro}>
    <input type="number" class="l-qty" min="1" step="1" inputmode="numeric" value="${esc(l.qty)}" placeholder="Qty" aria-label="Qty line ${i+1}" ${ro}>
    <span class="info" id="li_${i}"></span>
    <button type="button" class="btn danger" data-rm="${i}" aria-label="Remove line ${i+1}" ${LINES.length===1?'disabled':''}>✕</button></div>`).join('');
  LINES.forEach((_,i)=>lineInfo(i));
  if(focusIdx!=null){const r=box.querySelectorAll('.l-sku')[focusIdx];r&&r.focus()}
  billTotal();
}
function lineInfo(i){
  const el=document.getElementById('li_'+i);if(!el)return;const l=LINES[i];const k=normSku(l.sku);
  const inp=document.querySelectorAll('.l-sku')[i];inp&&inp.classList.remove('bad-input','ok-input');
  if(!k){el.className='info';el.textContent='';return}
  const it=SKU[k];
  if(!it){el.className='info bad';el.textContent=`${k} is not in INWARD. Add it there first.`;inp&&inp.classList.add('bad-input');return}
  const dup=LINES.findIndex((x,j)=>j!==i&&normSku(x.sku)===k);
  if(dup>-1&&dup<i){el.className='info bad';el.textContent=`Already on line ${dup+1}. Change that line's qty instead.`;inp&&inp.classList.add('bad-input');return}
  inp&&inp.classList.add('ok-input');
  const bal=it.qty-soldOf(k); const q=+l.qty||0;
  const det=`${esc(it.sort)} · ${esc(it.fit)} · ${esc(it.mrp)} · lot ${esc(it.lot)}`;
  if(bal<=0||q>bal){inp&&inp.classList.replace('ok-input','bad-input');const qi=document.querySelectorAll('.l-qty')[i];qi&&qi.classList.add('bad-input');
    el.className='info bad';el.innerHTML=bal<=0?`No stock left for ${esc(k)} (balance ${fmt(bal)}). Cannot sell.`:`Only ${fmt(bal)} in stock. Reduce qty to ${fmt(bal)} or less.`;return}
  {const qi=document.querySelectorAll('.l-qty')[i];qi&&qi.classList.remove('bad-input')}
  el.className='info';
  el.innerHTML=`<b>${det}</b> · ${fmt(bal)} in stock → ${fmt(bal-q)} after`;
}
function billTotal(){const t=document.getElementById('billTotal');if(t)t.textContent=fmt(LINES.reduce((a,l)=>a+(+l.qty||0),0))}
function nameHint(id,hid,list,label){
  const v=normTxt(document.getElementById(id).value),h=document.getElementById(hid);
  if(!v){h.className='hint';h.textContent='';return}
  const known=new Set(list);
  h.className=known.has(v)?'hint ok':'hint warn';
  h.textContent=known.has(v)?`✓ Existing ${label}`:`New ${label}. Check the spelling.`;
}
async function saveSales(){
  const g=id=>document.getElementById(id).value;
  const date=g('s_date'),party=normTxt(g('s_party')),sm=normTxt(g('s_sm'));
  if(!date||!party||!sm)return toast('Fill in sold date, party and salesman.',1);
  const lines=LINES.map(l=>({sku:normSku(l.sku),qty:parseInt(l.qty,10)})).filter(l=>l.sku||l.qty);
  if(!lines.length)return toast('Add at least one SKU line.',1);
  for(const [i,l] of lines.entries()){
    if(!SKU[l.sku])return toast(`Line ${i+1}: ${l.sku||'SKU'} is not in INWARD.`,1);
    if(!(l.qty>0))return toast(`Line ${i+1}: qty must be a whole number above 0.`,1);
    if(lines.findIndex(x=>x.sku===l.sku)!==i)return toast(`${l.sku} is on two lines. Combine them into one.`,1);
    const bal=SKU[l.sku].qty-soldOf(l.sku);
    if(l.qty>bal)return toast(bal<=0?`${l.sku} has no stock left (balance ${fmt(bal)}). Remove line ${i+1}.`:`${l.sku}: only ${fmt(bal)} in stock. Stock cannot go below zero.`,1);
  }
  const btn=document.getElementById('salSave');btn.disabled=true;btn.textContent='Saving…';
  const rec={date,party,sm,lines,by:Store.uid||'',at:Date.now()};
  try{
    if(Store.mode==='live'){try{await Store.db.collection(COL('bills')).add(rec)}catch(err){throw dbErr(err)}}
    else if(Store.mode==='local'){ENTRIES.bills.push({id:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),...rec});saveLocal();onEntries()}
    else throw new Error('Still connecting. Try again in a moment.');
    const pcs=lines.reduce((a,l)=>a+l.qty,0);
    toast(`Saved bill for ${party} · ${lines.length} line${lines.length>1?'s':''} · ${fmt(pcs)} pcs`);
    LINES=[{sku:'',qty:''}];drawLines(0);
    document.getElementById('h_party').textContent='';document.getElementById('s_party').value='';
  }catch(err){toast(err.message||'Could not save. Try again.',1)}
  finally{btn.disabled=!Store.canWrite;btn.textContent='Save bill'}
}

/* ---------- recently added lists (live) ---------- */
async function names(ids){
  const out={};ids=[...new Set(ids.filter(Boolean))];
  ids.forEach(id=>out[id]=id);
  return out;
}
function filterBar(kind,rows,extra=''){
  const F=S['f_'+kind]||(S['f_'+kind]={series:'ALL',fit:'ALL',mrp:'ALL',sm:'ALL'});
  const opts=(key,label)=>{const vals=[...new Set(rows.map(r=>r[key]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));
    return `<select data-f="${kind}|${key}" aria-label="${label}"><option value="ALL">All ${label}</option>${vals.map(v=>`<option ${F[key]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`};
  return `<div class="tools">${search(kind,'Search…')}${opts('series','series')}${opts('fit','fits')}${opts('mrp','MRPs')}${kind==='latS'?opts('sm','salesmen'):''}${extra}</div>`;
}
function applyF(kind,rows){const F=S['f_'+kind];return rows.filter(r=>['series','fit','mrp','sm'].every(k=>!F||F[k]==='ALL'||r[k]===F[k]))}
async function renderRecent(){
  const box=document.getElementById('recent');if(!box)return;

    const dups=rows.filter(r=>r.dupLP).length, pcs=rows.reduce((a,r)=>a+r.qty,0);/* newest first: app entries, then the workbook's last rows */

      table('latI',[{k:'date',label:'Active date',f:(v,r)=>v?fd(v)+(r.edited?'<span class="pill p-warn" style="margin-left:6px">EDITED</span>':''):'<span class="pill p-bad">NO DATE</span>'},{k:'sku',label:'SKU',cls:'mono hl',f:skuCell},{k:'code',label:'Lot+Pcs code',cls:'mono'},{k:'lot',label:'Lot',cls:'mono'},
      {k:'qty',label:'Inward',num:1,f:fmt},{k:'sold',label:'Sold',num:1,f:fmt},{k:'bal',label:'Balance',num:1,f:fmt},{k:'series',label:'Series'},{k:'sort',label:'Sort No'},{k:'fit',label:'Fit'},{k:'mrp',label:'MRP'},
      {k:'at',label:'Entered',nosort:1,f:(v,r)=>r.isNew?`${when(v)}`:'<span class="sub">Workbook</span>'},

  }else if(S.tab==='addSales'){
    const all=SALES.map(s=>({...s,id:s.bill?s.bill.id:'',by:s.bill?s.bill.by:'',at:s.bill?s.bill.at||0:0}));
    let rows=applyF('latS',all).filter(r=>match('latS',r,['sku','party','sm','sort','lot','mrp']));
    rows.sort((a,b)=>b.date.localeCompare(a.date)||(b.at-a.at));
    const pcs=rows.reduce((a,r)=>a+r.qty,0); const shown=rows.slice(0,400);
    const nm=await names(shown.map(r=>r.by));
    if(!document.getElementById('recent'))return;
    box.innerHTML=filterBar('latS',all)+`<p class="sub">${fmt(rows.length)} sale lines · ${fmt(pcs)} pcs${rows.length>400?' · showing latest 400':''}</p>`+
      table('latS',[{k:'date',label:'Date',f:(v,r)=>fd(v)+(r.edited?'<span class="pill p-warn" style="margin-left:6px">EDITED</span>':'')},{k:'sm',label:'Salesman',cls:'hl',f:smTag},{k:'party',label:'Party'},{k:'sku',label:'SKU',cls:'mono',f:(v,r)=>esc(v)+(r.isNew?'<span class="pill p-new">NEW</span>':'')},
      {k:'qty',label:'Qty',num:1,f:fmt},{k:'series',label:'Series'},{k:'sort',label:'Sort No'},{k:'fit',label:'Fit'},{k:'mrp',label:'MRP'},{k:'lot',label:'Lot',cls:'mono'},
      {k:'at',label:'Entered',nosort:1,f:(v,r)=>r.isNew?`${when(v)}`:'<span class="sub">Workbook</span>'},
      {k:'id',label:'',nosort:1,f:(v,r)=>canDel?`<button class="btn" data-edit="S|${esc(r.key)}">Edit</button>`+(r.isNew?` <button class="btn danger" data-del="bill|${esc(v)}">Delete bill</button>`:''):''}],shown,null,{nosort:1});
  }

function closeEdit(){document.getElementById('editModal').hidden=true;EDIT=null}
async function removeEdit(key){
  if(Store.mode==='live'){await Store.db.collection(COL('edits')).doc(docIdFor(key)).delete()}
  else{ENTRIES.edits=ENTRIES.edits.filter(x=>x.key!==key);EBY[BRAND].edits=ENTRIES.edits;saveLocal()}
}
async function putEdit(key,changes){
  const prev=(ENTRIES.edits||[]).find(x=>x.key===key)||{};
  const rec={...prev,...changes,key,by:Store.uid||'',at:Date.now()};delete rec.id;
  if(Store.mode==='live'){try{await Store.db.collection(COL('edits')).doc(docIdFor(key)).set(rec)}catch(err){throw dbErr(err)}}
  else if(Store.mode==='local'){const arr=ENTRIES.edits;const i=arr.findIndex(x=>x.key===key);const row={id:docIdFor(key),...rec};if(i>-1)arr[i]=row;else arr.push(row);saveLocal();onEntries()}
  else throw new Error('Still connecting. Try again in a moment.');
}
async function saveEdit(del){
  if(!EDIT)return;const g=id=>{const el=document.getElementById(id);return el?el.value:''};const h=document.getElementById('e_hint');
  const fail=m=>{h.className='hint bad';h.textContent=m;toast(m,1)};
  try{
    if(EDIT.kind==='I'){
      const k=EDIT.key,o=EDIT.orig;
      if(del){if(EDIT.sold)return fail(`${k} has ${fmt(EDIT.sold)} pcs sold. Delete those sales first.`);await putEdit('I:'+k,{deleted:true});closeEdit();return toast(`Deleted ${k}`)}
      const n={date:g('e_date'),lot:normTxt(g('e_lot')),qty:parseInt(g('e_qty'),10),sort:normTxt(g('e_sort')),fit:normTxt(g('e_fit')),mrp:normTxt(g('e_mrp'))};
      if(!n.lot||!n.sort||!n.fit||!n.mrp)return fail('Lot no, sort no, fit and MRP cannot be empty.');
      if(!(n.qty>0))return fail('Inward qty must be a whole number above 0.');
      if(n.qty<EDIT.sold)return fail(`${fmt(EDIT.sold)} pcs of ${k} are already sold, so inward can't be less than ${fmt(EDIT.sold)}.`);
      const lp=LOTPCS[n.lot];
      if(lp){const others=(LOTINW[n.lot]||0)-(o.lot===n.lot?o.qty:0);if(others+n.qty>lp)return fail(`Lot ${n.lot} has ${fmt(lp)} pcs. Only ${fmt(Math.max(0,lp-others))} can go to ${k}.`)}
      const ch={};Object.keys(n).forEach(f=>{if(n[f]!==o[f])ch[f]=n[f]});
      if(!Object.keys(ch).length){closeEdit();return toast('No changes')}
      await putEdit('I:'+k,ch);closeEdit();toast(`Saved changes to ${k}`);
    }else{
      const o=EDIT.orig;
      if(del){await putEdit('S:'+EDIT.key,{deleted:true});closeEdit();return toast(`Deleted sale line ${o.sku} × ${o.qty}`)}
      const n={date:g('e_date'),qty:parseInt(g('e_qty'),10),party:normTxt(g('e_party')),sm:normTxt(g('e_sm'))};
      if(!n.date||!n.party||!n.sm)return fail('Date, party and salesman cannot be empty.');
      if(!(n.qty>0))return fail('Qty must be a whole number above 0.');
      if(n.qty-o.qty>EDIT.bal)return fail(`Only ${fmt(EDIT.bal)} more pcs of ${o.sku} in stock. Qty can be at most ${fmt(o.qty+EDIT.bal)}.`);
      const ch={};Object.keys(n).forEach(f=>{if(n[f]!==o[f])ch[f]=n[f]});
      if(!Object.keys(ch).length){closeEdit();return toast('No changes')}
      await putEdit('S:'+EDIT.key,ch);closeEdit();toast(`Saved changes to sale ${o.sku}`);
    }
  }catch(err){fail(err.message||'Could not save. Try again.')}
}
document.getElementById('editForm').addEventListener('submit',e=>{e.preventDefault();saveEdit(false)});
document.getElementById('editModal').addEventListener('click',e=>{
  if(e.target.id==='editModal'||e.target.id==='e_cancel')return closeEdit();
  if(e.target.id==='e_del'){const b=e.target;if(!b.classList.contains('armed')){const t0=b.textContent;b.classList.add('armed');b.textContent='Confirm delete';setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent=t0}},4000);return}saveEdit(true)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('editModal').hidden)closeEdit()});
async function deleteEntry(kind,id){
  if(kind==='inward'){
    const e=ENTRIES.inward.find(x=>x.id===id);if(!e)return;
    const n=soldOf(normSku(e.sku));
    if(n>0)return toast(`${e.sku} has ${fmt(n)} pcs of sales. Delete those bills first.`,1);
  }
  try{
    if(Store.mode==='live')await Store.db.collection(COL(kind==='inward'?'inward':'bills')).doc(id).delete();
    else{const arr=kind==='inward'?ENTRIES.inward:ENTRIES.bills;const i=arr.findIndex(x=>x.id===id);if(i>-1)arr.splice(i,1);saveLocal();onEntries()}
    toast('Deleted');
  }catch(err){toast(dbErr(err).message,1)}
}
function dbErr(err){
  const c=err&&err.code||'';
  if(c==='permission-denied'||c==='unauthenticated')return new Error('Firebase blocked this. Add the Lot Inventory rule in Firestore → Rules (see setup steps).');
  if(c==='resource-exhausted')return new Error('Firebase daily limit reached. Try again tomorrow or upgrade the Firebase plan.');
  if(c==='unavailable'||c==='deadline-exceeded')return new Error('No internet connection. Check your connection and try again.');
  return new Error((err&&err.message)||'Could not save. Try again.');
}

  if(t.id==='i_sku')checkSku();

view.addEventListener('click',e=>{
  const sug=e.target.closest('[data-sug]');if(sug){const el=document.getElementById('i_sku');el.value=sug.dataset.sug;checkSku();document.getElementById('i_lot').focus();return}

  const rm=e.target.closest('[data-rm]');if(rm){LINES.splice(+rm.dataset.rm,1);if(!LINES.length)LINES=[{sku:'',qty:''}];drawLines();return}
  const nd=e.target.closest('[data-nodate]');if(nd){S.noDate=!S.noDate;renderRecent();return}
  const ed=e.target.closest('[data-edit]');if(ed){const[k,...rest]=ed.dataset.edit.split('|');openEdit(k,rest.join('|'));return}
  const dl=e.target.closest('[data-del]');
  if(dl){if(!dl.classList.contains('armed')){const orig=dl.textContent;dl.classList.add('armed');dl.textContent='Confirm delete';setTimeout(()=>{if(dl.isConnected){dl.classList.remove('armed');dl.textContent=orig}},4000);return}
    const[kind,id]=dl.dataset.del.split('|');dl.disabled=true;deleteEntry(kind,id);return}
  const by=e.target.closest('[data-by]');if(by){S.by=by.dataset.by;ls('uthlot.by',S.by);render();return}
  const pv=e.target.closest('[data-pv]');if(pv){S.pview=pv.dataset.pv;render();return}
  const al=e.target.closest('[data-alert]');if(al){S.alert=al.dataset.alert;render();return}
  const sk=e.target.closest('[data-skus]');if(sk){S.skuStatus=sk.dataset.skus;render();return}
  if(e.target.id==='copySm'){const s=window._smSummary;copyTSV([['From',S.from,'To',S.to],['Rank','Salesman','Pcs','Share %','Parties','Top Series','Qty','Top Sort No','Qty','Top SKU','Qty','Top MRP','Qty','Top Fit','Qty','Top Party','Qty'],
    ...s.map(r=>[r.rank,r.sm,r.q,(r.share*100).toFixed(1),r.parties,...['series','sort','sku','mrp','fit','party'].flatMap(k=>r[k]?r[k]:['',''])])]);return}
});

/* ---------- store wiring ---------- */
function onEntries(){rebuild();if(S.preset)presetBounds();syncRange();render();drawStatus()}
function saveLocal(){}
function drawStatus(){
  const c=document.getElementById('liveChip');
  const m=!Store.canWrite?['ro','View only']:Store.mode==='live'?(navigator.onLine===false?['local','Offline']:['on','Live · synced']):['','Connecting…'];
  c.className='live '+m[0];c.querySelector('span').textContent=m[1];
  if(FORM_TABS.has(S.tab)){const btns=view.querySelectorAll('#inwSave,#salSave');btns.forEach(b=>b.disabled=!Store.canWrite)}
}
/* ---------- workbook data in Firebase (stored as a few large records to keep reads low) ---------- */
function parseBase(docs){
  const out={inward:[],sales:[]};let meta=null;
  docs.sort((a,b)=>a.id.localeCompare(b.id)).forEach(d=>{const x=d.data();
    if(d.id==='meta'){meta=x;return}
    const k=d.id.startsWith('inward_')?'inward':d.id.startsWith('sales_')?'sales':null;
    if(k&&x.rows){try{out[k].push(...JSON.parse(x.rows))}catch(e){console.error('bad chunk',d.id)}}});
  return {data:out,meta};
}
const baseEmpty=b=>BRANDS[b].loaded&&!BRANDS[b].data.inward.length&&!BRANDS[b].data.sales.length;
function importPanel(){
  if(Store.mode!=='live'||!baseEmpty(BRAND))return '';
  return `<div class="banner" style="display:flex;flex-direction:column;gap:8px"><b>No workbook data in Firebase for ${BRANDS[BRAND].label} yet.</b>
    <span>Pick <b>${esc(BRANDS[BRAND].file)}</b> to upload its INWARD and SALES sheets. You only do this once; after that, everything is entered in the app.</span>
    <span><input type="file" id="importFile" accept=".xlsx,.xls"> <span class="sub" id="importMsg"></span></span></div>`;
}
function localEntries(b){try{const sv=JSON.parse(localStorage.getItem(BRANDS[b].lsKey)||'null');if(!sv)return null;const n=(sv.inward||[]).length+(sv.bills||[]).length+(sv.lots||[]).length+(sv.edits||[]).length;return n?sv:null}catch(e){return null}}
function migratePanel(){
  const sv=localEntries(BRAND);if(!sv||Store.mode!=='live'||baseEmpty(BRAND))return '';
  return `<div class="banner" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><span><b>This browser has entries from the old version:</b> ${(sv.inward||[]).length} inward, ${(sv.bills||[]).length} bills, ${(sv.edits||[]).length} corrections. Upload them to Firebase so everyone sees them.</span>
    <button class="btn gold" id="migrateBtn">Upload to Firebase</button></div>`;
}
function readWorkbook(file){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('Could not read the file.'));
    fr.onload=()=>{try{
      if(typeof XLSX==='undefined')throw new Error('The Excel reader did not load. Check your internet and reload.');
      const wb=XLSX.read(new Uint8Array(fr.result),{type:'array',cellDates:true});
      const sheet=n=>{const k=wb.SheetNames.find(s=>s.trim().toUpperCase()===n);if(!k)throw new Error(`No "${n}" sheet found in ${file.name}.`);return XLSX.utils.sheet_to_json(wb.Sheets[k],{defval:''})};
      const norm=o=>{const r={};Object.keys(o).forEach(k=>r[k.trim().toUpperCase().replace(/\s+/g,'_')]=o[k]);return r};
      const dt=v=>{if(v instanceof Date)return ymd(new Date(v.getTime()+43200000));if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:''}
        const m=String(v).match(/(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return ''};
      const str=v=>String(v??'').trim().replace(/\.0$/,'');
      const inward=sheet('INWARD').map(norm).filter(r=>str(r.SKU_CODE)).map(r=>[str(r.SKU_CODE),str(r.LOT_NO),dt(r.ACTIVE_DATE),+r.INWARD_QTY||0,str(r.FIT),str(r.MRP),str(r.SORT_NO)]);
      const sales=sheet('SALES').map(norm).filter(r=>str(r.SKU_CODE)&&r.SOLD_DATE!=='').map(r=>[dt(r.SOLD_DATE),str(r.SKU_CODE),+r.SOLD_QTY||0,str(r.PARTY),str(r.SALESMAN)]).filter(r=>r[0]);
      if(!inward.length)throw new Error('The INWARD sheet came back empty.');
      res({inward,sales});
    }catch(e){rej(e)}};fr.readAsArrayBuffer(file)});
}
async function importBase(file){
  const msg=document.getElementById('importMsg');const say=m=>{if(msg)msg.textContent=m};
  try{
    say('Reading '+file.name+'…');
    const d=await readWorkbook(file);
    const col=Store.db.collection(COL('base'));
    const existing=await col.limit(1).get();
    if(!existing.empty)throw new Error('Workbook data is already in Firebase for '+BRANDS[BRAND].label+'. It can only be imported once.');
    say(`Uploading ${d.inward.length} SKUs and ${d.sales.length} sales lines…`);
    const batch=Store.db.batch();const CH=1200;
    for(let i=0;i*CH<d.inward.length;i++)batch.set(col.doc('inward_'+String(i).padStart(3,'0')),{rows:JSON.stringify(d.inward.slice(i*CH,(i+1)*CH))});
    for(let i=0;i*CH<d.sales.length;i++)batch.set(col.doc('sales_'+String(i).padStart(3,'0')),{rows:JSON.stringify(d.sales.slice(i*CH,(i+1)*CH))});
    batch.set(col.doc('meta'),{file:file.name,by:Store.uid||'',at:Date.now(),inward:d.inward.length,sales:d.sales.length});
    await batch.commit();
    toast(`Imported ${fmt(d.inward.length)} SKUs and ${fmt(d.sales.length)} sales lines into ${BRANDS[BRAND].label}`);
  }catch(err){say(err.code?dbErr(err).message:err.message);toast(err.code?dbErr(err).message:err.message,1)}
}
async function migrateLocal(){
  const b=BRAND,sv=localEntries(b);if(!sv)return;
  const btn=document.getElementById('migrateBtn');if(btn){btn.disabled=true;btn.textContent='Uploading…'}
  try{
    let skipped=0;const db=Store.db,c=n=>db.collection(BRANDS[b].pre+n);
    for(const e of (sv.inward||[])){const ref=c('inward').doc(docIdFor(normSku(e.sku)));const s=await ref.get();if(s.exists){skipped++;continue}const {id,...rest}=e;await ref.set({...rest,by:rest.by||Store.uid||''})}
    const batch=db.batch();
    (sv.lots||[]).forEach(l=>{const {id,...rest}=l;batch.set(c('lots').doc(docIdFor(normTxt(l.lot))),rest)});
    (sv.bills||[]).forEach(x=>{const {id,...rest}=x;batch.set(c('bills').doc(id),{...rest,by:rest.by||Store.uid||''})});
    (sv.edits||[]).forEach(x=>{const {id,...rest}=x;batch.set(c('edits').doc(docIdFor(x.key)),{...rest,by:rest.by||Store.uid||''})});
    await batch.commit();
    try{localStorage.removeItem(BRANDS[b].lsKey)}catch(e){}
    toast(`Uploaded to Firebase${skipped?` · ${skipped} SKU(s) skipped because they already exist`:''}`);
    render(true);
  }catch(err){toast(dbErr(err).message,1);if(btn){btn.disabled=false;btn.textContent='Upload to Firebase'}}
}
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0])importBase(e.target.files[0])});
document.addEventListener('click',e=>{if(e.target.id==='migrateBtn')migrateLocal()});

let STARTED=false,WELCOME_PENDING=false;const FIRED=new Set();
function maybeWelcome(){if(WELCOME_PENDING&&FIRED.size>=8){WELCOME_PENDING=false;showWelcome()}}
function initStore(){
  if(STARTED)return;STARTED=true;
  const db=firebase.firestore();
  Store.mode='live';Store.db=db;Store.uid='';
  const fail=err=>{console.error(err);toast(err&&err.code==='permission-denied'?'Firebase blocked the inventory data. Add the Lot Inventory rule in Firestore → Rules (see setup steps).':dbErr(err).message,1)};
  Object.keys(BRANDS).forEach(b=>{
    ['inward','lots','bills','edits'].forEach(n=>{
      db.collection(BRANDS[b].pre+n).onSnapshot(s=>{EBY[b][n]=s.docs.map(d=>({id:d.id,...d.data()}));if(b===BRAND)onEntries();FIRED.add(b+n);maybeWelcome()},fail);
    });
  });
  window.addEventListener('online',drawStatus);window.addEventListener('offline',drawStatus);
  drawStatus();
  if(FORM_TABS.has(S.tab))render(true);
}

/* ---------- boot ---------- */
function drawBrand(){
  document.getElementById('appTitle').innerHTML=BRANDS[BRAND].title;
  document.querySelectorAll('#brandSwitch button').forEach(b=>b.classList.toggle('on',b.dataset.brand===BRAND));
  document.title=BRAND==='uth'?'UTH Lot Inventory':'Reckless Lot Inventory';
}
function switchBrand(b){
  if(b===BRAND||!BRANDS[b])return;
  BRAND=b;BASE=BRANDS[b].data;ENTRIES=EBY[b];ls('uthlot.brand',b);
  S.sorts={};S.q={};S.alert='ALL';S.smFilter='ALL';S.skuStatus='ALL';delete S.f_latI;delete S.f_latS;
  LINES=[{sku:'',qty:''}];
  rebuild();if(!S.preset)S.preset='latest';presetBounds();syncRange();drawBrand();render(true);
  toast(`Switched to ${BRANDS[b].label} inventory`);
}
document.getElementById('brandSwitch').addEventListener('click',e=>{const b=e.target.closest('[data-brand]');if(b)switchBrand(b.dataset.brand)});
/* ---------- password (Firebase sign-in) + welcome ---------- */
function brandStats(b){
  const d=BRANDS[b].data,e=EBY[b];
  const inw=d.inward.reduce((a,r)=>a+(+r[3]||0),0)+e.inward.reduce((a,r)=>a+(+r.qty||0),0);
  const sl=d.sales.map(r=>({date:r[0],qty:+r[2]||0})).concat(e.bills.flatMap(x=>(x.lines||[]).map(l=>({date:x.date,qty:+l.qty||0}))));
  const sold=sl.reduce((a,r)=>a+r.qty,0); const last=sl.map(r=>r.date).sort().pop()||'';
  const lastQty=sl.filter(r=>r.date===last).reduce((a,r)=>a+r.qty,0);
  return {bal:inw-sold,last,lastQty};
}
function showWelcome(){
  const h=new Date().getHours();
  const greet=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  document.getElementById('wDate').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('wHello').textContent=`${greet}, Samarth 👋`;
  document.getElementById('wSub').textContent=`Welcome back to UTH Culture & Reckless Lot Inventory. Here's where stock stands.`;
  const u=brandStats('uth'),r=brandStats('reckless');
  const st=(cls,k,v,d)=>`<div class="wstat ${cls}"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
  document.getElementById('wStats').innerHTML=
    st('','UTH stock',fmt(u.bal),'pcs in hand')+st('g','Reckless stock',fmt(r.bal),'pcs in hand')+
    st('','UTH last sale',fd(u.last),fmt(u.lastQty)+' pcs that day')+st('g','Reckless last sale',fd(r.last),fmt(r.lastQty)+' pcs that day');
  document.getElementById('welcome').hidden=false;
  setTimeout(()=>document.getElementById('wGo').focus(),50);
}
const PW_HASH=-772065909;
const hashPw=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return h};
function unlockApp(){try{sessionStorage.setItem('uthlot.unlocked','1')}catch(e){}document.getElementById('gate').hidden=true;WELCOME_PENDING=true;initStore();maybeWelcome()}
document.getElementById('gateForm').addEventListener('submit',e=>{
  e.preventDefault();const el=document.getElementById('gatePw');const card=e.currentTarget;
  if(hashPw(el.value.trim().toUpperCase())===PW_HASH){document.getElementById('gateErr').textContent='';el.value='';unlockApp()}
  else{document.getElementById('gateErr').textContent='Wrong password. Try again.';card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');el.select()}
});
document.getElementById('wGo').addEventListener('click',()=>{document.getElementById('welcome').hidden=true});
document.getElementById('lockBtn').addEventListener('click',()=>{try{sessionStorage.removeItem('uthlot.unlocked')}catch(e){}location.reload()});
(function(){let ok=false;try{ok=sessionStorage.getItem('uthlot.unlocked')==='1'}catch(e){}
  if(ok){document.getElementById('gate').hidden=true;initStore()}else setTimeout(()=>document.getElementById('gatePw').focus(),50)})();
(function(){
  drawBrand();
  rebuild();
  const t=ls('uthlot.tab');if(t&&VIEWS[t])S.tab=t;
  const b=ls('uthlot.by');if(b&&DIMS.some(d=>d[0]===b))S.by=b;
  drawTabs();presetBounds();syncRange();render(true);drawStatus();
})();
</script>
